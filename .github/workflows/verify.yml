name: verify

# P1-D — PR / push 시 sync:check + lint:all 자동 실행
# pre-commit hook(.husky/pre-commit)이 로컬 게이트, CI는 push 후 검증.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 손으로 돌릴 수 있게 열어 둔다. 머지했는데 실행이 안 잡히는 일이 실제로 있었다
  # (2026-08-07 Actions 장애 — push 이벤트가 통째로 유실됐다).
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run verify (sync:check + lint:all)
        run: npm run verify

      - name: Lint prose token references
        run: npm run lint:prose

      - name: Test Tailwind v4 exports (build + namespace 검증)
        run: npm run test:exports

      - name: Build DTCG export (smoke test)
        run: npm run export:dtcg

      - name: Verify DTCG export produced
        run: test -s exports/tokens.dtcg.json || (echo "tokens.dtcg.json missing or empty"; exit 1)

  # 문서 사이트 — 원본(DESIGN*.md · specs)이 사이트로 옮겨지는지 본다.
  # 원본의 `##` 절 이름이 바뀌거나 마크다운이 깨지면 여기서 멈춘다.
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

  trigger-deploy:
    needs: [verify, site]
    # PR 만 빼면 된다. `== 'push'` 로 못 박으면 수동 실행이 빌드만 하고 끝나
    # 정작 필요한 배포를 건너뛴다.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins Deploy
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          # 토큰은 Jenkins 잡 설정에만 있는 값이다. 레포에 적어 두면 그걸 아는 사람 누구나
          # 인증 없이 배포를 걸 수 있다 — Jenkins 는 인터넷에서 열려 있다.
          DEPLOY_TOKEN: ${{ secrets.JENKINS_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          # 시크릿에 줄바꿈이나 공백이 딸려 오면 curl 이 URL 을 못 읽는다(exit 3).
          # 값이 마스킹돼 로그로는 안 보이니 여기서 털어 낸다.
          BASE="$(printf '%s' "${JENKINS_URL}" | tr -d '[:space:]')"
          BASE="${BASE%/}"
          case "${BASE}" in
            http://*|https://*) ;;
            "") echo "::error::JENKINS_URL 이 비어 있습니다."; exit 1 ;;
            *) echo "::error::JENKINS_URL 은 http:// 또는 https:// 로 시작해야 합니다."; exit 1 ;;
          esac
          # 토큰도 같은 사고를 당한다 — 붙여넣다 딸려 온 줄바꿈이 쿼리스트링에 그대로 들어간다.
          TOKEN="$(printf '%s' "${DEPLOY_TOKEN}" | tr -d '[:space:]')"
          # 빈 토큰으로 부르면 Jenkins 가 404 를 주고 curl -f 가 잡지만, 로그만 보면
          # 원인이 URL 오타인지 토큰 미설정인지 알 수 없다. 여기서 이름을 대고 죽는다.
          if [ -z "${TOKEN}" ]; then
            echo "::error::JENKINS_DEPLOY_TOKEN 시크릿이 비어 있습니다."
            exit 1
          fi
          # -f 가 없으면 404·500 에도 curl 이 0 을 돌려준다. 토큰을 틀리게 적어도
          # 초록불이 뜨고 배포는 안 되는 상태가 되므로, HTTP 오류를 실패로 받는다.
          curl -fsS -X POST "${BASE}/generic-webhook-trigger/invoke?token=${TOKEN}"
