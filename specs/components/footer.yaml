# Footer 의 수치 원본입니다. 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md 를 따릅니다.
#
# 사이트 맨 아래의 바닥입니다. 정해진 한 덩어리가 아니라 자리마다 필요한 블록을 골라 조립합니다.
# 필수 블록은 없고 위 → 아래 순서만 있습니다:
#   탐색 영역(navigation) — 브랜드 · 국가 선택 · 사이트맵 열
#   선(divider) — 두 영역을 함께 쓸 때만
#   안내 영역(info) — 정책 링크 · 사업자 정보 · 연락처 · 저작권 · 소셜 링크
# groo-home 의 짜임은 브랜드 · 사이트맵(서비스 · 계정) | 선 | 정책 링크 · 안내 글 · 저작권입니다.
# 사업자 정보 · 연락처 · 소셜은 값이 정해질 때까지 블록만 두고 비워 둡니다(지어내지 않습니다).
#
# 축 — width(1280 이상 · 미만 — 좌우 여백과 저작권 · 소셜의 배치) · linkSize(링크 글 — large · medium).
# 상태(올림 · 누름 · 포커스)는 링크 하나에 걸립니다.

name: Footer

slots:
  root: 바닥 — <footer>(contentinfo). 가운데 정렬된 틀 안에 탐색 영역 · 선 · 안내 영역을 세로로
  topLine: 바닥 위 선 — 페이지 본문과 가른다. 화면 폭 전체
  navigation: 탐색 영역 — 브랜드 · 국가 선택 · 사이트맵을 한 줄에, 넘치면 줄을 바꾼다
  brand: 브랜드 묶음 — 이름 + 소개 한 줄
  brandName: 브랜드 이름 — 글자 로고 "그루"
  brandIntro: 브랜드 소개 — 한 줄(넘치면 줄을 바꾼다)
  country: 국가 선택 — 나라 링크 목록. groo 는 한국어 사이트 하나라 두지 않는다
  sitemap: 사이트맵 — <nav aria-label="사이트 지도">. 열을 가로로, 넘치면 줄을 바꾼다
  column: 사이트맵 열 — 열 제목 + 링크 목록
  columnTitle: 열 제목 — "서비스" · "계정"
  columnLinks: 열의 링크 목록
  divider: 선 — 탐색 영역과 안내 영역을 함께 쓸 때만
  info: 안내 영역 — 정책 링크 · 사업자 정보 · 연락처 · 저작권 줄을 세로로
  policy: 정책 링크 줄 — 처리방침 · 약관. 넘치면 줄을 바꾼다
  infoText: 안내 글 — 사업자 정보 · 연락처 · 안내 문구. " | " 로 잇고, 묶음이 바뀌면 줄을 바꾼다
  bottom: 저작권 줄 — 저작권(앞) + 소셜 링크(끝)
  copyright: 저작권 — "© 2026 그루"
  social: 소셜 링크 묶음 — 아이콘만 있는 ghost 버튼. 값이 생기면
  link: 링크(Footer Link Text) — 밑줄 없이 색으로 올림 · 누름을 알린다
  linkIcon: 링크 뒤 아이콘 — 새 탭 · 사이트 밖으로 나가는 링크만 ↗(lucide arrow-up-right)
  focusRing: 링크의 키보드 포커스 링

variants:
  width:
    wide: 1280 이상 — 좌우 32, 저작권 · 소셜이 한 줄 양 끝(기본)
    narrow: 1280 미만 — 좌우 24, 소셜은 저작권 아래
  linkSize:
    medium: 정책 링크 · 국가 링크 — 14 / 19 · 500 `fg-neutral-muted`(기본)
    large: 사이트맵 링크 — 16 / 22 · 500 `fg-neutral`

defaults:
  width: wide
  linkSize: medium

states:
  enabled: 기본
  hovered: 웹 — 링크 글자색이 바뀐다(밑줄 없음)
  focused: 키보드 포커스에만 링크 둘레 링
  pressed: 누르는 동안 — 올림과 같은 색

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      root:
        maxWidth: { value: $layout-max-content, note: "1040 — 콘텐츠 레이아웃의 기본 최대 폭" }
        marginX: { value: auto, note: "가운데 정렬" }
        paddingY: { value: $spacing-x10, note: "위아래 40" }
        gap: { value: $spacing-x10, note: "탐색 영역 ↔ 선 ↔ 안내 영역 40" }
        background: { value: transparent, note: "페이지 바탕 그대로" }
        landmark: { value: contentinfo, note: "<footer> — article · section 안에 두지 않는다(그러면 랜드마크가 아니다). 한 페이지에 하나" }
      topLine:
        height: 1px
        background: { value: $color-stroke-neutral-subtle, note: "본문과 바닥을 가른다 — 화면 폭 전체(틀 1040 밖까지)" }
      navigation:
        gap: { value: $spacing-x8, note: "브랜드 ↔ 사이트맵 32 · 줄을 바꾸면 위아래도 32" }
        wrap: { value: wrap, note: "넘치면 사이트맵이 브랜드 아래로" }
      brand:
        flex: { value: 1 1 240px, note: "남은 폭을 차지하고, 240 아래로 줄면 사이트맵이 아래로 내려간다" }
        minWidth: { value: 120px, note: "브랜드 묶음 최소 120" }
        gap: { value: $spacing-x2, note: "이름 ↔ 소개 8" }
      brandName:
        typography: { value: $text-t7, note: "20 / 27 — 글자 로고(groo 는 로고 그림이 없다)" }
        fontWeight: { value: 700, note: "bold" }
        foreground: { value: $color-fg-neutral, note: "흰 면 16.41 · 다크 13.42. groo-home 은 제 파랑(--blue)을 쓴다" }
      brandIntro:
        typography: { value: $text-t3, note: "13 / 18" }
        fontWeight: 400
        foreground: { value: $color-fg-neutral-subtle, note: "흰 면 5.50 · 다크 6.09" }
        maxWidth: { value: 340px, note: "한 줄이 너무 길지 않게 — 넘치면 줄을 바꾼다(자르지 않는다)" }
      country:
        gap: { value: $spacing-x3, note: "나라 링크 사이 12 · 늘 세로 목록" }
      sitemap:
        gap: { value: $spacing-x8, note: "열 사이 32 · 넘치면 줄을 바꾼다" }
        wrap: wrap
        name: { value: 사이트 지도, note: "<nav aria-label=\"사이트 지도\"> — 위 머리의 주 메뉴 nav 와 이름으로 갈린다" }
      column:
        minWidth: { value: 100px, note: "열 최소 100" }
        gap: { value: $spacing-x4, note: "열 제목 ↔ 링크 16" }
      columnTitle:
        typography: { value: $text-t3, note: "13 / 18" }
        fontWeight: { value: 500, note: "medium" }
        foreground: { value: $color-fg-neutral-muted, note: "흰 면 7.11 · 다크 7.70" }
        element: { value: 글(머리말 아님), note: "열 제목은 목록의 이름이다 — 링크 목록을 aria-labelledby 로 잇는다" }
      columnLinks:
        gap: { value: $spacing-x4, note: "링크 사이 16" }
      divider:
        height: 1px
        background: { value: $color-stroke-neutral-subtle, note: "선은 이 색 하나 — 틀 안 폭. 장식(role 없음)" }
      info:
        gap: { value: $spacing-x4, note: "정책 줄 ↔ 안내 글 ↔ 저작권 줄 16" }
      policy:
        columnGap: { value: $spacing-x6, note: "링크 사이 24" }
        rowGap: { value: $spacing-x2, note: "줄을 바꾸면 위아래 8" }
        wrap: wrap
      infoText:
        typography: { value: $text-t3, note: "13 / 18" }
        fontWeight: 400
        foreground: { value: $color-fg-neutral-subtle, note: "흰 면 5.50 · 다크 6.09" }
        separator: { value: " | ", note: "사업자 정보 · 연락처는 항목을 \" | \" 로 잇고, 묶음이 바뀌면 줄을 바꾼다. 안내 문구는 문장 그대로" }
      bottom:
        justifyContent: { value: space-between, note: "저작권 앞 · 소셜 끝" }
        alignItems: center
        gap: { value: $spacing-x4, note: "줄을 바꾸면 16" }
        wrap: wrap
      copyright:
        typography: { value: $text-t4, note: "14 / 19" }
        fontWeight: 500
        foreground: { value: $color-fg-neutral-muted, note: "흰 면 7.11 · 다크 7.70" }
        text: { value: "© {해} 그루", note: "해는 그리는 때(빌드 · 화면)의 해. 네 곳(홈 · SSO 로그인 · HR 문서 · Desk 설명서) 한 벌" }
        position: { value: 안내 영역의 마지막, note: "저작권은 맨 끝" }
      social:
        gap: { value: $spacing-x6, note: "아이콘 버튼 사이 24" }
        button: { value: "Button ghost · large · iconOnly", note: "48(groo large) · 아이콘 24 · 이름 필수(\"그루 인스타그램\") · 바깥 여백만큼 끝을 맞춘다. 값이 생기면 이 자리" }
      link:
        display: { value: inline-flex, note: "글 + 뒤 아이콘" }
        gap: { value: $spacing-x1, note: "글 ↔ ↗ 4" }
        textDecoration: { value: none, note: "밑줄 없음 — 올림 · 누름은 색으로" }
        cursor: pointer
        transitionProperty: color
        transitionDuration: $motion-duration-color-transition
        transitionEasing: $motion-ease-easing
        newTab: { value: 사이트 밖으로 나가는 링크만, note: "target=_blank + rel=noopener + 보이지 않는 \"(새 탭)\" — 같은 사이트 안 링크는 같은 탭" }
      linkIcon:
        display: { value: 새 탭 링크만, note: "↗(lucide arrow-up-right) — 사이트 밖 · 새 탭으로 여는 링크에만. 장식(aria-hidden) — 뜻은 \"(새 탭)\" 글이 알린다" }
        color: { value: currentColor, note: "링크 글자색을 따른다" }
      focusRing:
        width: { value: 2px, note: "키보드로 옮길 때만" }
        offset: 2px
        radius: { value: $radius-r1, note: "글 둘레 4" }
        color: $color-stroke-focus-ring

  # ── 폭 ────────────────────────────────────────────────
  - when: { width: wide }
    enabled:
      root:
        paddingX: { value: $spacing-x8, note: "좌우 32" }
      bottom:
        direction: { value: row, note: "저작권 · 소셜이 한 줄 양 끝" }
  - when: { width: narrow }
    enabled:
      root:
        paddingX: { value: $spacing-global-gutter, note: "좌우 24 — groo 화면 가장자리 규칙" }
      bottom:
        direction: { value: column, note: "소셜은 저작권 아래 — 왼쪽 정렬" }
        alignItems: flex-start

  # ── 링크 크기 ─────────────────────────────────────────
  - when: { linkSize: large }
    enabled:
      link:
        typography: { value: $text-t5, note: "16 / 22 — 사이트맵 링크" }
        fontWeight: 500
        foreground: { value: $color-fg-neutral, note: "흰 면 16.41 · 다크 13.42" }
      linkIcon:
        size: { value: 14px, note: "large 링크 뒤 아이콘 14" }
    hovered:
      link:
        foreground: { value: $color-fg-neutral-subtle, note: "옅어진다 — 5.50 · 6.09" }
    pressed:
      link:
        foreground: $color-fg-neutral-subtle
  - when: { linkSize: medium }
    enabled:
      link:
        typography: { value: $text-t4, note: "14 / 19 — 정책 · 국가 링크" }
        fontWeight: 500
        foreground: { value: $color-fg-neutral-muted, note: "흰 면 7.11 · 다크 7.70" }
      linkIcon:
        size: { value: 12px, note: "medium 링크 뒤 아이콘 12" }
    hovered:
      link:
        foreground: { value: $color-fg-neutral, note: "짙어진다 — 16.41 · 13.42" }
    pressed:
      link:
        foreground: $color-fg-neutral

motion:
  "링크 — 글자색":
    duration: $motion-duration-color-transition
    easing: $motion-ease-easing
    properties: [color]
    note: "올림 · 누름"
