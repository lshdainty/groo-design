# Side Navigation 의 수치 원본 — 구조는 SEED Side Navigation(2026-10-04 사용자 결정, 화면 틀 · 이동 비교 페이지 8A · 9B ·
# "따라오는 것"). 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 데스크톱(768 이상)의 주 메뉴 — 화면 왼쪽 세로 띠(사이드바). 1280 이상은 펼침 240, 768 ~ 1279 는 아이콘만 56 으로 저절로 접힌다.
# 손으로 접고 펼 수 있고 손으로 정한 상태는 기억한다. 768 미만에서는 없다 — Desk 웹은 Bottom Navigation, HR 은 ☰ 로 여는
# 왼쪽 Side Panel 에 같은 항목을 담는다.
# 하위가 있는 항목은 펼치기만 하고(이동 없음), 하위가 지금 화면이면 저절로 펼쳐진다. 접혔을 때 하위는 오른쪽 펼침 메뉴(Menu 모양),
# 하위가 없는 항목의 이름은 말풍선(Help Bubble 툴팁)이다.
#
# 수치의 출처 — SEED Side Navigation 은 rootage 가 없고 레시피(qvism-preset side-navigation)에 px 로 있다. 그 값을 groo 토큰에
# 맞췄다(새 토큰 없음). 폭 240 · 56 은 DESIGN.md v101 의 layout-sidebar · layout-sidebar-collapsed 다.
#
# SEED 와 다른 자리(side-navigation.md 의 "SEED 와 다른 점")
#   - 바탕은 흰 면 bg-layer-default + 오른쪽 안쪽 1px stroke-neutral-subtle — SEED tone=neutral 은 회색(gray-100) 면이다.
#     groo 본문이 회색(bg-page)이라 사이드바가 흰 면이다(따라오는 것).
#   - 투명한 상태 색을 불투명 역할로(v102): 호버 · 누름 bg.transparent-pressed → bg-layer-default-pressed,
#     선 stroke.neutral-muted → stroke-neutral-subtle. 지금 항목(bg.transparent-selected)은 한 단계 짙은 bg-neutral-weak-pressed
#     (사용자 결정 2026-10-08 — bg-neutral-weak 는 다크에서 호버 바탕과 같은 #353B4D 였다). 지금 항목은 마우스를 올리거나
#     눌러도 바탕이 그대로다 — 그보다 짙은 불투명 역할이 없다(SEED 는 selected-pressed 가 있다). 글자는 500 그대로(SEED).
#   - 접힌 사이드바(768 ~ 1279)의 하위는 아이콘 옆 펼침 메뉴(Menu 표면 · 폭 200 · 줄 44)다 — Menu 의 "1280 미만은 Menu Sheet"
#     규칙의 예외(사용자 결정 2026-10-08). SEED 는 Menu size="responsive"(1280 미만 medium 46 · 이상 small 39).
#   - 아이콘은 fg-neutral-subtle — SEED palette.gray-600 은 면 위 1.97:1 로 3:1 에 못 미친다.
#   - 긴 이름은 줄을 바꾼다(SEED 문서 — 레시피는 말줄임이다).
#   - 아래 끝 흐림은 gradient-fade-mask(v104)로 24 — SEED 레시피의 선형 마스크 24 와 같은 깊이.
#   - 접혔을 때 묶음 사이에 1px 선(비교 페이지 8A 그림) — SEED 는 묶음 이름 자리를 접어 간격만 남긴다.
#   - 접기 버튼의 누르는 영역은 44(v106 — 보이는 40 에 2 씩), SEED 는 40.

name: SideNavigation

slots:
  root: 사이드바 — 화면 왼쪽, 높이 전체. 흰 면 + 오른쪽 1px 선. 본문과 따로 스크롤된다
  header: 머리 — 서비스 로고 · 이름 + 접기 버튼. 고정
  logo: 서비스 마크 · 이름 — 누르지 않는다(홈은 첫 항목)
  trigger: 접기 버튼 — 펼침 ↔ 접힘. 머리 오른쪽, 접히면 가운데
  content: 내용 — 묶음 · 항목. 넘치면 이 안에서만 스크롤
  divider: 머리 아래 선 — 내용이 스크롤됐을 때만
  fog: 내용 아래 끝 흐림 — 늘 켜져 있다
  groupLabel: 묶음 이름 — 있을 때만, 누르지 않는다. 길면 줄을 바꾼다
  groupDivider: 묶음 사이 선 — 접혔을 때만(묶음 이름 대신)
  item: 항목 — 아이콘 + 이름(+ 꺾쇠). 하위가 없으면 그 화면 링크, 있으면 펼치기만
  itemIcon: 항목 아이콘 — lucide 선 아이콘
  itemLabel: 항목 이름 — 짧게, 길면 줄을 바꾼다(말줄임 없음)
  chevron: 꺾쇠 — 하위가 있는 항목만. 펼치면 위로
  subItem: 하위 항목 — 아이콘 없이 이름만, 부모 이름과 줄을 맞춘다
  footer: 바닥 — 보조 링크(설명서 · 문의). 고정, 비면 없다. 계정은 두지 않는다(2026-10-16 Q-018-1 C) — 그루 이음은 예외로 계정 줄 + 메뉴(2026-10-23 H-A3 A)
  flyout: 펼침 메뉴 — 접혔을 때 하위가 있는 항목의 하위 목록. Menu 와 같은 표면이고 1280 미만에서도 Menu Sheet 로 바꾸지 않는다(사용자 결정 2026-10-08)
  flyoutLabel: 펼침 메뉴의 묶음 이름 — 부모 항목의 이름
  flyoutItem: 펼침 메뉴의 줄 — 하위 항목 하나. Menu 의 줄과 같고 높이만 44
  tooltip: 이름 말풍선 — 접혔을 때 하위가 없는 항목의 이름(Help Bubble 툴팁)
  focusRing: 키보드 포커스 링(웹) — 항목 안쪽

variants:
  collapsed:
    expanded: 펼침 240 — 1280 이상의 기본
    collapsed: 접힘 56(아이콘만) — 768 ~ 1279 의 기본. 손으로 접은 상태도
  current:
    none: 다른 항목
    current: 지금 화면 — 접혔을 때는 하위가 지금인 부모도

defaults:
  collapsed: expanded
  current: none

states:
  enabled: 기본
  hovered: 웹 — 마우스를 올린 항목의 바탕(누름과 같은 색, 축소 없음)
  pressed: 누름 — 항목 바탕 + 아이콘 · 이름만 2px 거리 축소
  focused: 웹 — 키보드 포커스에만 항목 안쪽 링
  open: 하위가 펼쳐짐 — 꺾쇠가 위로, 하위 항목이 보인다
  disabled: 막힌 항목 — 전용 색, 누르지 못한다

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      root:
        width: { value: $layout-sidebar, note: "펼침 240(v101 — SEED)" }
        background: { value: $color-bg-layer-default, note: "흰 면 — 본문(bg-page 회색)과 면으로 갈린다. SEED tone=neutral 의 회색 면 대신(본문이 회색이라)" }
        borderColor: { value: $color-stroke-neutral-subtle, note: "오른쪽 안쪽 1px(inset) — SEED stroke.neutral-muted 의 불투명 짝" }
        borderWidth: 1px
        position: { value: "화면 왼쪽 · 높이 전체(sticky)", note: "본문과 따로 스크롤 — 머리 · 바닥은 고정, 내용만 스크롤" }
        transitionProperty: width
        transitionDuration: $motion-duration-d4
        transitionEasing: $motion-ease-easing
      header:
        minHeight: { value: 64px, note: "접기 버튼이 들어가는 높이(SEED)" }
        padding: $spacing-x2
      logo:
        size: { value: 24px, note: "서비스 마크(브랜드 그림)" }
        gap: { value: $spacing-x2, note: "마크 ↔ 이름" }
        typography: $text-t5
        fontWeight: 700
        foreground: $color-fg-neutral
        marginLeft: { value: $spacing-x2, note: "화면 끝 → 마크 16 — 항목 아이콘과 같은 줄" }
      trigger:
        size: { value: 40px, note: "보이는 상자 — lucide panel-left" }
        radius: $radius-r2
        iconSize: { value: 18px, note: "상자 가운데 — SEED 레시피의 padding 10 은 40 · 18 과 맞지 않아(10 + 18 + 10 = 38) 두지 않는다" }
        color: { value: $color-fg-neutral-subtle, note: "면 위 5.50 · 다크 6.09" }
        top: { value: 12px, note: "머리 64 의 가운데" }
        right: { value: 12px, note: "접히면 8 — 56 의 가운데" }
        touchTarget: { value: 44 × 44, note: "보이지 않는 여백 2 씩(v106) — SEED 는 40" }
        transitionProperty: background-color
        transitionDuration: $motion-duration-color-transition
        transitionEasing: $motion-ease-easing
      content:
        paddingTop: $spacing-x2
        paddingX: $spacing-x2
        paddingBottom: { value: 24px, note: "끝 흐림 깊이와 같다 — 끝까지 내리면 흐림이 빈 여백 위에 놓인다" }
        gap: { value: $spacing-x2, note: "묶음 사이 — 접히면 0(선으로 가른다)" }
        overflowY: auto
        scrollPadding: { value: 위 8px · 아래 24px, note: "키보드로 옮긴 항목이 흐림 아래 멈추지 않게" }
      divider:
        height: 1px
        background: { value: $color-stroke-neutral-subtle, note: "머리 아래 — 내용이 위 끝에서 떨어지면 나타난다(SEED). 안쪽 그림자로 그린다" }
        transitionDuration: $motion-duration-color-transition
        transitionEasing: $motion-ease-easing
      fog:
        mask: { value: $gradient-fade-mask, note: "늘 켜짐 — 내용 상자의 아래 끝. 사이드바의 제 안개다(Scroll Fog 의 box 20 이 아니라 SEED 사이드바 24)" }
        size: 아래 24px
      groupLabel:
        typography: $text-t4
        fontWeight: 700
        foreground: $color-fg-neutral-muted
        padding: { value: $spacing-x1_5, note: "글은 화면 끝에서 14. 길면 줄을 바꾼다(단어 단위 — v114)" }
      item:
        minHeight: { value: 44px, note: "한 줄 — 이름이 줄을 바꾸면 늘어난다. AA ✓ · AAA ✓" }
        paddingX: { value: $spacing-x2, note: "아이콘은 화면 끝에서 16(내용 8 + 8)" }
        gap: { value: $spacing-x3, note: "아이콘 ↔ 이름 — 이름은 항목 안 40 에서 시작한다" }
        radius: $radius-r2_5
        background: { value: transparent, note: "누를 때 · 마우스를 올릴 때 · 지금 항목만 칠한다" }
        cursor: pointer
        transitionProperty: background-color
        transitionDuration: $motion-duration-color-transition
        transitionEasing: $motion-ease-easing
      itemIcon:
        size: 20px
        color: { value: $color-fg-neutral-subtle, note: "면 위 5.50 · 다크 6.09 — SEED palette.gray-600 은 1.97:1 이라 쓰지 않는다" }
      itemLabel:
        typography: $text-t4
        fontWeight: 500
        foreground: $color-fg-neutral-muted
        paddingY: { value: $spacing-x1_5, note: "줄을 바꾸면 항목이 그만큼 늘어난다 — 말줄임하지 않는다(SEED 문서)" }
      chevron:
        size: { value: 16px, note: "lucide chevron-down — 접혀 있으면 아래, 펼치면 위" }
        color: $color-fg-neutral-subtle
        transitionProperty: rotate
        transitionDuration: { value: $motion-duration-d6, note: "하위 펼침과 같은 300ms — Accordion 과 같다(2026-10-10 사용자 결정 3A)" }
        transitionEasing: $motion-ease-easing
      subItem:
        minHeight: 44px
        parentFrom: { value: 하위 2개 이상, note: "하위가 하나 · 없으면 부모를 만들지 않는다 — 단독 항목(꺾쇠 없이 그 화면 링크). 하위가 사용자마다 다른 항목(Desk 증권 — 연결한 증권사)도 같다(2026-10-16 Q-017-4 정리 — SEED Standalone Menu)" }
        paddingLeft: { value: 40px, note: "부모 이름과 같은 자리 = 8 + 아이콘 20 + 12. 아이콘 없이 이름만(t4 · 500)" }
        display: { value: 하위가 펼쳐졌을 때만, note: "높이 · 투명도로 펼쳐진다(motion)" }
      footer:
        padding: { value: $spacing-x2, note: "고정 — 비면 그리지 않는다" }
        content: { value: 보조 링크만, note: "설명서 · 문의(SEED Footer). 계정(아바타 · 이름)은 두지 않는다 — Desk 는 설정 · 로그아웃이 머리 ⚙ 에 있다(2026-10-16 사용자 결정 Q-018-1 C). 지금 Desk 웹은 보조 링크가 없어 바닥이 없다. 그루 이음은 예외 — 데스크톱 머리가 없어 바닥에 계정 줄 + 메뉴(내 정보 · 비밀번호 바꾸기 · 화면 테마 · 로그아웃)를 둔다(2026-10-23 사용자 결정 H-A3 A)" }
      flyout:
        width: { value: 200px, note: "Menu 와 같은 표면(menu.yaml) — 글이 길면 줄을 바꾼다" }
        background: $color-bg-layer-floating
        radius: $radius-r5
        shadow: $shadow-s3
        paddingY: $spacing-x2
        offset: { value: $spacing-x2, note: "항목 오른쪽 8 · 위 끝 맞춤(right-start). 화면 끝과도 8 — 모자라면 위로 민다" }
        openDelay: { value: 200ms, note: "마우스를 올리면 — 다른 펼침 메뉴가 열려 있으면 바로(SEED NavigationMenu)" }
        closeDelay: { value: 100ms, note: "마우스가 떠나면 — 항목에서 메뉴로 옮겨 가는 길에서는 닫히지 않는다(WCAG 1.4.13)" }
        zIndex: { value: 200, note: "z-floating — specs/z-index.md L3" }
      flyoutLabel:
        typography: $text-t3
        fontWeight: 400
        foreground: { value: $color-fg-neutral-subtle, note: "부모 항목의 이름 — Menu 의 묶음 이름과 같다" }
        paddingY: $spacing-x2
        paddingX: $spacing-x4
      flyoutItem:
        minHeight: { value: 44px, note: "Menu 의 줄(39)보다 높다 — 접힌 사이드바는 1280 미만(터치 태블릿)에도 있다. AA ✓ · AAA ✓" }
        paddingX: $spacing-x4
        typography: $text-t4
        fontWeight: 400
        foreground: $color-fg-neutral
        insetX: { value: $spacing-x2, note: "바탕은 좌우 8 들인 알약(Menu)" }
        radius: $radius-r3
        background: transparent
      tooltip:
        position: { value: 항목 오른쪽, note: "Help Bubble 툴팁(help-bubble.yaml) — 항목의 이름" }
        openDelay: { value: 200ms, note: "마우스 — 키보드 초점이면 바로" }
        closeDelay: 100ms
    hovered:
      item:
        background: { value: $color-bg-layer-default-pressed, note: "SEED bg.transparent-pressed 의 불투명 짝(흰 면 위)" }
      trigger:
        background: $color-bg-layer-default-pressed
      flyoutItem:
        background: { value: $color-bg-layer-floating-pressed, note: "떠 있는 표면 위의 누름 색(Menu)" }
    pressed:
      item:
        background: $color-bg-layer-default-pressed
        scale: { value: 콘텐츠 2px 거리 축소, note: "아이콘 · 이름만(목록 줄 — v104), 바탕은 그대로. 모션 줄이기면 하지 않는다" }
        scaleDuration: $motion-duration-pressed-scale
        scaleEasing: $motion-ease-pressed-scale
      trigger:
        background: $color-bg-layer-default-pressed
        scale: { value: 2px 거리 축소, note: "기준 40 → 0.95" }
      flyoutItem:
        background: $color-bg-layer-floating-pressed
        scale: { value: 콘텐츠 2px 거리 축소, note: "글만(Menu)" }
    focused:
      focusRing:
        width: 2px
        offset: { value: -2px, note: "항목 · 접기 버튼 안쪽 — 붙은 항목에 걸리지 않는다(SEED)" }
        radius: { value: $radius-r2_5, note: "항목 모서리 10 · 접기 버튼 8 · 펼침 메뉴 줄은 알약 자리(12)" }
        color: $color-stroke-focus-ring
    open:
      chevron:
        rotate: { value: 180deg, note: "위로 — 하위가 펼쳐졌다" }
      subItem:
        display: 보임
    disabled:
      item:
        cursor: not-allowed
        background: { value: transparent, note: "호버 · 누름 바탕 없음" }
      itemIcon:
        color: $color-fg-disabled
      itemLabel:
        foreground: $color-fg-disabled

  # ── 지금 항목 ─────────────────────────────────────────
  - when: { current: current }
    enabled:
      item:
        background: { value: $color-bg-neutral-weak-pressed, note: "옅은 회색 — SEED bg.transparent-selected(검정 4.7%)보다 한 단계 짙은 불투명 역할(사용자 결정 2026-10-08). 면 위 1.15 · 다크 1.56, 호버 바탕과 1.09 · 1.20" }
      itemIcon:
        color: { value: $color-fg-neutral, note: "짙은 글자색 — 한 단계 짙은 바탕과 함께 지금 항목을 알린다" }
      itemLabel:
        foreground: { value: $color-fg-neutral, note: "굵기는 500 그대로(SEED) — 700 은 고르지 않았다(2026-10-08)" }
      flyoutItem:
        background: { value: $color-bg-neutral-weak-pressed, note: "펼침 메뉴의 지금 화면 줄도 같은 바탕 — 떠 있는 표면 위 1.15 · 다크 1.35, 줄 호버 바탕과 1.09 · 1.20" }
    hovered:
      item:
        background: { value: $color-bg-neutral-weak-pressed, note: "바탕 그대로 — 지금 항목보다 짙은 불투명 역할이 없다" }
      flyoutItem:
        background: $color-bg-neutral-weak-pressed
    pressed:
      item:
        background: { value: $color-bg-neutral-weak-pressed, note: "바탕 그대로 — 아이콘 · 이름의 2px 거리 축소만" }
      flyoutItem:
        background: $color-bg-neutral-weak-pressed

  # ── 접힘 ──────────────────────────────────────────────
  - when: { collapsed: collapsed }
    enabled:
      root:
        width: { value: $layout-sidebar-collapsed, note: "접힘 56 — 아이콘만(v101 — SEED)" }
      logo:
        display: { value: none, note: "접기 버튼만 남는다" }
      trigger:
        right: { value: 8px, note: "56 의 가운데" }
      content:
        gap: { value: 0px, note: "묶음 사이는 선" }
      groupLabel:
        display: { value: 보이지 않게(sr-only), note: "보조 기술에는 묶음 이름이 남는다" }
      groupDivider:
        height: 1px
        background: $color-stroke-neutral-subtle
        marginY: $spacing-x2
        marginX: { value: $spacing-x2, note: "선 폭 24 — 아이콘 칸 가운데" }
      item:
        width: { value: 40px, note: "56 − 좌우 8" }
        paddingX: { value: $spacing-x2_5, note: "아이콘이 56 가운데(화면 끝에서 18)" }
      itemLabel:
        display: { value: 보이지 않게(sr-only), note: "이름은 남는다 — 보조 기술 · 말풍선 · 펼침 메뉴" }
      chevron:
        display: none
      subItem:
        display: { value: none, note: "하위는 펼침 메뉴(flyout)로 — 마우스를 올리거나 누르면" }

motion:
  "펼침 ↔ 접힘":
    duration: $motion-duration-d4
    easing: $motion-ease-easing
    properties: [width, padding]
    note: "이름은 접히기 시작할 때 사라지고 다 펴진 뒤 나타난다. 모션 줄이기면 바로 바뀐다"
  "하위 펼침":
    duration: $motion-duration-d6
    easing: $motion-ease-easing
    properties: [height, opacity]
    note: "꺾쇠도 같은 시간에 돈다 — 300ms, Accordion 과 같다(2026-10-10 사용자 결정 3A — 그전의 d4 200 은 스펙 초안의 값이었다). 꺾쇠는 모션 줄이기면 바로"
  "하위 펼침 — 모션 줄이기":
    duration: $motion-duration-d3
    easing: $motion-ease-easing
    properties: [opacity]
    note: "높이를 움직이지 않고 하위 목록이 150ms 서서히 나타나고 사라진다(v104 · Accordion 과 같다)"
  "펼침 메뉴 — 열림":
    duration: $motion-duration-d3
    easing: $motion-ease-enter
    properties: [scale 0.95 → 1, opacity 0 → 1]
    note: "Menu 와 같다 — 항목 쪽 변을 기준점으로"
  "펼침 메뉴 — 닫힘":
    duration: $motion-duration-d2
    easing: $motion-ease-exit
    properties: [scale → 0.95, opacity → 0]
  "머리 아래 선":
    duration: $motion-duration-color-transition
    easing: $motion-ease-easing
    properties: [box-shadow]
  "누름":
    duration: $motion-duration-pressed-scale
    easing: $motion-ease-pressed-scale
    properties: [scale]
