# Image Frame 의 수치 원본 — 구조는 SEED Image Frame(2026-10-04 사용자 결정, 이미지 비교 페이지 1A · 2A · 3A · 8A · "따라오는 것").
# 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md. 그림 없는 카드의 면(카드 그림 — CardArt)은 card-art.yaml.
#
# 그림 한 장을 보이는 틀 — 비율 상자(기본 4:3)에 그림을 꽉 채우고(cover), 그림 위에 안쪽 1px 투명 윤곽을 늘 그린다.
# 불러오는 동안은 같은 모서리의 Skeleton, 없거나 · 못 불러오거나 · 10초가 지나도 안 오면 Content Placeholder 다.
# 그림 위에는 네 모서리 자리에 배지(solid · 상태 · 분류)와 장수 글(Indicator)을 둘까지 얹는다.
# 모서리는 틀의 폭으로 고른다 — 24 이하 4 · 48 이하 6 · 그 위 8 · 화면 폭 0(SEED).
#
# 카드 그림(ratio card — 1.586)은 세로 그림(원래 폭 < 높이)이면 시계 방향으로 90° 돌려 가로 틀을 채운다.
# 비율 값은 모두 "W / H" 글이다(aspect-ratio.yaml 과 같은 꼴 — 2026-10-08).
#
# SEED 와 다른 자리(image-frame.md 의 "SEED 와 다른 점")
#   - 윤곽은 늘 그린다(끄는 속성이 없다) — SEED 는 CSS · React 기본이 꺼짐이고 rootage JSON 기본 · 그림은 켬이다.
#   - 모서리는 폭으로 저절로 고른다 — SEED React 는 기본 r2 하나라 작은 그림은 쓰는 쪽이 손으로 내린다.
#   - 불러오는 동안은 Skeleton, 실패는 Content Placeholder 로 가르고 10초에 실패로 바꾼다 — SEED React 는 받는 중에도 대체 그림을 바로 보인다.
#   - 실패해도 alt 를 대체 그림의 이름으로 남긴다 — SEED 는 img 를 숨겨 아무것도 읽히지 않는다.
#   - 그림 위 요소는 배지 · Indicator 둘(Reaction Button · Icon 은 두지 않는다), 네 모서리만(SEED React 는 9자리).
#   - Indicator 바탕은 overlay-dim-dark(검정 65%) — SEED static-black-alpha-800(63.5%)의 가장 가까운 groo 값(토큰을 더하지 않았다).
#   - 비율에 카드 1.586 을 더한다(groo — ISO 카드), 세로 카드 그림은 돌린다.

name: ImageFrame

slots:
  root: 틀 — 비율 상자. 폭은 부르는 쪽, 높이는 폭 ÷ 비율. 모서리로 자르고(overflow hidden) 안의 층을 따로 쌓는다(isolation)
  image: 그림 — 틀을 채운다. 카드 그림이 세로면 시계 방향으로 90° 돌려 채운다
  plate: 판 — 잘리지 않게 넣은(contain) 그림 뒤의 흰 판
  stroke: 안쪽 1px 윤곽 — 그림 · 스켈레톤 · 대체 그림 위에 늘 겹친다
  skeleton: 불러오는 동안 — 틀과 같은 모서리의 Skeleton(면 + 반짝임)
  fallback: 없음 · 실패 — Content Placeholder(옅은 면 + 선 아이콘). 아는 카드사의 카드 그림은 카드 면(card-art.yaml)
  floater: 그림 위 자리 — 네 모서리, 한 자리에 하나 · 틀 하나에 둘까지. 배지(solid) 또는 Indicator
  indicator: 장수 · 길이 글(Indicator) — "1 / 12" · "+9". 상태 · 강조에는 쓰지 않는다(그건 배지)

variants:
  ratio:
    "1:1": 정사각 — 규정 그림 · 격자 썸네일 · 목록 앞 그림
    "2:1": 넓은 띠 — 배너
    "16:9": 동영상 · 화면 폭 띠
    "4:3": 사진 — 기본(SEED)
    "6:7": 조금 세로 — 사람 · 물건 사진
    "4:5": 세로 — 가로 줄로 잇는 사진(여러 장)
    "2:3": 긴 세로 — 포스터 · 표지
    card: 카드 1.586(ISO 카드 85.6 × 53.98) — groo. 목록 · 격자 · 상세의 카드 그림, 세로 그림은 돌린다
  radius:
    "4": 폭 24 이하
    "6": 폭 25 ~ 48
    "8": 폭 49 이상 — 기본
    "0": 화면 폭 — 좌우가 화면 끝에 닿는 그림
  fit:
    cover: 사진 · 카드 그림 — 꽉 채우고 가운데를 남겨 자른다(기본)
    contain: 로고 · 글이 든 그림 — 잘리지 않게 넣고 둘레는 흰 판

defaults:
  ratio: "4:3"
  radius: "8"
  fit: cover

states:
  loaded: 그림이 왔다 — 기본
  loading: 불러오는 중 — 같은 모서리의 Skeleton
  fallback: 없음 · 못 불러옴 · 10초가 지나도 안 옴 — Content Placeholder(아는 카드사의 카드 그림은 카드 면)

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    loaded:
      root:
        width: { value: 부르는 쪽, note: "고정 폭(목록 · 썸네일)이면 그 폭, 아니면 부모 폭을 채운다 — 모서리는 그 폭으로 고른다(radius)" }
        height: { value: 폭 ÷ 비율, note: "그림이 오기 전에 자리를 잡는다 — 그림이 와도 줄이 밀리지 않는다" }
        overflow: { value: hidden, note: "모서리로 그림 · 스켈레톤 · 대체 그림을 자른다. 안의 층은 따로 쌓는다(isolation: isolate — SEED)" }
      image:
        width: 100%
        height: 100%
        objectFit: { value: cover, note: "가운데를 남겨 자른다(SEED — 사진은 늘 cover). 로고 · 글이 든 그림만 fit contain" }
        loading: { value: lazy, note: "화면에 들어올 때 받는다 — 첫 화면의 큰 그림(상세 위 카드 그림)만 eager" }
      stroke:
        borderWidth: { value: 1px, note: "안쪽(inset box-shadow) — 크기가 변하지 않는다. 그림 위에 그리고(SEED ::after) 누르기를 막지 않는다. 모서리는 틀을 따른다" }
        borderColor: { value: $color-stroke-neutral-overlay, note: "v118 — 검정 4.7% · 다크 흰 5%. 흰 그림이 흰 바탕에 묻히지 않고(1.11 · 장식), 어두운 그림 둘레에는 테가 생기지 않는다. 늘 그린다 — 끄는 속성이 없다" }
      floater:
        offset: { value: $spacing-x1_5, note: "틀 가장자리 → 요소 바깥 상자 6(SEED). 네 모서리 — 위 시작 · 위 끝 · 아래 시작 · 아래 끝. 한 자리에 하나 · 틀 하나에 둘까지 · 틀의 짧은 변이 80 이상일 때만" }
      indicator:
        background: { value: $overlay-dim-dark, note: "검정 65% — 두 모드 같다(그림은 모드를 따르지 않는다). SEED static-black-alpha-800(63.5%)의 가장 가까운 groo 값. overlay-dim-light(50%)면 흰 그림 위 흰 글자가 3.95 로 모자란다" }
        foreground: { value: $color-static-white, note: "흰 그림 위 7.00 · 검은 그림 위 21:1 — 어떤 그림 위에서도 4.5 를 넘는다" }
        typography: { value: $text-t1, note: "11 / 15 — 글자 크기 설정을 따른다(SEED rem)" }
        fontWeight: 500
        paddingX: $spacing-x1_5
        paddingY: $spacing-x0_5
        minHeight: { value: 19px, note: "15 + 2 + 2 — 글이 커지면 따라 커진다" }
        radius: $radius-full
    loading:
      skeleton:
        background: { value: $color-bg-neutral-weak, note: "Skeleton 의 면 — 틀과 같은 모서리(틀이 자른다). 흰 면 위 1.08 · 다크 1.30. 처음부터 깐다 — 빈 칸이 없다" }
        shimmer: { value: $gradient-shimmer-neutral, dark: $gradient-shimmer-neutral-dark, note: "Skeleton 의 반짝임 그대로 — 화면의 스켈레톤과 한 박자, 모션 줄이기면 멈춘다" }
      image:
        opacity: { value: 0, note: "받는 동안 그림을 보이지 않게 둔다(자리 · 대체 글은 그대로) — 다 받으면 나타난다(motion)" }
    fallback:
      fallback:
        background: { value: $color-bg-neutral-weak, note: "Content Placeholder — 틀을 채운다. 제 모서리가 없고 틀이 자른다" }
        glyphSize: { value: 틀 높이의 50%, note: "16 ~ 160 · 틀 폭이 좁으면 폭에 맞춘다(Content Placeholder). 기본 lucide image, 카드 그림은 credit-card" }
        glyphColor: { value: $color-stroke-neutral-weak, note: "면 위 1.14 · 다크 1.20 — 장식. 무엇이 없는지는 alt 를 이어받은 이름이 말한다" }
      image:
        display: { value: none, note: "깨진 그림 아이콘 · alt 글이 보이지 않는다. 10초가 지나 바뀐 뒤에 그림이 와도 다시 바꾸지 않는다" }

  # ── 비율 ──────────────────────────────────────────────
  - when: { ratio: "1:1" }
    loaded: { root: { aspectRatio: "1 / 1" } }
  - when: { ratio: "2:1" }
    loaded: { root: { aspectRatio: "2 / 1" } }
  - when: { ratio: "16:9" }
    loaded: { root: { aspectRatio: { value: "16 / 9", note: "≈ 1.78" } } }
  - when: { ratio: "4:3" }
    loaded: { root: { aspectRatio: { value: "4 / 3", note: "≈ 1.33 — 기본(SEED)" } } }
  - when: { ratio: "6:7" }
    loaded: { root: { aspectRatio: { value: "6 / 7", note: "≈ 0.86" } } }
  - when: { ratio: "4:5" }
    loaded: { root: { aspectRatio: { value: "4 / 5", note: "0.8" } } }
  - when: { ratio: "2:3" }
    loaded: { root: { aspectRatio: { value: "2 / 3", note: "≈ 0.67" } } }
  - when: { ratio: card }
    loaded:
      root: { aspectRatio: { value: "1.586 / 1", note: "ISO 카드 85.6 × 53.98 — 목록 56(높이 35.3) · 격자 · 상세 모두 이 비율. 최대 높이로 비율을 바꾸지 않는다" } }
      image: { rotate: { value: 90deg, note: "그림의 원래 폭 < 높이(세로 카드)면 시계 방향으로 90° — 그림 상자를 틀의 높이 × 폭으로 잡아 돌리고 cover 로 채운다. 원래 크기를 안 뒤(다 받은 뒤)에 정하고 보인다. 가로 · 정사각 그림은 그대로" } }

  # ── 모서리 — 폭으로 ───────────────────────────────────
  - when: { radius: "4" }
    loaded: { root: { radius: { value: $radius-r1, note: "폭 24 이하(SEED r1)" } } }
  - when: { radius: "6" }
    loaded: { root: { radius: { value: $radius-r1_5, note: "폭 25 ~ 48(SEED r1.5) — 목록 앞 40 · 48" } } }
  - when: { radius: "8" }
    loaded: { root: { radius: { value: $radius-r2, note: "폭 49 이상(SEED r2) — 목록 카드 56 · 격자 · 상세" } } }
  - when: { radius: "0" }
    loaded: { root: { radius: { value: 0px, note: "화면 폭 — 좌우가 화면 끝에 닿는 그림(SEED 의 'Rounded 를 끈다'). 윤곽은 그대로" } } }

  # ── 맞춤 ──────────────────────────────────────────────
  - when: { fit: cover }
    loaded: { image: { objectFit: cover } }
  - when: { fit: contain }
    loaded:
      image: { objectFit: { value: contain, note: "잘리지 않게 넣는다 — 둘레는 판" } }
      plate: { background: { value: $color-static-white, note: "흰 판 — 두 모드 같다(로고 · 글이 든 그림은 흰 바탕에 맞춰 만든다). 다크에서도 그림의 검은 부분이 사라지지 않는다" } }

motion:
  "그림이 옴":
    duration: $motion-duration-d3
    easing: $motion-ease-enter
    properties: [opacity 0 → 1]
    note: "스켈레톤을 걷고 그림을 투명도로 — Skeleton 의 '내용으로 바뀜' 과 같다. 모션 줄이기면 바로. 실패 · 없음으로 바뀔 때는 움직임이 없다"
