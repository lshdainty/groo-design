# Pagination 의 수치 원본 — 구조는 SEED Pagination(2026-10-04 사용자 결정, 화면 틀 · 이동 비교 페이지 10A · 같은 날 추가 결정).
# 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 여러 쪽으로 나뉜 목록의 쪽을 오가는 줄 — 데스크톱(768 이상) 목록 아래 가운데. 폰의 긴 목록은 쪽을 나누지 않고
# 끝없이 불러온다(pagination.md 의 "폰은 끝없이 불러오기"). 데이터 표는 Table Pagination(table-pagination.yaml)이다.
# 번호 · 화살표 칸 40 × 40 을 사이 없이 잇고, 지금 쪽은 짙게 채운다. 칸 수는 화면 폭으로 고정이다 — 480 이상 9칸 · 미만 7칸
# (화살표 포함). 첫 · 마지막 쪽에서는 화살표 대신 40 빈 칸을 두어 쪽이 바뀌어도 칸 자리가 흔들리지 않는다. 1쪽 이하면 그리지 않는다.
#
# 누르는 영역은 위아래만 44 이고 옆은 칸 폭 40 이다 — v106 "누르는 영역 44" 의 예외(사용자 결정 2026-10-04: 칸 40 그대로,
# porest 폰은 끝없이 불러오기라 넘김은 주로 마우스로 누른다). WCAG 2.5.8(AA) 은 통과, 2.5.5(AAA) 는 미달이다.
#
# SEED 와 다른 자리(pagination.md 의 "SEED 와 다른 점")
#   - 지금 쪽 채움: SEED bg.neutral-solid(#2A3038) → porest bg-neutral-inverted(짙은 회색 — 다크는 밝은 반전) + fg-neutral-inverted.
#     누름은 bg-neutral-inverted-pressed(v112).
#   - 누름 · 호버 바탕: SEED bg.transparent-pressed → 불투명한 bg-layer-default-pressed(v102 · v104).
#   - 누름 축소: SEED scale 0.97 → porest 2px 거리(v104 — 40 이면 0.95).
#   - 누르는 영역: 세로만 44 로 넓힌다(SEED 는 40 그대로).
#   - 끝 쪽에 닿아 누르던 화살표가 빈 칸이 되면 초점을 지금 쪽 번호로 옮긴다 — SEED 는 body 로 떨어진다.
#   - 쪽이 주소에 있으면 칸은 링크(<a>)다 — SEED 는 늘 버튼이다.

name: Pagination

slots:
  root: 넘김 줄 — 목록 아래 가운데. 칸을 사이 없이 잇는다
  item: 쪽 번호 칸 — 40 × 40
  label: 쪽 번호 — 숫자 폭을 같게
  arrow: 이전 · 다음 — 아이콘만 40 × 40
  ellipsis: 생략 — 40 상자 + 점 셋. 누르지 않는다
  empty: 빈 칸 — 첫 · 마지막 쪽에서 화살표 자리 40
  focusRing: 키보드 포커스 링(웹)

variants:
  current:
    other: 다른 쪽
    current: 지금 쪽 — 짙은 채움
  count:
    regular: 9칸 — 480 이상(화살표 둘 포함)
    narrow: 7칸 — 480 미만(화살표 둘 포함)

defaults:
  current: other
  count: regular

states:
  enabled: 기본
  hovered: 웹 — 누름과 같은 바탕, 축소 없음
  pressed: 누름 — 바탕 + 2px 거리 축소
  focused: 웹 — 키보드 포커스에만 링
  disabled: 막힌 넘김(목록을 다시 받는 동안 · 막힌 화면) — 전용 색

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      root:
        gap: { value: 0px, note: "칸이 붙는다(SEED) — 9칸이면 360, 7칸이면 280" }
        justifyContent: { value: center, note: "목록 아래 가운데(SEED)" }
        marginTop: { value: $spacing-x6, note: "목록 끝 → 넘김 줄 24(옛 DESIGN.md Pagination 절의 값 — SEED 는 \"목록 하단\" 만 적었다)" }
      item:
        size: { value: 40px, note: "40 × 40 — 칸 40 그대로(사용자 결정 2026-10-04)" }
        radius: $radius-r2
        background: { value: transparent, note: "누를 때 · 마우스를 올릴 때만 칠한다(지금 쪽은 채움)" }
        touchTarget: { value: 40 × 44, note: "위아래만 44(보이지 않는 여백 2 씩), 옆은 칸 폭 40 — v106 '누르는 영역 44' 의 예외. AA ✓ · AAA ⚠" }
        cursor: pointer
        transitionProperty: background-color
        transitionDuration: $motion-duration-color-transition
        transitionEasing: $motion-ease-easing
      label:
        typography: $text-t4
        fontWeight: 700
        foreground: $color-fg-neutral
        numerals: { value: tabular-nums, note: "숫자 폭을 같게. 네 자리 이상이 칸을 넘으면 말줄임 — 숫자는 칸 이름에 있다" }
      arrow:
        size: { value: 40px, note: "이전 · 다음 — 아이콘만. 누르는 영역은 쪽 번호와 같다(40 × 44)" }
        radius: $radius-r2
        iconSize: { value: 16px, note: "lucide chevron-left · chevron-right" }
        color: $color-fg-neutral
        background: transparent
      ellipsis:
        size: 40px
        iconSize: { value: 16px, note: "lucide ellipsis — 보조 기술에 숨긴다, 누르지 않는다" }
        color: $color-fg-neutral
      empty:
        size: { value: 40px, note: "첫 쪽의 이전 · 마지막 쪽의 다음 자리 — 비워 둔다(보조 기술에 숨긴다)" }
    hovered:
      item:
        background: { value: $color-bg-layer-default-pressed, note: "누름과 같은 색 — 축소 없음(v106)" }
      arrow:
        background: $color-bg-layer-default-pressed
    pressed:
      item:
        background: { value: $color-bg-layer-default-pressed, note: "SEED bg.transparent-pressed 의 불투명 짝" }
        scale: { value: 2px 거리 축소, note: "기준 40 → 0.95(v104 — SEED 0.97). 모션 줄이기면 하지 않는다" }
        scaleDuration: $motion-duration-pressed-scale
        scaleEasing: $motion-ease-pressed-scale
      arrow:
        background: $color-bg-layer-default-pressed
        scale: 2px 거리 축소
    focused:
      focusRing:
        width: 2px
        offset: { value: 2px, note: "칸 바깥 — 붙은 이웃 칸 위에 그린다(SEED)" }
        color: $color-stroke-focus-ring
    disabled:
      item:
        cursor: not-allowed
        background: transparent
      label:
        foreground: $color-fg-disabled
      arrow:
        color: $color-fg-disabled
        cursor: not-allowed

  # ── 지금 쪽 ───────────────────────────────────────────
  - when: { current: current }
    enabled:
      item:
        background: { value: $color-bg-neutral-inverted, note: "짙은 채움 — SEED bg.neutral-solid 의 porest 짝(다크는 밝은 반전)" }
      label:
        foreground: $color-fg-neutral-inverted
    hovered:
      item:
        background: $color-bg-neutral-inverted-pressed
    pressed:
      item:
        background: { value: $color-bg-neutral-inverted-pressed, note: "v112 — Button neutralSolid 의 누름과 같다" }
    disabled:
      item:
        background: { value: $color-bg-disabled, note: "흐리게 하지 않는다(v106)" }
      label:
        foreground: $color-fg-disabled

  # ── 칸 수 ─────────────────────────────────────────────
  - when: { count: regular }
    enabled:
      root:
        width: { value: 360px, note: "9칸 — 화살표 2 + 번호 · 생략 7. 1 2 3 4 5 … N · 1 … p−1 p p+1 … N · 1 … N−4 N−3 N−2 N−1 N" }
  - when: { count: narrow }
    enabled:
      root:
        width: { value: 280px, note: "7칸 — 화살표 2 + 번호 · 생략 5. 1 2 3 4 … · … p−1 p p+1 … · … N−3 N−2 N−1 N(가운데 구간에서는 첫 · 마지막 번호가 없다)" }

motion:
  "바탕 색":
    duration: $motion-duration-color-transition
    easing: $motion-ease-easing
    properties: [background-color]
  "누름":
    duration: $motion-duration-pressed-scale
    easing: $motion-ease-pressed-scale
    properties: [scale]
    note: "2px 거리 축소 — 모션 줄이기면 하지 않는다"
