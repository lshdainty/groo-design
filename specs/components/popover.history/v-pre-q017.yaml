# Popover 의 수치 원본 — 구조는 SEED Popover(2026-10-02 사용자 결정, 비교 페이지 1 · 8).
# 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 트리거에 붙어 떠 있는 표면 — 1280 이상에서 부가 정보 · 짧은 동작 · 고르는 패널(Input Button 의 달력 · 시각 · 목록)을 띄운다.
# 같은 내용을 1280 미만에서는 Bottom Sheet 로 띄운다. 비모달 — 딤 · 스크롤 잠금 · 뒤 화면 숨김이 없고 초점을 가두지 않는다.
# 머리 · 본문 · 바닥 여백은 Dialog 와 같다.
#
# SEED 와 다른 자리(popover.md 의 "SEED 와 다른 점")
#   - 바닥 버튼: Button small 36(Button 결정 — SEED 예제 medium 40).
#   - 반투명 색을 불투명 짝으로(v102): 닫기 버튼 누름 bg-layer-floating-pressed.
#   - z-index: specs/z-index.md 의 L3(z-floating 200) — 페이지에서도, 대화상자 · 시트 안에서도 그 위에 뜬다(SEED 99999).

name: Popover

slots:
  root: 표면 — 트리거 아래(모자라면 위)
  closeButton: 닫기 — 머리가 있을 때. 이름 "닫기"
  header: 머리 — 제목 · 설명 · 닫기(없어도 된다)
  title: 제목
  description: 설명
  body: 본문 — 넘치면 이 안에서 스크롤
  footer: 바닥 — 버튼(없어도 된다)
  focusRing: 키보드 포커스 링(웹)

variants: {}

states:
  enabled: 열림
  pressed: 닫기 버튼 누름
  focused: 웹 — 키보드 포커스에만 링

rules:
  - when: {}
    enabled:
      root:
        minWidth: { value: 320px, note: "가용 폭(화면 − 좌우 16)보다 넓지 않게" }
        maxWidth: { value: 480px, note: "가용 폭까지" }
        maxHeight: { value: 600px, note: "가용 높이까지 — 넘치면 본문만 스크롤" }
        radius: $radius-r5
        background: $color-bg-layer-floating
        shadow: $shadow-s3
        offset: { value: $spacing-x2, note: "트리거와 8 — 화면 가장자리와는 16 을 남기고, 모자라면 반대편 · 옆으로 민다" }
        zIndex: { value: 200, note: "z-floating — specs/z-index.md L3" }
      header:
        paddingTop: $spacing-x6
        paddingX: $spacing-x6
        paddingBottom: $spacing-x4
        gap: { value: $spacing-x1_5, note: "닫기 버튼이 있으면 오른쪽 52" }
      title:
        typography: { value: $text-t7, note: "단어 단위 줄바꿈" }
        fontWeight: 700
        foreground: $color-fg-neutral
      description:
        typography: $text-t4
        fontWeight: 400
        foreground: $color-fg-neutral-muted
      closeButton:
        size: { value: 52px, note: "투명 상자 — 보이는 건 아이콘 22" }
        radius: $radius-r3
        iconSize: 22px
        color: $color-fg-neutral-subtle
        top: { value: 27px, note: "아이콘이 위에서 27 · 오른쪽 24 — 제목 첫 줄 가운데와 맞는다" }
        right: $spacing-x6
        touchTarget: 52 × 52
        transitionProperty: background-color, scale
        transitionDuration: $motion-duration-color-transition
        transitionEasing: $motion-ease-easing
      body:
        paddingX: $spacing-x6
        paddingTop: { value: $spacing-x6, note: "머리가 없을 때만 — 머리가 있으면 0" }
        paddingBottom: { value: $spacing-x6, note: "바닥이 없을 때만 — 바닥이 있으면 0" }
        overflowY: { value: auto, note: "넘칠 수 있는 본문은 끝 흐림(Scroll Fog overlayBody — 늘 켜진 위 20 · 아래 80, 본문 안 여백도 그만큼 · 2026-10-03) · 위로 스크롤하면 머리 아래 1px stroke-neutral-subtle — Dialog 와 같다(dialog.yaml scrollFog)" }
      footer:
        paddingTop: $spacing-x4
        paddingX: $spacing-x6
        paddingBottom: $spacing-x6
        gap: $spacing-x2
        justifyContent: flex-end
        buttonSize: { value: small 36, note: "Button small" }
    pressed:
      closeButton:
        background: $color-bg-layer-floating-pressed
        scale: { value: 2px 거리 축소, note: "기준 52 — 모션 줄이기면 하지 않는다" }
    focused:
      focusRing:
        width: 2px
        offset: 2px
        color: $color-stroke-focus-ring

motion:
  "열림":
    duration: $motion-duration-d3
    easing: $motion-ease-enter
    properties: [scale 0.95 → 1, opacity 0 → 1]
    note: "트리거 쪽 변을 기준점으로 커진다"
  "닫힘":
    duration: $motion-duration-d2
    easing: $motion-ease-exit
    properties: [scale → 0.95, opacity → 0]
  "누름 — 닫기 버튼":
    duration: $motion-duration-pressed-scale
    easing: $motion-ease-pressed-scale
    properties: [scale]
