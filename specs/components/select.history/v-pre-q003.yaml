# Select 의 수치 원본 — 구조는 SEED Select(Trigger · Content · Item · Group, 2026-10-01 사용자 결정).
# 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 짧은 선택지(5개 이상 · 한 줄 설명까지)에서 폼에 넣을 값을 고른다. 목록은 칸에 붙어 열린다 — 폰에서도 시트로 바꾸지 않는다
# (아래가 모자라면 위로). 시트 · 달력 · 긴 목록은 Input Button(input-button.yaml). 라벨 · 설명 · 오류는 Field.
#
# 부위가 둘로 나뉜다 — 트리거(trigger · value · placeholder · prefixIcon · chevron · focusRing)와 목록(content · item ·
# itemIcon · itemLabel · itemDescription · indicator · highlight · groupLabel · divider). 상태도 부위마다 쓰는 것이 다르다:
#   트리거  enabled · pressed · focused · open · invalid · disabled · readonly
#   선택지  enabled · pressed(누름 · 마우스 호버 · 키보드 위치) · selected · disabled
# 트리거의 상자는 Input Button 과 같은 값이다.
#
# SEED 와 다른 자리(select.md 의 "SEED 와 다른 점")
#   - 누름 · 호버 · 키보드 위치 바탕은 불투명한 bg-layer-default-pressed(트리거) · bg-layer-floating-pressed(목록 안) —
#     SEED transparent-pressed 는 투명도가 있어 검사기가 받지 않는다(v102).
#   - 그림자는 porest s3(v105 — SEED 와 구조는 같고 값은 porest).
#   - 묶음 사이 선은 불투명한 stroke-neutral-subtle(SEED stroke.neutral-muted 는 투명도가 있다).
#   - 아이콘은 lucide(v106) — 셰브론 chevron-down, 고른 표시 check(선 2.5 — SEED 는 채운 체크).

name: Select

slots:
  trigger: 트리거 — Input Button 과 같은 상자. 누르면 목록이 열린다
  value: 고른 값 — 한 줄. 여럿이면 쉼표로 잇고, 넘치면 "첫 값 외 N개"
  placeholder: 고르기 전의 글 — "{값의 종류} 선택"("결제 수단 선택"). 라벨만 그대로 두지 않는다
  prefixIcon: 트리거 앞 아이콘 — 하나를 고르면 그 선택지의 아이콘으로 바뀐다
  chevron: 셰브론 — 열리면 180° 돈다
  focusRing: 트리거의 키보드 포커스 링(웹)
  content: 목록 — 칸 폭 그대로, 칸 아래(모자라면 위) 8
  item: 선택지 한 줄 — 글은 목록 안에서 줄바꿈된다
  itemIcon: 선택지 앞 아이콘
  itemLabel: 선택지 글 — 명사형으로 짧게
  itemDescription: 선택지 설명 — 한 줄. 트리거에는 보이지 않는다
  indicator: 고른 표시 — 오른쪽 체크. 바탕 · 굵기는 바꾸지 않는다
  highlight: 누름 · 호버 · 키보드 위치 — 좌우 8 들인 알약
  groupLabel: 묶음 제목
  divider: 묶음 사이 선 — 선택지 사이에는 없다

variants:
  size:
    large: 트리거 52 · 선택지 46 — 폰 · 앱
    medium: 트리거 40 · 선택지 39 — 1280 이상 데스크톱 웹(마우스)에서만
    responsive: 폭에 따라 — 1280 미만 large · 이상 medium. 웹의 기본

defaults:
  size: responsive

states:
  enabled: 기본
  pressed: 누름 — 트리거는 바탕 + 콘텐츠 축소, 선택지는 알약 + 콘텐츠 축소. 마우스 호버 · 선택지의 키보드 위치는 같은 바탕 · 알약(축소 없음)
  focused: 웹 — 트리거에 키보드 포커스 링
  open: 목록이 열림 — 셰브론 180°
  selected: 고른 선택지 — 오른쪽 체크
  invalid: 오류 — 트리거 안쪽 2px. Field 의 invalid
  disabled: 비활성 — 트리거 · 선택지
  readonly: 읽기 전용 — 트리거, 열리지 않는다

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      trigger:
        background: transparent
        borderColor: $color-stroke-neutral-weak
        borderWidth: { value: 1px, note: "상자 안쪽(inset). 오류의 2px 는 안쪽에 덧그린다" }
        cursor: pointer
        transitionProperty: background-color
        transitionDuration: $motion-duration-color-transition
        transitionEasing: $motion-ease-easing
      value:
        foreground: $color-fg-neutral
        fontWeight: 400
      placeholder:
        foreground: $color-fg-placeholder
        fontWeight: 400
      prefixIcon:
        color: $color-fg-neutral-muted
      chevron:
        color: $color-fg-neutral-muted
      content:
        width: { value: 트리거 폭, note: "트리거와 같은 폭 — 선택지 글은 목록 안에서 줄바꿈된다" }
        zIndex: { value: 200, note: "z-floating — specs/z-index.md L3. 대화상자 · 시트(101) 안에서 열어도 그 위" }
        background: $color-bg-layer-floating
        radius: $radius-r5
        shadow: $shadow-s3
        paddingY: $spacing-x2
        gap: { value: $spacing-x2, note: "묶음 사이(위아래 8 + 선 1px + 8)" }
        marginTop: { value: $spacing-x2, note: "트리거와의 거리 — 아래가 모자라면 위로 뒤집는다" }
        margin: { value: $spacing-x2, note: "화면 가장자리와 최소 거리(안전 영역이 있으면 그 값)" }
        maxHeight: { value: "min(480px, 남은 화면)", note: "남은 화면이 200 보다 좁아도 200 은 둔다 — 넘치면 목록 안에서 스크롤. 열면 고른 선택지가 보이게 스크롤된다" }
      item:
        paddingX: $spacing-x4
        cursor: pointer
        transitionProperty: { value: background-color, note: "알약 바탕과 들임(inset)이 함께" }
        transitionDuration: $motion-duration-color-transition
        transitionEasing: $motion-ease-easing
      itemIcon:
        color: $color-fg-neutral
      itemLabel:
        foreground: $color-fg-neutral
        fontWeight: 400
      itemDescription:
        foreground: $color-fg-neutral-subtle
        gap: { value: $spacing-x0_5, note: "글 ↔ 설명" }
      indicator:
        color: { value: $color-fg-neutral, note: "lucide check · 선 2.5" }
      highlight:
        background: { value: transparent, note: "누를 때 · 키보드로 옮길 때만 칠한다" }
        radius: $radius-r3
      groupLabel:
        foreground: $color-fg-neutral-subtle
        paddingX: $spacing-x4
      divider:
        color: $color-stroke-neutral-subtle
        height: 1px
        marginX: { value: $spacing-x4, note: "좌우 16 들인다" }
        marginBottom: $spacing-x2
    pressed:
      trigger:
        background: { value: $color-bg-layer-default-pressed, note: "SEED bg.transparent-pressed 의 불투명 짝. 마우스는 호버에 같은 바탕" }
        scale: { value: 콘텐츠 2px 거리 축소, note: "값 · 아이콘만 준다(SEED scaleScope: content) — 테두리 · 바탕은 그대로" }
        scaleDuration: $motion-duration-pressed-scale
        scaleEasing: $motion-ease-pressed-scale
      highlight:
        background: { value: $color-bg-layer-floating-pressed, note: "목록 바탕(bg-layer-floating) 위의 누름. 마우스 호버 · 키보드 위치도 같다" }
        insetX: { value: $spacing-x2, note: "좌우 8 들어온 알약 — 글은 알약 안쪽 8 지점에서 시작한다" }
      item:
        scale: { value: 콘텐츠 2px 거리 축소, note: "누르는 동안만(호버 · 키보드 위치는 축소 없음)" }
    focused:
      focusRing:
        width: 2px
        offset: 2px
        color: { value: $color-stroke-focus-ring, note: "트리거 — 키보드 포커스에만(마우스 · 터치로 눌러서는 없다)" }
    open:
      chevron:
        rotate: 180deg
    selected:
      indicator:
        opacity: { value: 1, note: "고르지 않은 선택지에는 체크를 그리지 않는다(자리도 없다)" }
    invalid:
      trigger:
        borderWidth: 2px
        borderColor: { value: $color-stroke-critical-solid, note: "1px 위에 2px 가 나타난다(100ms)" }
    disabled:
      trigger:
        background: { value: $color-bg-disabled, note: "흐리게 하지 않는다(v106)" }
        cursor: not-allowed
      value:
        foreground: $color-fg-disabled
      placeholder:
        foreground: $color-fg-disabled
      prefixIcon:
        color: $color-fg-disabled
      chevron:
        color: $color-fg-disabled
      item:
        cursor: not-allowed
      itemIcon:
        color: $color-fg-disabled
      itemLabel:
        foreground: $color-fg-disabled
      itemDescription:
        foreground: $color-fg-disabled
      indicator:
        color: $color-fg-disabled
    readonly:
      trigger:
        background: { value: $color-bg-disabled, note: "값은 진한 글자 그대로 — 열리지 않는다" }
        cursor: default

  # ── 크기 ──────────────────────────────────────────────
  - when: { size: large }
    enabled:
      trigger: { minHeight: 52px, radius: $radius-r3, paddingX: $spacing-x4, gap: $spacing-x2_5 }
      value: { typography: $text-t5 }
      placeholder: { typography: $text-t5 }
      prefixIcon: { size: 20px }
      chevron: { size: 20px }
      item: { paddingY: $spacing-x3, gap: $spacing-x3, height: { value: 46px, note: "한 줄 — 설명이 있으면 66" } }
      itemIcon: { size: 22px }
      itemLabel: { typography: $text-t5 }
      itemDescription: { typography: $text-t3 }
      indicator: { size: 14px }
      groupLabel: { typography: $text-t4, fontWeight: 500, paddingY: $spacing-x2_5 }
  - when: { size: medium }
    enabled:
      trigger: { minHeight: 40px, radius: $radius-r2, paddingX: $spacing-x3_5, gap: $spacing-x2 }
      value: { typography: $text-t4 }
      placeholder: { typography: $text-t4 }
      prefixIcon: { size: 16px }
      chevron: { size: 16px }
      item: { paddingY: $spacing-x2_5, gap: $spacing-x2, height: { value: 39px, note: "한 줄 — 설명이 있으면 57" } }
      itemIcon: { size: 18px }
      itemLabel: { typography: $text-t4 }
      itemDescription: { typography: $text-t2 }
      indicator: { size: 12px }
      groupLabel: { typography: $text-t3, fontWeight: 400, paddingY: $spacing-x2 }
  - when: { size: responsive }
    enabled:
      trigger:
        breakpoint: { value: 1280px, note: "미만은 large, 이상은 medium 의 값을 쓴다(SEED lg) — 앱은 늘 large" }

motion:
  "누름 · 호버 — 바탕":
    duration: $motion-duration-color-transition
    easing: $motion-ease-easing
    properties: [background-color]
  "누름 — 콘텐츠":
    duration: $motion-duration-pressed-scale
    easing: $motion-ease-pressed-scale
    properties: [scale]
    note: "트리거 · 선택지의 콘텐츠만 2px 거리 축소 — 모션 줄이기면 하지 않는다"
  "셰브론 — 열 때":
    duration: $motion-duration-d3
    easing: $motion-ease-easing
    properties: [rotate]
  "셰브론 — 닫을 때":
    duration: $motion-duration-d2
    easing: $motion-ease-easing
    properties: [rotate]
  "목록 — 열 때":
    duration: $motion-duration-d3
    easing: $motion-ease-enter
    properties: [opacity, scale]
    note: "0.95 → 1 · 투명 → 불투명. 붙은 쪽(트리거 쪽)에서 커진다"
  "목록 — 닫을 때":
    duration: $motion-duration-d2
    easing: $motion-ease-exit
    properties: [opacity, scale]
    note: "1 → 0.95 · 사라진다. 모션 줄이기면 투명도만"
  "선택지 — 알약":
    duration: $motion-duration-color-transition
    easing: $motion-ease-easing
    properties: [background-color, inset]
    note: "알약 바탕이 나타나며 좌우 8 들어온다"
  "오류 — 테두리":
    duration: $motion-duration-d2
    easing: $motion-ease-easing
    properties: [border-color]
