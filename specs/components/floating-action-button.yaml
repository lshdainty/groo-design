# Floating Action Button 의 수치 원본입니다. 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md 를 따릅니다.
#
# 화면 위에 떠 있는 그 화면의 주 동작 하나입니다 — 원 56 · 아이콘 24 · 브랜드 채움 · 흰 아이콘, 오른쪽 아래.
# 화면에 하나만, 화면 끝 · 아래에 고정된 것(바닥 버튼)에서 20 + 안전 영역. 이름은 aria-label 입니다(보이는 글이 없습니다).
# 폰(768 미만)의 탭 바 없는 화면에만 둡니다 — 탭 바가 있는 화면의 추가는 탭 바 가운데 + 입니다(bottom-navigation.yaml).
#
# 색은 브랜드 채움 bg-brand-solid(Desk 파랑 · HR 초록)입니다. 글이 붙은 모양(extended)과 스크롤에 따라 접는 동작은 두지 않습니다 — 늘 아이콘만 56 입니다.
# 누름 · 호버는 bg-brand-solid-pressed 이고, 누름만 2px 거리 축소를 더합니다. <button type="button"> 이라 폼 안에서 제출되지 않습니다.

name: FloatingActionButton

slots:
  root: 버튼 — 원 56. 오른쪽 아래에 떠 있다
  icon: 아이콘 — 흰 선 아이콘 24
  focusRing: 키보드 포커스 링(웹)

variants: {}

states:
  enabled: 기본
  hovered: 웹 — 누름과 같은 색, 축소 없음
  pressed: 누름 — 누름 색 + 2px 거리 축소
  focused: 웹 — 키보드 포커스에만 링

rules:
  - when: {}
    enabled:
      root:
        size: { value: 56px, note: "원 — 아이콘만. 누르는 영역도 56. AA ✓ · AAA ✓" }
        radius: $radius-full
        background: { value: $color-bg-brand-solid, note: "브랜드 채움 — 화면의 주 동작 하나. 바꾸지 않는다" }
        shadow: { value: $shadow-s3, note: "떠 있는 높이 — 목록 위에 뜬다(Elevation Local 2)" }
        position: { value: 오른쪽 아래(fixed), note: "스크롤해도 그 자리 — 숨거나 접히지 않는다" }
        marginRight: { value: 20px, note: "화면 끝 → 버튼 20 + 오른쪽 안전 영역" }
        marginBottom: { value: 20px, note: "화면 아래 끝(또는 바닥 고정 버튼 위 끝) → 버튼 20 + 아래 안전 영역" }
        zIndex: { value: 50, note: "z-sticky — specs/z-index.md L1. 스낵바(L6)는 이 위 8 에 뜬다" }
        cursor: pointer
        transitionProperty: background-color
        transitionDuration: $motion-duration-color-transition
        transitionEasing: $motion-ease-easing
      icon:
        size: { value: 24px, note: "lucide 선 아이콘(plus 등) — 가운데" }
        color: $color-static-white
        strokeWidth: { value: 2.5px, note: "채운 원 위의 흰 아이콘 — 탭 바 가운데 + 와 같다" }
    hovered:
      root:
        background: $color-bg-brand-solid-pressed
    pressed:
      root:
        background: $color-bg-brand-solid-pressed
        scale: { value: 2px 거리 축소, note: "기준 56 → 0.964 — 모션 줄이기면 하지 않는다" }
        scaleDuration: $motion-duration-pressed-scale
        scaleEasing: $motion-ease-pressed-scale
    focused:
      focusRing:
        width: 2px
        offset: { value: 2px, note: "원 바깥 — 화면(바탕) 위에 그린다" }
        color: $color-stroke-focus-ring

motion:
  "색":
    duration: $motion-duration-color-transition
    easing: $motion-ease-easing
    properties: [background-color]
  "누름":
    duration: $motion-duration-pressed-scale
    easing: $motion-ease-pressed-scale
    properties: [scale]
    note: "2px 거리 축소 — 모션 줄이기면 하지 않는다"
