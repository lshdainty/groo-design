# Side Panel 의 수치 원본 — 구조는 SEED Side Panel(2026-10-04 사용자 결정, 화면 틀 · 이동 비교 페이지 "따라오는 것" — Sheet → Side Panel).
# 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 화면 옆(왼쪽 · 오른쪽)에서 미끄러져 나오는 모달 패널. 높이는 화면 전체, 모서리 · 그림자 · 선 없이 딤과 면 색으로 뜬다.
#   left   768 미만의 주 메뉴 서랍 — Side Navigation 의 항목을 담는다. 지금 쓰는 곳은 HR 폰 하나
#   right  1280 이상의 보조 작업 패널 — 지금 쓰는 곳이 없다. 쓰게 되면 1280 미만에서는 같은 내용을 Bottom Sheet 로 띄운다
#          (Responsive Dialog 와 같은 경계 — 새 경계를 두지 않는다)
# 아래에서 올라오는 것은 Bottom Sheet(bottom-sheet.yaml), 가운데 대화상자는 Dialog(dialog.yaml)다. 위에서 내려오는 패널은 두지 않는다.
# 열고 닫는 동작(입력 폼은 바깥 누르기 · 끌기로 닫지 않는다 · 닫기와 취소는 하나만)은 Dialog · Bottom Sheet 와 같다 — side-panel.md 의 Behavior.
#
# SEED 와 다른 자리(side-panel.md 의 "SEED 와 다른 점")
#   - 딤: SEED bg.overlay 0.455 → groo overlay-dim 0.50 · 다크 0.65(v102).
#   - 본문 끝 흐림: SEED 의 늘 켜진 아래 48 → groo Scroll Fog overlayBody(위 20 · 아래 80, 넘칠 수 있는 본문에만 — 2026-10-03).
#   - 반투명 색을 불투명 짝으로(v102): 머리 아래 선 stroke-neutral-subtle, 닫기 버튼 누름 bg-layer-floating-pressed.
#   - 모션 줄이기면 150ms 서서히 나타남(v104) — SEED 는 300ms 미끄러짐 그대로.
#   - 1280 미만의 오른쪽 패널은 Bottom Sheet — SEED Responsive Side Panel 의 경계는 md(768).
#   - 가로 화면에서 노치가 패널 쪽이면 폭에 안전 영역을 더한다(SEED 문서) — SEED 코드는 폭 안에서 뺀다.
#   - z-index: specs/z-index.md 의 L2(딤 z-modal 100 · 패널 z-modal-content 101).

name: SidePanel

slots:
  overlay: 딤 — 패널 뒤 화면 전체. 입력 폼이 아니면 누르면 닫힌다
  root: 패널 — 화면 높이 전체, 왼쪽 또는 오른쪽 끝에 붙는다. 모서리 · 그림자 · 선 없음
  header: 머리 — 제목 · 설명 · 닫기
  title: 제목 — 늘 있다(패널의 이름)
  description: 설명 — 덧붙일 말이 있을 때만
  closeButton: 닫기 — 투명 상자 52 · 아이콘 22. 이름 "닫기"
  divider: 머리 아래 선 — 본문이 스크롤됐을 때만
  body: 본문 — 넘치면 이 안에서만 스크롤(머리 · 바닥은 고정)
  fog: 끝 흐림 — Scroll Fog(scroll-fog.yaml 의 overlayBody). 넘칠 수 있는 본문에만 걸고, 걸면 늘 켜져 있다
  footer: 바닥 — 버튼, 오른쪽 정렬(오른쪽 패널)
  focusRing: 키보드 포커스 링(웹)

variants:
  side:
    left: 왼쪽 — 768 미만의 주 메뉴 서랍(지금 HR 폰)
    right: 오른쪽 — 1280 이상의 보조 작업(쓰는 곳 없음)
  size:
    small: 480 — 단순한 상세 조회
    medium: 720 — 기본. 두 줄 폼 · 목록과 상세 나란히
    large: 960 — 복잡한 설정 · 편집 도구
  scrollFog:
    "off": 기본 — 늘 들어맞는 본문
    "on": 넘칠 수 있는 본문(주 메뉴 · 목록 · 긴 폼) — 위 20 · 아래 80 이 늘 흐리다

defaults:
  side: right
  size: medium
  scrollFog: "off"

states:
  enabled: 열림
  scrolled: 본문이 위로 스크롤됨 — 머리 아래 선
  pressed: 닫기 버튼 누름 — 바탕 + 2px 거리 축소
  focused: 웹 — 키보드 포커스에만 링

rules:
  - when: {}
    enabled:
      overlay:
        background: { value: $overlay-dim-light, dark: $overlay-dim-dark, note: "groo 딤(v102) — SEED 0.455 는 들이지 않았다" }
        zIndex: { value: 100, note: "z-modal — specs/z-index.md L2" }
      root:
        height: { value: 화면 높이 전체, note: "dvh — 방향과 상관없이(SEED)" }
        maxWidth: { value: 80%, note: "딤이 늘 20% 남는다(SEED 코드). 768 미만이면 크기와 상관없이 화면 폭의 80%" }
        radius: { value: 0px, note: "평평 — 모서리 · 그림자 · 선 없이 딤과 면 색으로 뜬다(SEED)" }
        background: $color-bg-layer-floating
        shadow: none
        paddingBottom: { value: 아래 안전 영역, note: "패널 내용의 맨 아래 — 바닥이 없어도(SEED). 붙은 쪽 안전 영역(가로 노치)은 폭에 더한다" }
        zIndex: { value: 101, note: "z-modal-content — specs/z-index.md L2" }
      header:
        paddingTop: { value: $spacing-x6, note: "위 안전 영역을 더한다" }
        paddingX: $spacing-x6
        paddingBottom: $spacing-x4
        minHeight: { value: 70px, note: "제목 한 줄 + 위아래 — 닫기 버튼 상자가 들어간다" }
        gap: { value: $spacing-x1_5, note: "제목 ↔ 설명. 닫기 버튼이 있으면 오른쪽 52(24 + 아이콘 22 + 6)" }
      title:
        typography: $text-t8
        fontWeight: 700
        foreground: $color-fg-neutral
      description:
        typography: $text-t5
        fontWeight: 400
        foreground: $color-fg-neutral-muted
      closeButton:
        size: { value: 52px, note: "투명 상자 — 보이는 건 아이콘 22(Dialog 의 닫기와 같다)" }
        radius: $radius-r3
        iconSize: { value: 22px, note: "lucide x" }
        color: $color-fg-neutral-subtle
        top: { value: 28px, note: "아이콘이 패널 위에서 28 · 오른쪽 24 — 상자는 위 13 · 오른쪽 9. 제목 첫 줄 가운데와 맞는다" }
        right: $spacing-x6
        touchTarget: 52 × 52
        transitionProperty: background-color, scale
        transitionDuration: $motion-duration-color-transition
        transitionEasing: $motion-ease-easing
      divider:
        height: 1px
        background: { value: $color-stroke-neutral-subtle, note: "머리 아래 — 본문이 위 끝에서 떨어지면 나타난다(SEED). SEED stroke.neutral-muted 의 불투명 짝" }
        transitionDuration: $motion-duration-color-transition
        transitionEasing: $motion-ease-easing
      body:
        paddingX: $spacing-x6
        paddingBottom: { value: $spacing-x6, note: "바닥이 없을 때만 — 바닥이 있으면 0" }
        overflowY: auto
      footer:
        paddingTop: $spacing-x4
        paddingX: $spacing-x6
        paddingBottom: $spacing-x6
        gap: $spacing-x2
        justifyContent: { value: flex-end, note: "오른쪽 정렬 — [취소] [저장](Dialog 와 같다)" }
        buttonSize: { value: small 36, note: "Button small — 1280 이상의 오른쪽 패널" }
    scrolled:
      divider:
        opacity: { value: 1, note: "본문을 위로 스크롤하면 나타난다" }
    pressed:
      closeButton:
        background: { value: $color-bg-layer-floating-pressed, note: "SEED bg.transparent-pressed 의 떠 있는 표면 짝(v102)" }
        scale: { value: 2px 거리 축소, note: "기준 52 → 0.962 — 모션 줄이기면 하지 않는다" }
    focused:
      focusRing:
        width: 2px
        offset: 2px
        color: $color-stroke-focus-ring

  # ── 방향 ──────────────────────────────────────────────
  - when: { side: right }
    enabled:
      root:
        position: { value: 오른쪽 끝, note: "1280 이상 — 미만에서는 같은 내용을 Bottom Sheet 로" }

  # ── 크기(1280 이상의 오른쪽 패널만 — 왼쪽 서랍은 아래 규칙이 80% 로 덮는다) ──
  - when: { size: small }
    enabled:
      root: { width: 480px }
  - when: { size: medium }
    enabled:
      root: { width: 720px }
  - when: { size: large }
    enabled:
      root: { width: 960px }

  # ── 왼쪽 주 메뉴 서랍 — 크기 규칙 뒤에 두어 크기(오른쪽만)를 덮는다 ─────
  - when: { side: left }
    enabled:
      root:
        width: { value: 화면 폭의 80%, note: "768 미만에서만 쓴다 — 딤이 오른쪽 20% 에 남는다. 크기(480 · 720 · 960)는 오른쪽 패널만 쓴다" }
        position: { value: 왼쪽 끝, note: "왼쪽으로 끌면 닫힌다" }
      title:
        typography: { value: $text-t8, note: "서비스 이름(\"그루 이음\") — 주 메뉴 서랍의 제목" }
      body:
        paddingX: { value: $spacing-x4, note: "주 메뉴 — Side Navigation 의 항목(좌우 8)이 들어와 아이콘이 제목과 같은 24 에서 선다" }

  # ── 본문 끝 흐림(Scroll Fog) ──────────────────────────
  - when: { scrollFog: "on" }
    enabled:
      fog:
        mask: { value: $gradient-fade-mask, note: "Scroll Fog overlayBody(scroll-fog.yaml) — 늘 켜져 있다. SEED Side Panel 의 아래 48 대신" }
        size: { value: 위 20px · 아래 80px, note: "본문 상자의 위 · 아래 끝" }
      body:
        paddingTop: { value: 20px, note: "머리 아래 16 은 그대로 두고 본문 안에 더한다" }
        paddingBottom: { value: 80px, note: "바닥이 있어도 — 끝까지 내려도 마지막 줄이 흐림 아래 남지 않는다" }
        scrollPadding: { value: 위 20px · 아래 80px, note: "키보드로 옮긴 칸이 흐림 아래 멈추지 않게" }

motion:
  "열림 — 패널":
    duration: $motion-duration-d6
    easing: $motion-ease-enter-expressive
    properties: [translateX ∓100% → 0]
    note: "붙은 쪽에서 미끄러져 들어온다(SEED). 모션 줄이기면 150ms 서서히 나타남(v104)"
  "열림 — 딤":
    duration: $motion-duration-d6
    easing: $motion-ease-enter
    properties: [opacity 0 → 1]
  "닫힘 — 패널":
    duration: $motion-duration-d6
    easing: $motion-ease-exit-expressive
    properties: [translateX → ∓100%]
    note: "끌다 놓아 되돌아갈 때도 같은 시간"
  "닫힘 — 딤":
    duration: $motion-duration-d6
    easing: $motion-ease-exit
    properties: [opacity → 0]
  "머리 아래 선":
    duration: $motion-duration-color-transition
    easing: $motion-ease-easing
    properties: [box-shadow]
  "누름 — 닫기 버튼":
    duration: $motion-duration-pressed-scale
    easing: $motion-ease-pressed-scale
    properties: [scale]
