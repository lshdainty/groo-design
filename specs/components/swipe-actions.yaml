# Swipe Actions 의 수치 원본입니다. 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md 를 따릅니다.
#
# 폰(768 미만) 목록 줄을 왼쪽으로 밀면 오른쪽에서 동작 버튼이 드러나는 지름길입니다 — 같은 동작은 줄을 눌러 들어간 화면에도
# 모두 둡니다(줄 끝 ⋮ 는 두지 않습니다).
#
# 색은 원형 배지만 갖습니다(kind 규칙). 배지는 그 동작의 글자색(fg-critical · fg-informative)으로 채우고 아이콘은 반전 글자
# (fg-neutral-inverted)입니다 — 라이트는 짙은 배지 + 흰 아이콘, 다크는 밝은 배지 + 짙은 아이콘이라 두 모드 모두 배지가 줄 바탕과
# 3:1 을 넘습니다. 크기는 단일 사이즈(size: default)입니다. kind · size 에 기본값을 두지 않아 상태 표(#matrix)에는 상태마다 바뀌는
# 공통 값만 보입니다 — 상태와 상관없는 공통 값은 #base.enabled.

name: Swipe Actions

slots:
  row: ⓐ 감싸는 목록 줄 — 스펙이 내부를 정의하지 않는다. 높이는 원래 줄의 것이되 56 보다 낮으면 56(칸이 들어가게, 큰 글자면 칸만큼). 닫혔을 때 초점을 받을 수 있다(tabIndex -1)
  track: ⓑ 줄 뒤에 드러나는 자리 — 바탕을 칠하지 않는다
  action: ⓒ 동작 한 칸(버튼) — 원형 배지 + 그 아래 라벨, 세로 가운데. 누르는 자리는 이 칸 전체
  badge: 원형 배지 — 색은 여기만
  icon: 배지 안 아이콘
  label: 배지 아래 라벨
  focusRing: 키보드 포커스 링

variants:
  kind:
    neutral: 곁 동작 — 고정 · 보관 · 공유
    primary: 주 동작 — 수정
    destructive: 되돌리기 어려움 — 삭제
  size: [default]

states:
  enabled: ""
  hovered: 웹 — 누름과 같은 모습
  focused: (visible)
  pressed: (active)
  disabled: 전용 색 — 불투명도로 흐리지 않는다

rules:
  # ── 상태(공통) ────────────────────────────────────────
  - when: {}
    enabled:
      badge:
        background: { value: kind 색, note: "바탕은 배지에만 있습니다 — kind 별 값은 Kinds 표" }
      action:
        brightness: 100%
        shadow: none
        transform: { value: translateX(0), note: "누를 때 움직이지 않습니다 — 손가락으로 밀어 둔 트레이와 이중으로 움직이면 어지럽습니다" }
        cursor: pointer
    hovered:
      action: { brightness: 88% }
    focused:
      focusRing:
        width: 2px
        offset: { value: -2px, note: "안쪽 — 트레이 바깥으로 나가면 줄 경계에서 잘립니다" }
        color: $color-stroke-focus-ring
    pressed:
      action: { brightness: 88% }
    disabled:
      action:
        cursor: not-allowed
      badge:
        background: $color-bg-disabled
      icon:
        color: $color-fg-disabled
      label:
        color: $color-fg-disabled

  # ── 종류별 색 ─────────────────────────────────────────
  - when: { kind: neutral }
    enabled:
      badge:
        background: { value: $color-bg-neutral-weak, note: "줄 바탕과 1.08 · 다크 1.30 이라 안쪽 1px 테두리로 둘레를 잡습니다(배지는 아이콘 · 라벨로 읽힙니다)" }
        borderWidth: 1px
        borderColor: $color-stroke-neutral-weak
      icon: { color: $color-fg-neutral }
      label: { color: $color-fg-neutral-muted }
    disabled:
      badge:
        borderColor: { value: $color-stroke-neutral-weak, note: "막혀도 안쪽 1px 은 남습니다 — 막힘의 테두리 색이 바로 이 색입니다. 빼면 bg-disabled 배지가 줄 바탕과 1.08 · 다크 1.30 으로 둘레가 사라집니다" }

  - when: { kind: primary }
    enabled:
      badge: { background: { value: $color-fg-informative, note: "라이트 #1D6EC9 · 다크 #69ABFF — 줄 바탕과 5.09 · 다크 6.12(다크에서 bg-informative-solid #0F65BF 를 쓰면 2.51)" } }
      icon: { color: { value: $color-fg-neutral-inverted, note: "라이트 흰 · 다크 짙은 글자 — 배지 위 5.09 · 6.12" } }
      label: { color: { value: $color-fg-neutral-muted, note: "주 동작도 라벨은 회색 — 색은 배지가 알립니다" } }

  - when: { kind: destructive }
    enabled:
      badge: { background: { value: $color-fg-critical, note: "라이트 #D72323 · 다크 #FF8477 — 줄 바탕과 5.06 · 다크 6.08(다크에서 bg-critical-solid #CC0E17 을 쓰면 2.51)" } }
      icon: { color: { value: $color-fg-neutral-inverted, note: "라이트 흰 · 다크 짙은 글자 — 배지 위 5.06 · 6.08" } }
      label: { color: { value: $color-fg-critical, note: "줄 바탕 위 5.06 · 다크 6.08 — 라이트 · 다크 한 토큰" } }

  # ── 크기(단일) ────────────────────────────────────────
  - when: { size: default }
    enabled:
      action:
        height: { value: 줄 높이, note: "min 56 — 줄이 56 보다 낮으면 56 입니다" }
        width: { value: 배지 + 앞 간격, note: "첫 액션 56, 이후 48 — 앞 간격(첫 20 · 다음 12) + 배지 36. 라벨 글이 배지보다 넓으면(영어 · 큰 글자) 배지 자리가 글 폭만큼 넓어집니다 — 최소 36" }
        paddingY: 0
        paddingX: { value: 앞 간격만, note: "첫 동작 앞 20 · 동작끼리 12 — 마지막 동작은 화면 끝에 붙습니다" }
        gap: { value: $spacing-x0_5, note: "배지 ↔ 라벨 2" }
        touchTarget: { value: 칸 전체, note: "48 ~ 56 × 줄 높이(56 이상) — AA ✓ · AAA ✓" }
      badge:
        size: 36px
        radius: { value: $radius-full, note: "원형" }
      icon:
        size: 18px
      label:
        typography: { value: $text-t2, note: "12 — 굵기 · 줄 높이는 아래 따로 적은 값이 덮습니다(12 / 700 / 1.3 = 15.6px — 스펙 JSON 은 typography 에 접어 싣습니다). 칸 폭 48 이 좁아 기본 줄 높이면 두 줄에서 넘칩니다" }
        fontWeight: { value: 700, note: "버튼 글자와 같은 700 — 600 은 쓰지 않습니다" }
        lineHeight: { value: 1.3, note: "웹 · 앱 같은 값" }

motion:
  "열림 · 닫힘":
    duration: $motion-duration-d3
    easing: { value: $motion-ease-enter, note: "손을 뗀 뒤 자리를 잡는 감속 — 끄는 동안은 손가락을 1:1 로 따라가며 모션이 없습니다" }
    properties: [transform]
    note: "모션 줄이기면 바로 바꿉니다 — 끌기 따라가기는 모션이 아니라 그대로입니다"
