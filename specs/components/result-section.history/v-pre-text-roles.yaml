# Result Section 의 수치 원본 — 구조는 SEED Result Section(2026-10-02 사용자 결정, 비교 페이지 1 · 2 · 8).
# 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 화면이나 그 영역 가운데에 놓는 결과 — 비어 있음 · 불러오기 실패(다시 시도) · 완료 · 찾을 수 없는 페이지(404) ·
# 화면 오류. 한 틀로 그리고, 실패는 비어 있음과 다르게(아이콘 · 글 · 다시 시도) 보인다.
#
# SEED 와 다른 자리(result-section.md 의 "SEED 와 다른 점")
#   - 스펙(YAML)으로 둔다 — SEED 는 rootage · CSS 가 없고 조합 예제(snippet) 하나다.
#   - 결과 셋(empty · failure · done)의 아이콘 색을 정한다 — SEED 는 예제에서만 보인다.
#   - 애니메이션 에셋(Lottie)은 두지 않는다 — 아이콘 40(lucide 선 아이콘, v106).
#   - 제목은 제목 태그, 결과가 바뀌면 보조 기술에 알린다(SEED 는 span · 알림 없음).

name: ResultSection

slots:
  root: 묶음 — 놓인 자리 가운데
  asset: 아이콘 — 결과를 한눈에
  title: 제목 — 무슨 상태인지 한 줄
  description: 설명 — 왜 · 무엇을 하면 되는지, 최대 두 줄
  actions: 버튼 — 최대 둘, 위아래로
  primaryButton: 첫 버튼 — 해결 · 다음 동작(다시 시도 · 거래 추가)
  secondaryButton: 둘째 버튼 — 보조 동작(홈으로 · 다른 파일 가져오기)

variants:
  size:
    large: 화면 전체를 차지하는 결과(빈 화면 · 404 · 완료 화면)
    medium: 카드 · 섹션 · 시트 같은 화면 일부의 결과
  kind:
    empty: 비어 있음 · 처음 — 회색 아이콘
    failure: 불러오기 실패 · 화면 오류 — 위험 색 아이콘, 첫 버튼은 "다시 시도"
    done: 완료 — 성공 색 아이콘

defaults:
  size: large
  kind: empty

states:
  enabled: 보임

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      root:
        paddingX: { value: $spacing-x12, note: "카드(card.md) 안에서는 0 — 카드 안 여백 24 가 가장자리를 맡는다(2026-10-09 사용자 결정, 데이터 표시 비교 페이지 23B). 표의 빈 줄도 카드 안이다(칸이 24). 목록 카드(body list)에 바로 두면 24 — 목록 카드는 줄마다 24 를 가져 카드 여백이 없다" }
        paddingY: $spacing-x4
        alignItems: { value: center, note: "놓인 자리의 가로 · 세로 가운데 — 남는 높이를 채운다" }
        textAlign: center
      asset:
        size: { value: 40px, note: "lucide 선 아이콘(굵기 1.5)" }
        marginBottom: $spacing-x4
      title:
        fontWeight: 700
        foreground: $color-fg-neutral
      description:
        fontWeight: 400
        foreground: { value: $color-fg-neutral-muted, note: "단어 단위 줄바꿈(v114) — 최대 두 줄을 권한다" }
      actions:
        gap: { value: $spacing-x5, note: "첫 버튼과 둘째 버튼(글 버튼) 사이 — 둘째 버튼이 위아래로 8 블리드해 상자 사이는 12(SEED 와 같다)" }
      primaryButton:
        buttonSize: { value: medium 40, note: "Button neutralWeak" }
      secondaryButton:
        buttonSize: { value: small 36, note: "Button ghost — 위아래로 블리드해 글 자리만 차지" }

  # ── 크기 ──────────────────────────────────────────────
  - when: { size: large }
    enabled:
      title: { typography: { value: $text-t8, note: "22 / 30 — 마침표 없이(큰 글씨)" } }
      description: { typography: $text-t5, marginTop: $spacing-x3 }
      actions: { marginTop: $spacing-x7 }
  - when: { size: medium }
    enabled:
      title: { typography: $text-t5 }
      description: { typography: $text-t4, marginTop: $spacing-x2 }
      actions: { marginTop: $spacing-x6 }

  # ── 결과 ──────────────────────────────────────────────
  - when: { kind: empty }
    enabled:
      asset: { color: { value: $color-fg-neutral-subtle, note: "빈 상태를 말하는 아이콘(검색 · 영수증 · 알림 …)" } }
  - when: { kind: failure }
    enabled:
      asset: { color: { value: $color-fg-critical, note: "circle-alert" } }
  - when: { kind: done }
    enabled:
      asset: { color: { value: $color-fg-positive, note: "circle-check" } }

motion:
  "결과로 바뀜":
    duration: $motion-duration-d3
    easing: $motion-ease-enter
    properties: [opacity 0 → 1]
    note: "불러오는 중 → 결과는 투명도만 — 보조 기술에 알린다(role=status)"
