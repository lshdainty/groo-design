# Content Placeholder 의 수치 원본입니다. 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md 를 따릅니다.
#
# 이미지가 없거나 불러오지 못했을 때 그 자리를 채우는 대체 그림입니다 — 옅은 면 + 가운데 그림. 불러오는 동안에는 쓰지 않습니다
# (그때는 같은 모서리의 Skeleton 입니다). 깨진 이미지 아이콘 · 빈 칸을 보이지 않습니다. 그림 틀은 Image Frame(image-frame.yaml)이 이것을
# 대체 그림으로 씁니다. 자산 · 카드 로고의 글자 모노그램은 이것이 아니라 Logo Tile(logo-tile.yaml)의 첫 글자입니다. 아는 카드사의 그림 없는
# 카드도 이것이 아니라 카드 면(card-art.yaml)입니다.
#
# 그림은 lucide 선 아이콘(기본 image)이고, 그림 색은 stroke-neutral-weak(Bottom Sheet 손잡이와 같은 역할)입니다.
# 면 위 1.14 · 다크 1.20 으로 옅은 장식입니다.

name: ContentPlaceholder

slots:
  root: 자리 — 담는 틀(이미지 틀)을 채운다. 모서리는 담는 틀이 자른다
  glyph: 그림 — 가운데, 정사각. 무엇이 없는지 말하는 선 아이콘

variants: {}

states:
  enabled: 이미지가 없거나 불러오지 못함

rules:
  - when: {}
    enabled:
      root:
        width: { value: 100%, note: "담는 틀을 채운다 — 크기 · 비율은 담는 틀이 정한다" }
        height: 100%
        radius: { value: 0px, note: "제 모서리가 없다 — 담는 틀(카드 · 썸네일)이 자른다" }
        background: { value: $color-bg-neutral-weak, note: "Skeleton 면과 같은 색 — 흰 면 위 1.08 · 다크 1.30" }
      glyph:
        size: { value: 틀 높이의 50%, note: "정사각 — 16 이상 160 이하로 자른다. 틀 폭이 그보다 좁으면 폭에 맞춘다" }
        minWidth: 16px
        maxWidth: 160px
        color: { value: $color-stroke-neutral-weak, note: "면 위 1.14 · 다크 1.20 — 장식. 무엇이 없는지는 대체 글이 말한다" }
        strokeWidth: { value: "1.5", note: "lucide 24 격자 기준 — 그림 크기를 따라 굵어진다(Result Section 아이콘과 같은 결)" }
