# Searchable List 의 수치 원본 — 검색칸은 Input(SEED Text Input), 결과 줄은 List(SEED List Item + Radiomark), 결과 없음은
# Result Section, 키보드는 SEED 문서 사이트 검색 창의 콤보박스(2026-10-08 사용자 결정, 데이터 표시 비교 페이지 12A · 13A ·
# "따라오는 것"). 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# SEED 에는 이 컴포넌트가 없다 — "SEED는 아직 Combobox를 제공하지 않습니다."(Select 문서) · Search Bar 는 Figma 전용이다.
# 그래서 부품 단위로 SEED 를 따른다: 검색칸 = Text Input 의 밑줄형(화면에 입력이 하나뿐 — SEED "화면에 하나의 Input만 있는 경우 Underline",
# 사용자 결정 17A), 결과 = List 줄 + 오른쪽 Radiomark, 0건 = Result Section,
# 키보드 = 문서 사이트 검색 창(초점은 입력칸, 화살표는 강조만 옮긴다 — aria-activedescendant). 줄 · 검색칸의 수치는
# list.yaml · input.yaml 이 원본이고, 여기에는 이 묶음에서 정하는 값과 쓰는 자리만 둔다.
#
# 상태는 결과 줄의 상태다 — highlighted(화살표 · 마우스로 짚음 — 같은 바탕) · pressed(누름). 줄은 초점을 받지 않는다(초점은 늘 입력칸).
# 마우스로 짚은 강조는 포인터가 목록을 떠나면 지운다(2026-10-15 사용자 결정 — 구현 세션 질문 Q-007-2, 안 B). 강조 바탕은 Menu · List 처럼
# 좌우 0 → 6 · 모서리 0 → 10 으로 들어오며 둥글어진다(Q-009-3 안 B 를 따른다).
# 크기(size) · 놓인 자리(placement) · 앞 붙이개(prefix) · 고름(selected) · 지금 값 표시(selectionMark)는 상태와 곱해지므로 축이다.
# selectionMark off 는 누르면 바로 더하고 닫는 목록(종목 추가)이다 — 지금 값이 없어 라디오를 두지 않는다(2026-10-29 사용자 결정 17-1 Q4 = B).
#
# SEED 와 다른 자리(searchable-list.md 의 "SEED 와 다른 점")
#   - 강조 바탕은 불투명한 bg-layer-default-pressed(List 의 누름 바탕) — SEED 문서 검색은 bg.transparent-pressed(투명도 있음).
#   - 지우기 버튼을 둔다 — SEED 는 문서 · Figma 에만 있고 코드에 없다.
#   - 서버 검색은 300ms 기다렸다 보낸다 · 분류 머리(List Header)로 묶는다 — SEED 에 규칙이 없다.

name: SearchableList

slots:
  root: 묶음 — 위 검색칸 + 아래 결과. 검색 시트 · 팝오버 안 또는 화면 · 단계 안
  field: 검색칸 — Input 밑줄형 · 앞 돋보기 · 지우기, 이름 "검색"
  results: 결과 목록 — listbox. 줄은 List 의 누르는 줄
  groupHeader: 분류 머리 — List Header mediumWeak("시중은행" · "증권사")
  option: 결과 줄 — List 줄. 초점은 받지 않는다
  highlight: 강조 바탕 — 화살표 · 마우스로 짚은 줄
  prefix: 앞 붙이개 — Logo Tile 40 · 카드 그림 56 · Avatar
  title: 제목 — 16 / 22
  detail: 설명 — 13 / 18
  radio: 오른쪽 라디오 — 지금 고른 값. 누르면 바로 더하는 목록(selectionMark off)에는 없다
  status: 결과 없음 · 실패 — Result Section medium
  skeleton: 불러오는 줄 — 줄 모양 스켈레톤

variants:
  size:
    large: 밑줄형 검색칸 40 — 1280 미만 · 앱(기본)
    medium: 밑줄형 검색칸 34 — 1280 이상 웹(마우스)
  placement:
    sheet: Input Button 이 연 검색 시트 · 팝오버 — 고르면 닫힌다(기본)
    inline: 화면 · 단계 안 — 고르면 라디오만 바뀌고, 단계의 버튼으로 넘어간다
  prefix:
    none: 앞 없음(기본)
    logo: 은행 · 증권 · 카드사 — Logo Tile 40
    cardArt: 카드 상품 — 카드 그림 56
    avatar: 사람 — Avatar 36(한 줄) · 42(두 줄)
  selected:
    other: 고르지 않은 줄(기본)
    current: 지금 고른 값 — 오른쪽 라디오 켬
  selectionMark:
    "on": 기본 — 오른쪽 라디오. 하나를 골라 칸에 넣는 목록(은행 · 증권 · 카드 상품 · 결재자)
    "off": 누르면 바로 더하고 닫는 목록(투자 폼의 "종목 추가") — 지금 값이 없어 라디오를 두지 않는다

defaults:
  size: large
  placement: sheet
  prefix: none
  selected: other
  selectionMark: "on"

states:
  enabled: 기본
  highlighted: 화살표(↓ · ↑) · 마우스로 짚은 줄 — 같은 바탕, 초점은 입력칸에 그대로
  pressed: 누름 — 바탕 + 콘텐츠만 2px 거리 축소(List)

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      root:
        gap: { value: $spacing-x2, note: "검색칸 ↔ 결과 목록 8" }
      field:
        variant: { value: underline, note: "Input 밑줄형(input.yaml) — 화면(시트)에 입력이 하나뿐인 목록 위 검색. 아래 1px stroke-neutral-weak, 입력 중 2px stroke-neutral-contrast · 모서리 · 좌우 여백 없음. 앞 돋보기 · 지우기 · placeholder \"{무엇} 검색\" · 이름 \"검색\"(사용자 결정 17A — 상자형 52 는 고르지 않았다)" }
        height: { value: 40px, note: "large — 위아래 8 · 글 18 / 24(t6) · 앞 아이콘 24 · 지우기 22(누르는 영역 44) · 사이 10" }
        marginX: { value: $spacing-x6, note: "좌우 24 — 밑줄형은 좌우 여백이 없어 돋보기가 줄의 앞 붙이개와 한 줄에 선다" }
        position: { value: sticky, note: "위에 붙는다 — 목록만 스크롤" }
      results:
        role: { value: listbox, note: "보조 기술 이름은 그 목록의 대상(\"은행\") — 입력칸이 aria-controls 로 가리킨다" }
        debounce: { value: 300ms, note: "서버 검색 — 마지막 입력 뒤 300ms 에 한 번 보낸다(글자마다 보내지 않는다). 들고 있는 목록을 거르면 바로" }
        filter: { value: "NFC · 대소문자 무시 · 공백 무시 · 포함", note: "검색어와 이름 · 별칭을 NFC 로 맞추고 소문자로 바꾸고 공백을 모두 지운 뒤, 이름이나 별칭 하나에 검색어가 들어 있으면 남긴다(\"kx 은행\" → KX은행). 들고 있는 목록 · 서버 검색이 같은 규칙이다(2026-10-15 사용자 결정 — 구현 세션 질문 Q-007-1, 안 C). 초성 검색은 아직 정하지 않았다(따로 정한다)" }
        pointerLeave: { value: 마우스 강조를 지운다, note: "마우스로 짚은 강조는 포인터가 목록을 떠나면 지운다 — 키보드(↓ · ↑)로 짚은 강조는 남는다(2026-10-15 사용자 결정 — 구현 세션 질문 Q-007-2, 안 B). Menu · Select · List 의 호버와 같다" }
        maxHeight: { value: 놓인 자리, note: "시트는 시트 높이를 채우고, 팝오버는 Popover 최대 높이(600) 안에서 스크롤한다. 강조한 줄은 늘 보이게 스크롤한다" }
      groupHeader:
        variant: { value: mediumWeak, note: "List Header — 14 · 500 · fg-neutral-subtle · 좌우 24 · 위아래 8(list-header.yaml). 분류마다 하나, 걸러져 줄이 없는 분류는 머리도 숨긴다" }
      option:
        role: option
        paddingY: { value: $spacing-x3, note: "List 줄 그대로 — 좌우 24. 높이는 내용 + 위아래 24: 한 줄 48(라디오 24 — 라디오가 없으면 최소 높이 48) · 두 줄 66 · 앞 40 64" }
        paddingX: $spacing-global-gutter
        minHeight: { value: 48px, note: "한 줄 줄의 바닥 — 라디오(24)가 있으면 내용이 48 을 채우고, 라디오가 없는 줄(selectionMark off — 제목 22 + 위아래 24 = 46)도 48 을 지킨다(2026-10-29)" }
        cursor: pointer
        touchTarget: { value: 줄 전체, note: "48 이상 — AA ✓ · AAA ✓" }
      highlight:
        background: transparent
        insetX: { value: 0px, note: "강조가 없을 때는 줄 폭 전체 — 짚으면 6 으로 들어온다(List · Menu 와 같다)" }
        radius: 0px
      title:
        typography: $text-t5
        fontWeight: 400
        foreground: $color-fg-neutral
      detail:
        typography: $text-t3
        foreground: { value: $color-fg-neutral-subtle, note: "카드사 · 종류 · 연회비처럼 여럿이면 Tag Group(\" · \")" }
      radio:
        size: { value: 24px, note: "Radio 의 동그라미(Radiomark) large — 보는 표시라 보조 기술에 숨긴다(고름은 aria-selected 가 알린다)" }
      status:
        size: { value: Result Section medium, note: "결과 자리 가운데 — 0건 \"'{검색어}'에 대한 검색 결과가 없어요\" · 실패 \"검색 결과를 불러오지 못했어요\" + 다시 시도. 바뀌면 role=\"status\" 로 한 번 알린다" }
      skeleton:
        size: { value: 줄 다섯, note: "List 줄 높이 그대로 — 앞 자리(Logo Tile 12 · 카드 그림 Image Frame 의 모서리) + 제목 t5(22) 40% + 설명 t3(18) 60%. 1 · 5 · 10초 시간표(skeleton.md)" }
    highlighted:
      highlight:
        background: { value: $color-bg-layer-default-pressed, note: "화살표로 짚은 줄 · 마우스를 올린 줄이 같은 바탕 — 줄은 하나만 강조된다" }
        insetX: { value: $spacing-x1_5, note: "좌우 6 들어온 바탕(List 의 누름 바탕)" }
        radius: { value: $radius-r2_5, note: "10 — List 의 누름 바탕과 같다" }
    pressed:
      highlight:
        background: $color-bg-layer-default-pressed
        insetX: $spacing-x1_5
        radius: $radius-r2_5
      option:
        scale: { value: 2px 거리 축소, note: "콘텐츠 층만(List) — 모션 줄이기면 하지 않는다" }

  # ── 크기 ──────────────────────────────────────────────
  - when: { size: medium }
    enabled:
      field:
        height: { value: 34px, note: "medium — 위아래 6 · 글 16 / 22(t5) · 앞 아이콘 20 · 지우기 18 · 사이 8" }

  # ── 놓인 자리 ─────────────────────────────────────────
  - when: { placement: sheet }
    enabled:
      option:
        press: { value: 고르고 닫는다, note: "하나 고르기 — \"완료\" 를 두지 않는다(Input Button 의 \"목록은 누르면 바로\"). 열면 검색칸에 초점 — 시트 · 팝오버의 첫 초점으로 받는다(onOpenAutoFocus, 열린 뒤 다시 옮기지 않는다). 지금 값이 보이게 스크롤" }
  - when: { placement: inline }
    enabled:
      option:
        press: { value: 라디오만 바뀐다, note: "고른 것을 라디오로 보이고 아무것도 닫거나 넘기지 않는다 — 단계의 버튼(\"다음\" · \"저장\")이 반영한다(Select Box 의 \"반영은 버튼\")" }

  # ── 앞 붙이개 ─────────────────────────────────────────
  - when: { prefix: logo }
    enabled:
      prefix:
        size: { value: 40px, note: "Logo Tile 40 · 모서리 12 · 기관 색 + 첫 글자(logo-tile.yaml) — 이름 옆이라 장식" }
  - when: { prefix: cardArt }
    enabled:
      prefix:
        width: { value: 56px, note: "카드 그림 — Image Frame 카드 비율(1.586) · 폭 56 이라 모서리 8. 그림이 없으면 카드 면(card-art.yaml)" }
  - when: { prefix: avatar }
    enabled:
      prefix:
        size: { value: 36px, note: "제목 한 줄 36 · 제목 + 설명 42(Avatar)" }

  # ── 고름 ──────────────────────────────────────────────
  - when: { selected: current }
    enabled:
      radio:
        display: { value: 켬, note: "Radio 켬 모양 — 바탕 bg-neutral-inverted + 가운데 점(radio-group.yaml). 줄 바탕은 그대로 — 고른 줄을 칠하지 않는다" }

  # ── 지금 값 표시 ──────────────────────────────────────
  - when: { selectionMark: "off" }
    enabled:
      radio:
        display: { value: 없음, note: "누르면 바로 더하고 닫는 목록 — 채워질 일이 없는 동그라미를 두지 않는다. 줄 높이(최소 48) · 좌우 24 · 제목 오른쪽 10 은 그대로다(2026-10-29 사용자 결정 17-1 Q4 = B)" }
      option:
        press: { value: 더하고 닫는다, note: "누른 줄을 바로 더하고(onValueChange) 시트 · 팝오버를 닫는다 — 지금 값을 들지 않는다(value 를 주지 않는다). 칸에 넣는 목록이 아니라 \"종목 추가\" 같은 동작이다" }

motion:
  "강조 · 누름 — 바탕":
    duration: $motion-duration-color-transition
    easing: $motion-ease-easing
    properties: [background-color, inset, border-radius]
    note: "마우스 · 누름은 바탕이 좌우 0 → 6 들어오며 모서리 0 → 10 으로 둥글어진다(Menu 알약과 같은 움직임 — 2026-10-15 사용자 결정 Q-009-3 안 B, SEED 는 들임 · 모서리 d3 · 색 color-transition — 둘 다 150ms). 화살표로 옮길 때는 바로(전환 없이) — 빠르게 누르면 바탕이 따라오지 못한다"
  "누름 — 콘텐츠":
    duration: $motion-duration-pressed-scale
    easing: $motion-ease-pressed-scale
    properties: [scale]
    note: "모션 줄이기면 하지 않는다"
