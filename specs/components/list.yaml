# List 의 수치 원본 — 구조는 SEED List(List · List Item, 2026-10-01 사용자 결정). 목록 제목은 list-header.yaml.
# 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 부위: root 는 목록(List — 줄을 세로로 잇는다), item 은 한 줄(List Item).
# 한 줄은 두 층이다 — background(바탕 층: 누름 · 호버 · 강조 바탕, 줄지 않는다)와
# content(콘텐츠 층: 앞 · 본문 · 뒤, 누르면 이 층만 준다 — 기초 Feedback v104 "목록 줄은 콘텐츠만").
# 누르는 줄은 줄 전체가 누르는 영역이다 — 보기만 하는 줄(ListItem)에는 hovered · focused · pressed 가 없다.
#
# 강조(highlight)는 pressed · hovered 와 곱해지므로 상태가 아니라 축이다(specs/CLAUDE.md).
#
# SEED 와 다른 자리(list.md 의 "SEED 와 다른 점")
#   - 좌우 여백은 화면 가장자리 규칙 spacing-global-gutter 24(SEED 16 — porest 2026-09-14 결정).
#   - 앞 타일(내용 줄의 색 상자 40)을 둔다 — SEED 앞 자리는 아이콘 · 아바타 · 컨트롤뿐(사용자 결정). 물건 줄의 로고 타일은 logo-tile.yaml.
#   - 누름 · 호버 바탕은 불투명한 bg-layer-default-pressed(SEED transparent-pressed 는 투명도가 있어 검사기가 받지 않는다 — v102).
#   - 막힌 줄은 값 글자 · 타일도 비활성 색(SEED 는 제목 · 설명 · 아이콘만 — porest 비활성은 전용 색, v106).
#   SEED 와 같은 자리: 누르면 콘텐츠 층만 준다(SEED scaleScope: content — 배율은 기초 Feedback v104 의 2px 거리).
#   - 포커스 링(웹)은 줄 안쪽 2px — v106 의 띄움 2px 는 화면 폭 줄에서 잘린다. SEED 는 목록 줄의 포커스 링을 정하지 않았다.
#   - 하위 줄(nest)과 줄 앞 꺾쇠 단추 — SEED List 에 없다. 카테고리처럼 부모 · 하위 두 단계에서 줄은 편집, 하위만 접는 자리
#     (2026-10-10 사용자 결정 7C — 펼치고 접기 · 나누기 비교 페이지, 정렬은 17B — 부모 타일 52 · 하위 타일 104 의 두 세로줄).
#     펼침 상태는 하위 줄 묶음의 상태라 축(expanded)으로 둔다. 늘 펼친 편집 화면은 축(mode — fixed, 레시피 collapsible={false})이다
#     (2026-10-15 사용자 결정 — 구현 세션 질문 Q-002, 안 B — Tree View 의 mode · collapsible 과 같은 이름 · 같은 뜻).
#   - 긴 값 — 본문 최소 1em · 제목 · 글 설명 overflow-wrap anywhere · 글 값은 줄 끝에서 끊는다(2026-10-15 사용자 결정 — 구현 세션 질문 Q-001, 안 A).
#     SEED 는 뒤 붙이개 flexShrink 0 · 본문 flexGrow 1 만 둔다 — 줄지 않는 값 · 양보하는 본문은 SEED 와 같고, 겹침을 막는 셋만 더했다.

name: List

slots:
  root: 목록(List) — 줄을 세로로 잇는다. 배경 · 줄 사이 간격 없음
  item: 한 줄(List Item) — 누르는 줄은 줄 전체가 누르는 영역
  background: 바탕 층 — 누름 · 호버 · 강조 바탕. 콘텐츠 뒤에 깔리고 줄지 않는다
  content: 콘텐츠 층 — 앞 · 본문 · 뒤를 담는다. 누르면 이 층만 준다
  prefix: 앞 붙이개 자리
  icon: 앞 아이콘 — 설정 · 메뉴 줄
  tile: 앞 타일(색 상자) — 색이 뜻을 가진 내용 줄(거래 · 카테고리 · 알림 종류)
  body: 본문 — 제목 + 설명
  title: 제목
  detail: 설명
  suffix: 뒤 붙이개 자리 — 값 글자 · 화살표 · 컨트롤 · 작은 버튼
  suffixText: 뒤 값 글자
  suffixIcon: 뒤 아이콘 — 오른쪽 화살표
  divider: 줄 사이 선(ListDivider) — 필요할 때만
  expandButton: 줄 앞 꺾쇠 단추 — 부모 줄의 하위 줄을 펼치고 접는다(누르는 44). 줄을 누르면 하는 일(편집)과 따로 눌린다
  subList: 하위 줄 묶음 — 부모 줄 바로 아래에서 펼치고 접힌다
  focusRing: 키보드 포커스 링(웹) — 줄 안쪽

variants:
  align:
    center: 기본 — 앞 · 뒤가 본문의 세로 가운데
    top: 제목이 두 줄을 넘거나 설명이 길 때 — 앞 · 뒤를 위에 맞춘다
  highlight:
    none: 기본
    highlighted: 새 알림처럼 주목이 필요한 줄 — 옅은 브랜드 바탕
  nest:
    none: 단계 없는 목록(기본)
    parent: 맨 위 단계 줄 — 앞에 꺾쇠 자리(4 + 44 + 4)를 둔다. 하위가 있으면 꺾쇠 단추, 없으면 같은 폭의 빈 자리
    child: 하위 줄 — 부모의 제목 자리(104)에서 시작한다
  expanded:
    collapsed: 하위 줄 접힘(기본) — 꺾쇠가 오른쪽
    expanded: 하위 줄 펼침 — 꺾쇠가 아래
  mode:
    foldable: 접는 부모 줄(기본 — 레시피 collapsible 기본 true). 하위가 있으면 꺾쇠 단추, 이름(expandLabel)은 필수
    fixed: 늘 펼친 편집 화면 — 레시피 collapsible={false}. 꺾쇠 단추 · 펼침 상태가 없고 하위 줄이 늘 보인다

defaults:
  align: center
  highlight: none
  nest: none
  expanded: collapsed
  mode: foldable

states:
  enabled: 기본
  hovered: 웹 · 누르는 줄 — 누름과 같은 바탕(v106)
  focused: 웹 · 누르는 줄 — 키보드 포커스에만 줄 안쪽 링
  pressed: 누르는 줄 — 바탕 + 콘텐츠만 2px 거리 축소(v104)
  disabled: 전용 색(v106) — 불투명도로 흐리게 하지 않는다

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      root:
        gap: { value: 0px, note: "줄 사이 간격 없음 — 줄의 위아래 여백이 간격이다" }
      item:
        paddingY: $spacing-x3
        paddingX: { value: $spacing-global-gutter, note: "화면 가장자리 규칙 24(SEED 16). 안쪽 여백을 바꿔도 이보다 좁히지 않는다" }
        alignItems: center
        cursor: { value: pointer, note: "누르는 줄만" }
        touchTarget: { value: 44 × 44, note: "누르는 줄은 줄 전체 — 한 줄짜리도 46 이라 44 를 넘는다" }
      background:
        background: transparent
        insetX: 0px
        radius: 0px
        transitionProperty: { value: "background-color, inset, border-radius", note: "누르면 바탕이 안쪽으로 들어오며 둥글어진다(SEED)" }
        transitionDuration: { value: $motion-duration-color-transition, note: "SEED 는 바탕 색만 color-transition, 들임 · 모서리는 d3 — 둘 다 150ms 라 하나로 적었다" }
        transitionEasing: $motion-ease-easing
      content:
        transitionProperty: scale
        transitionDuration: $motion-duration-pressed-scale
        transitionEasing: $motion-ease-pressed-scale
      prefix:
        paddingRight: $spacing-x3
      icon:
        size: 22px
        color: $color-fg-neutral
      tile:
        size: 40px
        radius: { value: $radius-r3, note: "크기 × 0.3 — 타일 크기를 바꾸면 모서리도 그 비율로" }
        background: { value: "chart-{색}-weak", note: "카테고리 색의 옅은 바탕(v111) — 이체 줄은 회색(chart-gray-weak, 2026-10-04). 은행 · 카드 같은 물건 줄은 Logo Tile(logo-tile.yaml)" }
        iconSize: 20px
        color: { value: "chart-{색}", note: "카테고리 색 — 옅은 바탕 위 3:1 이상(가장 낮은 yellow 라이트 3.63). 이체 줄은 chart-gray. 아이콘이 없는 카테고리는 태그 아이콘(lucide tag) — 빈 칸 · 첫 글자를 넣지 않는다(2026-10-04)" }
      body:
        gap: $spacing-x0_5
        paddingRight: { value: $spacing-x2_5, note: "본문과 뒤 붙이개 사이" }
        flexGrow: { value: 1, note: "남는 폭을 본문이 쓰고, 값이 길면 본문이 먼저 양보한다(SEED content flexGrow 1)" }
        minWidth: { value: 1em, note: "본문은 한 글자(1em)까지 준다 — 뒤 여백 10 은 따로 더한다(레시피 calc(1em + 10px)). 값이 본문 위로 넘쳐 겹치지 않게(2026-10-15 사용자 결정 — 구현 세션 질문 Q-001, 안 A)" }
      title:
        typography: $text-t5
        fontWeight: { value: 400, note: "SEED 와 같다 — 굵기는 목록 제목 · 금액 같은 자리에 남긴다(사용자 결정)" }
        foreground: $color-fg-neutral
        overflowWrap: { value: anywhere, note: "평소에는 단어 단위(v114 — keep-all + break-word)로 바꾸고, 본문이 낱말 하나보다 좁아질 때만 글자 사이에서 끊어 칸 밖으로 넘치지 않는다(Q-001 A)" }
      detail:
        typography: $text-t3
        foreground: $color-fg-neutral-subtle
        overflowWrap: { value: anywhere, note: "글 설명도 제목처럼 — 본문이 낱말 하나보다 좁아질 때만 글자 사이에서 끊어 뒤 붙이개에 닿지 않는다(2026-10-15 사용자 결정 — 구현 세션 질문 Q-001, 안 A). Tag Group 설명은 그 스펙대로 한 줄 말줄임" }
      suffix:
        gap: $spacing-x1
        shrink: { value: 0, note: "줄지 않는다(SEED suffix flexShrink 0) — 값이 길면 본문이 1em 까지 양보한다. 금액 · 화살표 · 컨트롤 · 작은 버튼은 한 덩어리로 선다. 값을 줄여 적는 것(억 단위 등)은 그 화면이 정한다" }
      suffixText:
        typography: $text-t5
        foreground: $color-fg-neutral-subtle
        shrink: { value: 1, note: "글 값(이메일 · 계좌번호 · 긴 이름 — suffix 에 글을 그대로 넘긴 것)만 — 본문이 1em 이 된 뒤에야 준다(최소 폭 0)" }
        overflowWrap: { value: anywhere, note: "남는 폭보다 길면 줄 끝에서 끊는다 — 본문 위로 넘쳐 덮지 않는다(Q-001 A). 말줄임으로 자르지 않는다(10A)" }
      suffixIcon:
        size: 18px
        color: $color-fg-neutral-subtle
      divider:
        height: 1px
        background: { value: $color-stroke-neutral-subtle, note: "기본은 줄 폭 전체 — 들일 때(inset)는 좌우 24" }
    hovered:
      background:
        background: $color-bg-layer-default-pressed
        insetX: { value: $spacing-x1_5, note: "바탕이 좌우로 6 들어온다(SEED marginX)" }
        radius: { value: $radius-r2_5, note: "카드 안에서는 카드 모서리 − 카드 가장자리에서 바탕까지 거리(동심 모서리) — 목록의 itemRadius 로 바꾼다. 모서리 16 카드에 줄을 바로 넣으면 16 − 6" }
    pressed:
      background:
        background: $color-bg-layer-default-pressed
        insetX: $spacing-x1_5
        radius: $radius-r2_5
      content:
        scale: { value: 2px 거리 축소, note: "콘텐츠 층만 — 기준 길이 max(높이, 폭 ÷ 4, 24) 에서 2px. 줄은 폭 ÷ 4 가 기준이라 세로로는 1px 남짓 준다. 줄 안의 스위치 · 체크 · 라디오는 따로 줄지 않는다(v104)" }
    focused:
      focusRing:
        width: 2px
        offset: { value: -2px, note: "줄 안쪽 — 화면 폭 줄은 바깥 링이 잘린다" }
        color: $color-stroke-focus-ring
    disabled:
      item:
        cursor: not-allowed
      icon:
        color: $color-fg-disabled
      tile:
        background: $color-bg-disabled
        color: $color-fg-disabled
      title:
        foreground: $color-fg-disabled
      detail:
        foreground: $color-fg-disabled
      suffixText:
        foreground: $color-fg-disabled
      suffixIcon:
        color: $color-fg-disabled

  # ── 맞춤 ──────────────────────────────────────────────
  - when: { align: top }
    enabled:
      item: { alignItems: flex-start }

  # ── 강조 ──────────────────────────────────────────────
  - when: { highlight: highlighted }
    enabled:
      background: { background: { value: $color-bg-brand-weak, note: "바탕만 바뀐다 — 점 · 막대는 두지 않는다(사용자 결정, SEED)" } }
    hovered:
      background: { background: $color-bg-brand-weak-pressed }
      detail: { foreground: { value: $color-fg-neutral-muted, note: "짙은 강조 바탕 위에서도 4.5:1 — fg-neutral-subtle 은 4.32:1 로 모자란다(사용자 결정 2026-10-01). 화살표는 그대로" } }
      suffixText: { foreground: $color-fg-neutral-muted }
    pressed:
      background: { background: $color-bg-brand-weak-pressed }
      detail: { foreground: $color-fg-neutral-muted }
      suffixText: { foreground: $color-fg-neutral-muted }

  # ── 하위 줄 ───────────────────────────────────────────
  - when: { nest: parent }
    enabled:
      item:
        paddingLeft: { value: $spacing-x1, note: "줄 앞 4 — 꺾쇠 단추 44 와 그 뒤 4 를 지나 앞 붙이개가 52 에서 시작한다. 하위가 없는 부모 줄도 같은 자리를 비워 부모 타일이 모두 52 에 선다(사용자 결정 17B — 7C 그림의 24 는 고르지 않았다)" }
      expandButton:
        size: { value: 44px, note: "보이는 상자 = 누르는 영역. 하위가 없는 줄 · 늘 펼친 편집 화면(mode fixed — collapsible={false})은 같은 폭의 빈 자리" }
        radius: { value: $radius-r2_5, note: "누를 때 바탕 — 줄의 누름 바탕과 같은 모서리 10" }
        iconSize: { value: 20px, note: "lucide chevron-right — 접혀 있으면 오른쪽, 펼치면 아래(90°)" }
        color: { value: $color-fg-neutral-subtle, note: "흰 면 5.50 · 다크 6.09" }
        rotate: 0deg
        marginRight: { value: $spacing-x1, note: "꺾쇠 단추 ↔ 앞 붙이개 4" }
        background: transparent
        cursor: pointer
        touchTarget: { value: 44 × 44, note: "AA ✓ · AAA ✓ — 지금 웹 18 · 앱 24" }
        name: { value: "{카테고리} 하위 카테고리", note: "고정 이름(레시피 expandLabel — 접는 줄이면 필수, 유니언 타입이라 빠뜨리면 타입 오류 · 하위가 없는 줄에도 준다) + aria-expanded · aria-controls(하위 줄 묶음) — 상태마다 \"접기 · 펼치기\" 로 바꾸지 않는다(사용자 결정 7C · Q-002)" }
        transitionProperty: { value: "rotate, background-color", note: "회전은 하위 줄 펼침과 같은 300ms, 바탕은 150ms(motion)" }
      subList:
        display: { value: 숨김, note: "접혀 있으면 하위 줄을 그리지 않는다 — 처음 상태는 화면이 정한다(카테고리는 모두 펼친 채 연다)" }
    hovered:
      expandButton:
        background: { value: $color-bg-layer-default-pressed, note: "꺾쇠 단추만 — 줄의 누름 바탕과 따로" }
    pressed:
      expandButton:
        background: $color-bg-layer-default-pressed
        scale: { value: 2px 거리 축소, note: "기준 44 → 0.955(v104) — 줄은 줄지 않는다" }
    focused:
      expandButton:
        outlineWidth: 2px
        outlineOffset: { value: -2px, note: "단추 안쪽 — 줄 앞 4 안에서 잘리지 않는다. 모서리는 단추와 같은 10" }
        outlineColor: $color-stroke-focus-ring
  - when: { nest: child }
    enabled:
      item:
        paddingLeft: { value: 104px, note: "부모의 제목 자리 = 4 + 꺾쇠 44 + 4 + 타일 40 + 12 — 하위 타일이 부모 제목 아래에서 시작한다(사용자 결정 17B — 7C 그림의 100 은 고르지 않았다). 누름 바탕은 줄 폭 그대로(좌우 6 들임)" }
  - when: { expanded: expanded }
    enabled:
      expandButton:
        rotate: { value: 90deg, note: "아래로 — 하위 줄이 펼쳐졌다" }
      subList:
        display: 보임

  # ── 늘 펼친 편집 화면(collapsible={false}) ─────────────
  - when: { mode: fixed }
    enabled:
      expandButton:
        display: { value: 빈 자리, note: "꺾쇠 단추를 그리지 않고 같은 폭 44(+ 뒤 4)를 비운다 — 접는 화면과 부모 타일 자리(52)가 같다(17B). 이름 · aria-expanded · aria-controls 없음, 빈 자리는 aria-hidden(2026-10-15 사용자 결정 — 구현 세션 질문 Q-002, 안 B)" }
      subList:
        display: { value: 보임, note: "늘 펼친다 — open · defaultOpen · onOpenChange 를 받지 않는다(타입이 막는다)" }

motion:
  "누름 · 호버 — 바탕":
    duration: $motion-duration-color-transition
    easing: $motion-ease-easing
    properties: [background-color, inset, border-radius]
    note: "바탕이 좌우 6 들어오며 모서리 10 으로 둥글어진다"
  "누름 — 콘텐츠":
    duration: $motion-duration-pressed-scale
    easing: $motion-ease-pressed-scale
    properties: [scale]
    note: "콘텐츠 층만 2px 거리 축소(줄은 세로로 1px 남짓) — 모션 줄이기면 하지 않는다"
  "하위 줄 — 펼침 · 접힘":
