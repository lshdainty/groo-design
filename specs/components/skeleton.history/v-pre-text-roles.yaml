# Skeleton 의 수치 원본 — 구조는 SEED Skeleton(2026-10-03 사용자 결정, 비교 페이지 7 · 9 · 10 · 14).
# 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 불러오는 동안 곧 나타날 내용의 자리를 그리는 회색 면 + 그 위를 지나는 흰 띠(반짝임). 깜빡임(펄스)은 두지 않는다.
# 화면의 틀(머리 · 탭 · 제목 · 버튼 · 카드 면)은 실제로 그리고 서버 데이터 자리만 스켈레톤이다. 흰 면(bg-layer-default ·
# bg-layer-floating) 위에만 둔다 — 페이지 바탕(bg-layer-basement) 위에서는 같은 색이라 1.00:1 로 사라진다.
#
# region 은 기다리는 영역이다 — 스켈레톤 · Progress Circle 을 담는 데이터 자리 하나(쿼리 하나)의 시간표(1초 · 5초 · 10초) ·
# 요청 제한 · 다시 시도. 시간표는 skeleton.md 의 "기다리는 동안" 한 곳에 적고 progress-circle.md · result-section.md 가 가리킨다.
#
# SEED 와 다른 자리(skeleton.md 의 "SEED 와 다른 점")
#   - 면은 porest bg-neutral-weak(gray-200 #F5F6FA · 다크 gray-300 #353B4D) — SEED palette gray-200(#f3f4f5 · #1d2025)의 역할 짝.
#   - 모션 줄이기면 띠가 멈춘다(v104) — SEED 는 계속 돈다.
#   - 스켈레톤은 보조 기술에 숨기고, 영역에 aria-busy + 숨은 상태 글을 둔다 — SEED 는 아무것도 알리지 않는다.
#   - 모서리 기본값은 8(SEED 코드와 같다 — rootage 는 0 을 기본값이라 적었다).
#   - magic(AI) 톤은 두지 않는다(v104 — 그 띠도 들이지 않았다).
#   - 기다리는 영역의 시간표 · 요청 제한 · 다시 시도를 수치로 둔다(SEED Loading 패턴의 시나리오를 규칙으로).
#   - 그림 자리(썸네일 · 카드 그림)는 Image Frame 의 모서리(폭 24 이하 4 · 48 이하 6 · 그 위 8)다 — SEED Skeleton 표의 "카드 및 썸네일 16" 이
#     아니다(2026-10-04 이미지 비교 2A — 다 받은 그림과 같은 모서리). 16 은 카드 면(Card 모양 자리 전체)만이다.

name: Skeleton

slots:
  root: 면 — 곧 나타날 내용 하나의 자리(글 한 줄 · 숫자 · 카드 · 아바타 · 사진)
  shimmer: 반짝임 띠 — 면과 같은 크기, 자기 폭만큼 왼쪽 밖에서 오른쪽 밖으로 지나간다
  region: 기다리는 영역 — 데이터 자리 하나(쿼리 하나). 시간표 · 요청 제한 · 낭독을 맡는다
  slowText: 오래 걸림 글 — 5초부터 "평소보다 오래 걸리고 있어요."

variants:
  radius:
    "0": 화면 폭 사진 — 화면 끝에 붙는 그림(상세 위 사진)
    "4": 폭 24 이하의 그림 자리 — Image Frame 모서리
    "6": 폭 25 ~ 48 의 그림 자리 — 목록 앞 썸네일 40 · 48(Image Frame 모서리)
    "8": 글 · 숫자 · 작은 조각 · 폭 49 이상의 그림 자리(카드 그림 56 · 격자 · 상세) — 기본
    "12": 목록 앞 타일 — List 의 타일 · Logo Tile 40(크기 × 0.3)과 같은 모서리
    "16": 카드 면 — Card 모양 자리 전체. 카드 그림(신용카드 그림)은 그림이라 4 · 6 · 8
    full: 아바타 · 원 아이콘 · 칩

defaults:
  radius: "8"

states:
  enabled: 기다리는 중 — 띠가 지나간다
  reducedMotion: 모션 줄이기 — 띠가 멈추고 면만 남는다

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      root:
        width: { value: 내용의 폭, note: "그 자리에 올 내용의 폭 — 글 줄은 비슷한 글 길이, 여러 줄이면 마지막 줄을 짧게(60 ~ 80%)" }
        height: { value: 내용의 높이, note: "글 · 숫자는 그 글자의 줄 높이 — t2 12 → 16 · t3 13 → 18 · t4 14 → 19 · t5 16 → 22 · t7 20 → 27. 글로 바뀌어도 세로가 움직이지 않는다" }
        background: { value: $color-bg-neutral-weak, note: "흰 면 위 1.08 · 다크 1.30(떠 있는 면 1.13) — 흰 면(bg-layer-default · bg-layer-floating) 위에만 둔다. 페이지 바탕(bg-layer-basement) 위에서는 1.00 으로 사라진다" }
      shimmer:
        width: { value: 100%, note: "면과 같은 크기 — 면 밖은 잘린다(면 모양 그대로)" }
        background: { value: $gradient-shimmer-neutral, dark: $gradient-shimmer-neutral-dark, note: "흰 띠 — 가운데(46 ~ 54%)가 흰 67%(다크 10%), 양 끝은 투명" }
      region:
        showAfter: { value: 1000ms, note: "처음 1초는 틀만 — 데이터 자리는 비워 두고(보이지 않게 그려 높이는 지킨다) 스켈레톤 · 원을 보이지 않는다. 1초 안에 오면 아무것도 깜빡이지 않는다" }
        slowAfter: { value: 5000ms, note: "오래 걸림 글을 더한다 — 스켈레톤 · 원은 그대로. 보조 기술에 한 번 정중하게 읽힌다" }
        timeout: { value: 10000ms, note: "요청 제한 — 처음 요청부터 다시 시도까지 합쳐 10초. 넘으면 끊고 실패(Result Section failure + \"다시 시도\"). 올리기 · 받기는 진행이 10초 멈추면 실패" }
        retry: { value: 2번, note: "읽기(불러오기)만 · 1초 · 2초 뒤 · 10초 안에서만. 다시 해도 같은 오류(4xx — 권한 · 없음 · 잘못된 요청)와 쓰기(저장 · 삭제)는 다시 보내지 않는다" }
      slowText:
        typography: $text-t4
        fontWeight: 400
        foreground: $color-fg-neutral-muted
        gap: { value: $spacing-x4, note: "스켈레톤 영역은 첫 스켈레톤 위 16(왼쪽 맞춤), 가운데 원이면 원 아래 16(가운데 맞춤). 영역 하나에 한 줄 — 단어 단위 줄바꿈(v114)" }
        paddingX: { value: 0px, note: "목록 카드(body list) 바로 아래 영역이면 24 — 목록 카드는 줄마다 24 를 갖고 카드 여백이 없다. 실패 Result Section 도 같다(Card 23B). 내용 카드 안이면 카드의 24 가 맡는다" }
    reducedMotion:
      shimmer:
        opacity: { value: 0, note: "띠를 멈추고 지운다(v104) — 면만 남는다. 흰 면 위 1.08 이라 자리는 옅게 보이고, 상태는 숨은 상태 글이 알린다" }

  # ── 모서리 ────────────────────────────────────────────
  - when: { radius: "0" }
    enabled:
      root:
        radius: { value: 0px, note: "화면 끝에 붙는 사진 — 상세 위 사진. 담는 틀에 모서리가 있으면 그 틀과 같게" }
  - when: { radius: "4" }
    enabled:
      root:
        radius: { value: $radius-r1, note: "Image Frame — 폭 24 이하. 다 받은 그림과 같은 모서리" }
  - when: { radius: "6" }
    enabled:
      root:
        radius: { value: $radius-r1_5, note: "Image Frame — 폭 25 ~ 48(목록 앞 썸네일 40 · 48)" }
  - when: { radius: "8" }
    enabled:
      root:
        radius: { value: $radius-r2, note: "글 · 숫자 · 작은 조각, Image Frame 폭 49 이상" }
  - when: { radius: "12" }
    enabled:
      root:
        radius: { value: $radius-r3, note: "List 타일 · Logo Tile 40 의 모서리와 같다 — 거래 · 카테고리 · 자산 줄의 앞 자리(줄이 통째로 기다릴 때 — 이름을 알면 Logo Tile 은 첫 글자부터 그린다)" }
  - when: { radius: "16" }
    enabled:
      root:
        radius: { value: $radius-r4, note: "카드 면 — Card 모양 자리 전체. 그림 자리(썸네일 · 카드 그림)는 Image Frame 의 4 · 6 · 8" }
  - when: { radius: full }
    enabled:
      root:
        radius: $radius-full

motion:
  "반짝임":
    duration: $motion-duration-loop
    easing: $motion-ease-easing
    properties: [translateX −100% → 100%]
    note: "쉬는 틈 없이 되풀이 — 같은 화면의 스켈레톤은 한 박자로 지난다(늦게 붙은 것도 같은 시계를 따른다). 모션 줄이기면 멈춘다(v104)"
  "내용으로 바뀜":
    duration: $motion-duration-d3
    easing: $motion-ease-enter
    properties: [opacity 0 → 1]
    note: "스켈레톤을 걷고 내용을 투명도로 — Result Section 의 결과로 바뀜과 같다. 자리 크기는 그대로"
