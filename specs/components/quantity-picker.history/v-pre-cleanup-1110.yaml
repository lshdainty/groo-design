# Quantity Picker 의 수치 원본 — 구조는 SEED Quantity Picker(rootage quantity-picker · quantity-picker-button,
# @seed-design/react 2.1.0 · react-headless useQuantityPicker — Apache-2.0). 2026-10-15 사용자 결정, 마무리 비교 페이지
# 1A · 2A · 3A · "따라오는 것".
# 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 작은 정수를 한 단계씩 늘리고 줄이는 컨트롤 — 테두리 상자 안에 줄이기(−) · 선 · 값 · 선 · 늘리기(+)를 한 줄로 둔다.
# 값 칸은 보기만 한다 — 누르지도 치지도 못하고(2A), 누르고 있어도 반복하지 않으며, 화살표 키 · spinbutton 도 없다(SEED).
# 크기는 SEED 의 셋(small 36 · medium 40 · large 52)이고, 웹의 기본은 Input 처럼 responsive(1280 미만 large · 이상 medium)다(1A).
# 끝(최소 · 최대)에 닿은 버튼은 aria-disabled 로 막힌 모습이 되지만 초점은 남는다. 지우기(removable) · 로딩(loading)은 SEED 그대로 둔다(3A).
#
# 축 — size · layout(hug · fill) · edge(값이 범위 안 · 최소 · 최대) · removable(최소에서 − 가 지우기로 바뀌는지).
# 상태(올림 · 누름 · 포커스 · 로딩)는 그 버튼 하나에만 걸린다 — button 부위. 오류 · 막힘은 컨트롤 전체다.
#
# SEED 와 다른 자리(quantity-picker.md 의 "SEED 와 다른 점")
#   - 웹 기본 크기는 responsive(1280 미만 large 52 · 이상 medium 40) — SEED react 의 기본은 small 이다. 표 칸 · 줄 안은 small 36.
#   - 36 · 40 버튼은 누르는 자리를 44 로 넓힌다(보이지 않는 여백 — DESIGN Iconography "아이콘만 있는 버튼"). SEED 는 버튼 크기 그대로다.
#   - 누름 · 호버 바탕은 불투명한 bg-layer-default-pressed — SEED bg.transparent-pressed 의 짝(button.yaml 25-26).
#   - 끝에 닿은 버튼은 aria-disabled 만 — SEED headless 는 disabled 속성도 건다(useQuantityPicker.ts 235 · 250).
#   - 웹 호버(누름과 같은 바탕) · 키보드 포커스 링(v106)을 적는다 — SEED rootage 에는 없다.

name: QuantityPicker

slots:
  root: 테두리 상자 — 줄이기 · 선 · 값 · 선 · 늘리기를 한 줄로 담는다. role="group" + 이름(Field 라벨 · aria-label) 필수
  button: 줄이기 · 늘리기 버튼 공통 — 정사각, 상자 높이와 같다. 올림 · 누름 · 포커스 · 로딩은 그 버튼 하나에만 걸린다
  decrement: 줄이기 버튼(−) — 최소에서 막힘. removable 이면 최소에서 지우기(휴지통) 버튼이 된다
  increment: 늘리기 버튼(+) — 최대에서 막힘
  icon: 버튼 아이콘 — lucide minus · plus · trash-2
  divider: 버튼 ↔ 값 사이 세로 선
  value: 값 칸(Value Display) — 지금 값과 단위("3회"). 보기만 한다 — 누르지도 치지도 못한다
  progressCircle: 로딩 원 — 서버 응답을 기다리는 버튼의 아이콘 자리
  focusRing: 키보드 포커스 링(웹) — 버튼 바깥

variants:
  size:
    small: 36 — 표 칸 · 목록 줄 안(HR 업무 보고 소요시간), 같은 줄의 입력 높이에 맞춘다
    medium: 40 — 1280 이상 데스크톱 웹(마우스) 폼
    large: 52 — 폰 · 앱 폼
    responsive: 폭에 따라 — 1280 미만 large · 이상 medium. 웹 폼의 기본(Input 과 같다), 앱은 늘 large
  layout:
    hug: 내용에 맞춘 폭 — 값 칸은 가장 긴 값의 폭(기본)
    fill: 부모 Flex 의 남은 폭을 채운다 — 늘어나는 것은 값 칸뿐, 두 버튼은 그대로
  edge:
    none: 값이 범위 안 — 두 버튼 모두 누를 수 있다(기본)
    min: 최소에 닿음 — 줄이기가 막힌다
    max: 최대에 닿음 — 늘리기가 막힌다
  removable:
    "off": 지우기 없음 — 최소에서 줄이기는 막힌다(기본)
    "on": 지우기 — 최소에서 줄이기 자리가 지우기 버튼(휴지통)이 된다. 값을 더 줄이는 동작이 곧 항목 지우기인 자리

defaults:
  size: responsive
  layout: hug
  edge: none
  removable: "off"

states:
  enabled: 기본
  hovered: 웹 — 올린 버튼에 누름과 같은 바탕(v106), 축소는 없다
  focused: 키보드 포커스에만 버튼 바깥 링
  pressed: 누른 버튼에 바탕 + 그 버튼만 2px 거리 축소(v104 — SEED scaleScope self)
  loading: 누른 버튼이 서버 응답을 기다린다 — 누름 바탕 위 로딩 원, 그 버튼의 누르기를 막는다(aria-busy)
  invalid: 오류 — 값이 허용 범위를 벗어났다(Field 의 invalid). 상자 테두리 2px 위험 색
  disabled: 막힘 — 전용 색(v106), 불투명도로 흐리게 하지 않는다. 두 버튼 모두 누를 수 없고 초점도 받지 않는다

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      root:
        display: { value: inline-flex, note: "− · 선 · 값 · 선 · + 를 한 줄 가운데 정렬 — 줄을 바꾸지 않는다" }
        background: { value: $color-bg-layer-default, note: "SEED 와 같다 — 시트 · 대화상자(bg-layer-floating) 위에서도 이 색이다(다크 시트 위 상자가 한 단계 어둡다)" }
        borderWidth: { value: 1px, note: "상자 안쪽에 그린다(inset) — 오류의 2px 도 안쪽이라 내용이 밀리지 않는다" }
        borderColor: { value: $color-stroke-neutral-weak, note: "Input 의 테두리와 같다 — 흰 면 1.23 · 다크 1.56, 칸을 알리는 유일한 표시가 아니다(두 버튼 아이콘이 알린다)" }
        role: { value: group, note: "이름 필수 — Field 안이면 라벨이 이름(aria-labelledby), 아니면 aria-label(\"승인 필요 횟수\")" }
      button:
        background: { value: transparent, note: "SEED bg.transparent" }
        cursor: pointer
        transitionProperty: background-color
        transitionDuration: $motion-duration-color-transition
        transitionEasing: $motion-ease-easing
        repeat: { value: 없음, note: "한 번 누르면 한 단계 — 누르고 있어도 반복하지 않는다(사용자 결정 2A, 길게 누르기 2C 는 고르지 않았다)" }
      decrement:
        name: { value: 줄이기, note: "아이콘만 있는 버튼 — 이름 \"줄이기\"(decrementAriaLabel 로 바꿀 수 있다)" }
      increment:
        name: { value: 늘리기, note: "이름 \"늘리기\"(incrementAriaLabel)" }
      icon:
        color: { value: $color-fg-neutral, note: "lucide minus · plus — 흰 면 16.41 · 다크 13.42, 누름 바탕 위 15.48 · 10.32" }
      divider:
        width: 1px
        height: { value: $spacing-x4, note: "SEED x4 16 — 크기와 관계없이 같다" }
        background: { value: $color-stroke-neutral-subtle, note: "장식 — 버튼과 값을 가른다(흰 면 1.15 · 다크 1.30)" }
      value:
        foreground: $color-fg-neutral
        fontWeight: { value: 500, note: "SEED medium" }
        fontVariantNumeric: { value: tabular-nums, note: "숫자 폭이 같아 값이 바뀌어도 글이 흔들리지 않는다" }
        textAlign: center
        paddingX: { value: $spacing-x2, note: "SEED x2 8 — 세 크기 같다" }
        minWidth: { value: 가장 긴 값의 폭, note: "가장 긴 표시 글(getValueText(min) 과 getValueText(max) — \"99회\" · \"24h\")을 숨겨 둔 자리 글로 폭을 잡는다(SEED valueDisplayPlaceholder) — 값이 바뀌어도 상자 폭이 그대로다. max 를 주지 않으면(기본 Number.MAX_SAFE_INTEGER — 열여섯 자리) max 글은 빼고 min 과 지금 값으로 잡는다" }
        pointerEvents: { value: 없음, note: "보기만 — 누르지도 치지도 못한다(SEED \"Value Display는 터치에 반응하지 않습니다\", 사용자 결정 2A). 치는 값 칸(2B)은 고르지 않았다" }
        ariaLive: { value: polite, note: "aria-atomic=true — 바뀐 값(단위 글 그대로 \"4회\")을 한 번 읽는다" }
      progressCircle:
        display: { value: none, note: "로딩일 때만 — 아이콘 자리에" }
        thickness: { value: 2px, note: "SEED quantity-picker-button progressCircle thickness 2" }
        track: { value: $color-gray-500, note: "SEED palette.gray-500 그대로 — Button ghost 의 로딩 원과 같다(button.yaml ghost). 누름 바탕 위 2.98 · 다크 2.08 — 트랙은 장식" }
        range: { value: $color-fg-neutral, note: "누름 바탕 위 15.48 · 다크 10.32 — 트랙과 5.19 · 4.95" }
    hovered:
      button:
        background: { value: $color-bg-layer-default-pressed, note: "웹 — 누름과 같은 바탕(v106). SEED bg.transparent-pressed 의 불투명 짝" }
    focused:
      focusRing:
        width: { value: 2px, note: "키보드로 옮길 때만 — 손가락 · 마우스로 누를 때는 없다" }
        offset: { value: 2px, note: "버튼 바깥 — 상자 테두리 · 선 위에 겹쳐 그린다(잘리지 않게 상자는 overflow 를 자르지 않는다)" }
        color: $color-stroke-focus-ring
    pressed:
      button:
        background: { value: $color-bg-layer-default-pressed, note: "SEED bg.transparent-pressed 의 불투명 짝(button.yaml 25-26)" }
        scale: { value: 2px 거리 축소, note: "누른 버튼만(SEED scaleScope self) — 기준 길이 max(높이, 폭 ÷ 4, 24) 에서 2px(v104). 36 은 34/36" }
        scaleDuration: $motion-duration-pressed-scale
        scaleEasing: $motion-ease-pressed-scale
    loading:
      button:
        background: { value: $color-bg-layer-default-pressed, note: "SEED loading = bg.transparent-pressed" }
        cursor: progress
        press: { value: 막음, note: "기다리는 버튼의 누르기를 버린다 — aria-busy=true. 다른 쪽 버튼은 loading 을 그쪽에 주지 않았으면 그대로 눌린다(loading: { decrement, increment })" }
      icon:
        display: { value: none, note: "아이콘 자리에 로딩 원" }
      progressCircle:
        display: { value: 보임, note: "값 없는 원(도는 원) — 모션 줄이기면 고정된 3/4 호(Progress Circle)" }
    invalid:
      root:
        borderWidth: { value: 2px, note: "안쪽에 덧그린다 — 값이 허용 범위를 벗어났다(SEED Error). 오류 글은 Field 가 칸 아래에" }
        borderColor: { value: $color-stroke-critical-solid, note: "흰 면 5.06 · 다크 6.08" }
    disabled:
      button:
        cursor: { value: not-allowed, note: "두 버튼 모두 disabled 속성 — 초점을 받지 않는다(끝에 닿은 버튼의 aria-disabled 와 다르다)" }
      icon:
        color: { value: $color-fg-disabled, note: "SEED quantity-picker-button disabled" }
      value:
        foreground: { value: $color-fg-disabled, note: "불투명도로 흐리지 않는다(v106)" }

  # ── 크기 ──────────────────────────────────────────────
  - when: { size: small }
    enabled:
      root: { minHeight: { value: 36px, note: "SEED x9 — 최소 높이다. 글자가 커져 값이 상자보다 높아지면 상자가 글을 따라 커지고 숫자를 자르지 않는다(Input · Select 와 같다 — Button 큰 글자 A, 2026-10-29 I-29)" }, radius: $radius-r2 }
      button: { size: { value: 36px, note: "정사각" }, radius: $radius-r2, touchTarget: { value: 44 × 44, note: "보이는 36 둘레로 4 씩 보이지 않는 여백 — 상자 밖으로도 나간다. 표 칸 위아래 여백(16) 안이라 이웃 줄과 겹치지 않는다. AA ✓ · AAA ✓" }, touchExtend: 4px }
      icon: { size: 16px }
      value: { typography: { value: $text-t5, note: "16 / 22 — SEED small t5" } }
      progressCircle: { size: 16px }
  - when: { size: medium }
    enabled:
      root: { minHeight: { value: 40px, note: "SEED x10 — 최소 높이(small 비고)" }, radius: $radius-r2 }
      button: { size: 40px, radius: $radius-r2, touchTarget: { value: 44 × 44, note: "보이는 40 둘레로 2 씩 — DESIGN Iconography \"40px 버튼은 보이지 않는 여백을 2px 씩 더한다\". AA ✓ · AAA ✓" }, touchExtend: 2px }
      icon: { size: 18px }
      value: { typography: { value: $text-t5, note: "16 / 22 — SEED medium t5" } }
      progressCircle: { size: 18px }
  - when: { size: large }
    enabled:
      root: { minHeight: { value: 52px, note: "SEED x13 — 옆 Input · Select large 와 같은 높이. 최소 높이(small 비고)" }, radius: $radius-r3 }
      button: { size: 52px, radius: $radius-r3, touchTarget: { value: 52 × 52, note: "보이는 크기 그대로 — AA ✓ · AAA ✓" }, touchExtend: 0px }
      icon: { size: 22px }
      value: { typography: { value: $text-t6, note: "18 / 24 — SEED large t6" } }
      progressCircle: { size: 22px }
  - when: { size: responsive }
    enabled:
      root:
        breakpoint: { value: 1280px, note: "미만은 large, 이상은 medium 의 값을 쓴다 — Input 과 같은 경계(SEED lg). 앱은 늘 large. 한 폼 안에서 옆 칸과 같은 크기다" }

  # ── 폭 ────────────────────────────────────────────────
  - when: { layout: fill }
    enabled:
      root:
        width: { value: 남은 폭, note: "flex-grow 1 — 부모가 Flex 일 때(SEED layout fill)" }
      value:
        flexGrow: { value: 1, note: "늘어나는 것은 값 칸뿐 — 두 버튼은 정사각 그대로" }

  # ── 끝 ────────────────────────────────────────────────
  - when: { edge: min }
    enabled:
      decrement:
        ariaDisabled: { value: "true", note: "disabled 속성이 아니다 — 초점이 남아 같은 자리에서 + 로 돌아갈 수 있다(따라오는 것). 누르면 아무 일도 없다" }
        cursor: not-allowed
        iconColor: { value: $color-fg-disabled, note: "막힌 모습 — SEED quantity-picker-button disabled 의 아이콘 색" }
    hovered:
      decrement:
        background: { value: transparent, note: "막힌 버튼은 올려도 바탕이 생기지 않는다" }
    pressed:
      decrement:
        background: transparent
        scale: { value: 없음, note: "눌러도 줄지 않는다 — 값도 그대로" }
  - when: { edge: max }
    enabled:
      increment:
        ariaDisabled: { value: "true", note: "최대에서 + 가 막힌다 — 초점은 남는다" }
        cursor: not-allowed
        iconColor: $color-fg-disabled
    hovered:
      increment:
        background: transparent
    pressed:
      increment:
        background: transparent
        scale: 없음

  # ── 지우기 ────────────────────────────────────────────
  - when: { removable: "on", edge: min }
    enabled:
      decrement:
        icon: { value: trash-2, note: "최소에서 − 자리가 지우기 — 누르면 onRemove(항목을 지운다), 값은 바꾸지 않는다" }
        name: { value: removeAriaLabel, note: "이름 필수 — 무엇을 지우는지(\"{항목 이름} 지우기\"). 아이콘이 바뀌면 이름도 바뀐다" }
        ariaDisabled: { value: "false", note: "막히지 않는다 — 누를 수 있다" }
        cursor: pointer
        iconColor: $color-fg-neutral
    hovered:
      decrement:
        background: { value: $color-bg-layer-default-pressed, note: "지우기는 누를 수 있다 — 다른 버튼과 같은 바탕" }
    pressed:
      decrement:
        background: $color-bg-layer-default-pressed
        scale: 2px 거리 축소
    disabled:
      decrement:
        cursor: { value: not-allowed, note: "컨트롤 전체가 막히면 지우기도 막힌다 — 휴지통 아이콘은 그대로 두고 막힘 색" }
        iconColor: $color-fg-disabled

motion:
  "누름 · 올림 — 바탕":
    duration: $motion-duration-color-transition
    easing: $motion-ease-easing
    properties: [background-color]
    note: "SEED colorDuration · colorTimingFunction — 누른 버튼만"
  "누름 — 버튼 축소":
    duration: $motion-duration-pressed-scale
    easing: $motion-ease-pressed-scale
    properties: [scale]
    note: "누른 버튼만 2px 거리 축소(v104) — 모션 줄이기면 하지 않는다"
