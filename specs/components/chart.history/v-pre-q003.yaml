# Chart 의 수치 원본 — 색은 DESIGN.md v110 · v111, 부품은 SEED Layout 의 대시보드 그림(2026-10-08 사용자 결정,
# 데이터 표시 비교 페이지 9A · 10A · 11A · "따라오는 것"). 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# SEED 에는 차트 컴포넌트도 차트 색도 없다. SEED 문서가 가진 것은 Layout 의 High Density 대시보드 그림 한 장(선 그래프 두 계열 ·
# 좌우 이중 축 · 축 글자를 계열 색으로 · 가로 격자만 · 세로 점선 가리킴 · "■ 라벨 값" 툴팁 · 차트 위 지표 타일)과
# Inclusive Design 의 일반 원칙(색만으로 알리지 않기 · 대체 텍스트 · 모션 줄이기)뿐이다. 색 · 배정 순서 · 축 글자 크기 ·
# 범례 · 빈 · 실패 · 접근성은 porest 가 정했다.
#
# 색은 palette 축의 값이다 — 계열마다 한 색을 고르므로 축으로 두면 표가 색마다 한 줄로 그려진다(#palette).
# 라이트는 팔레트 700, 다크는 chart-{색}-dark(800-dark) — v110. 옅은 바탕은 chart-{색}-subtle(v111).
# kind(선 · 막대 · 도넛 · 열지도) · axis(축 하나 · 둘) · legend(계열 켬 · 끔)는 상태와 곱해지므로 축이다.
#
# SEED 와 다른 자리(chart.md 의 "SEED 와 다른 점")
#   - 계열 색은 porest 차트 10색(700 · 800-dark) — SEED 그림의 blue-600 · green-500 은 흰 바탕 2.84 · 2.18 이라 3:1 에 못 미친다.
#   - 이중 축의 눈금 글자는 계열 색 그대로(700 · 800-dark) — SEED 그림은 계열 색을 옅게 썼다(글자 기준 4.5 를 넘게).
#   - 툴팁은 떠 있는 표면(bg-layer-floating · shadow-s3 · 모서리 12) — SEED 그림의 흰 카드 + 그림자를 porest 토큰으로.
#   - 도넛 범례 · 열지도 · 빈 · 실패 · 접근성 규칙은 SEED 에 없다.

name: Chart

slots:
  root: 차트 상자 — 카드 본문 안, 폭 100%. 높이는 쓰는 자리가 정한다
  tickLabel: 눈금 글자 — 가로축(날짜 · 기간) · 세로축(값)
  gridLine: 가로 격자 — 점선, 세로 격자 · 축 선은 두지 않는다
  series: 계열 — 선 · 막대 · 조각 · 칸의 색
  line: 선 — 선 · 영역 차트
  bar: 막대
  point: 가리킨 점 — 가리킨 자리에만
  crosshair: 가리킴 선 — 세로 점선
  tooltip: 툴팁 — 떠 있는 표면
  tooltipHead: 툴팁 머리 — 날짜 · 기간, 옅은 작은 글
  tooltipRow: 툴팁 줄 — "■ 라벨 값"
  swatch: 색 네모 — 툴팁 · 도넛 범례의 계열 표시
  legendTile: 지표 타일 — 선 · 막대 차트 위. 범례 겸 합계, 누르면 계열을 켜고 끈다
  legendList: 도넛 범례 — 카테고리 목록 줄(색 네모 + 이름 + % + 금액)
  donutCenter: 도넛 가운데 — 합계
  heatmapCell: 열지도 칸 — 정사각형, 세기 색
  heatmapValue: 열지도 칸의 금액 — 칸 폭 112 이상에서만, 글자색이 칸 밝기를 따른다
  focusRing: 키보드 포커스 링(웹)

variants:
  kind:
    line: 선 · 영역 — 시간에 따른 흐름(기본)
    bar: 막대 — 견주기 · 기간별 합
    donut: 도넛 — 전체 중 비율
    heatmap: 열지도 — 요일 × 시간 같은 두 축의 세기
  axis:
    single: 세로축 하나 — 눈금 글자 옅은 회색(기본)
    dual: 왼쪽 · 오른쪽 두 축 — 눈금 글자가 그 계열 색
  legend:
    shown: 계열을 그린다 — 타일 바탕 chart-{색}-subtle(기본)
    hidden: 숨긴 계열 — 흰 면 + 1px 테두리
  palette:
    blue: 배정 1번째 — 색을 고르지 않은 첫 항목 · 수입
    green: 배정 2번째
    orange: 배정 3번째
    violet: 배정 4번째
    pink: 배정 5번째
    indigo: 배정 6번째
    red: 배정 7번째 · 지출
    yellow: 배정 8번째
    brown: 배정 9번째
    gray: 기타 전용 — 10개가 넘을 때 상위 9 다음의 "기타"

defaults:
  kind: line
  axis: single
  legend: shown

states:
  enabled: 기본
  hovered: 가리킴 — 마우스 · 터치로 짚은 자리(툴팁 · 점 · 세로선). 타일 · 범례 줄은 누름과 같은 바탕
  pressed: 지표 타일 · 범례 줄 누름 — 바탕 + 2px 거리 축소
  focused: 웹 — 키보드 포커스에만 링

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      root:
        width: 100%
        background: { value: transparent, note: "카드 면이 바탕 — 차트는 카드(card.md) 본문 안에 둔다" }
        height: { value: 쓰는 자리가 정한다, note: "고정 비율(16:9)을 두지 않는다 — 폰은 낮게, 데스크톱은 높게. 오늘 뒤 날짜는 그리지 않는다(가로축이 오늘에서 끝난다)" }
      tickLabel:
        typography: { value: $text-t1, note: "11 / 15 — 돈 축은 \"만\" 단위로 줄인다(400만 · 1.2만, 빼기 U+2212). 축의 폭은 가장 긴 글자(\"−3,000만\")가 잘리지 않게" }
        foreground: $color-fg-neutral-subtle
        numerals: tabular-nums
      gridLine:
        borderWidth: 1px
        borderStyle: { value: dashed, note: "점선 3 · 3 — 가로 격자만. 세로 격자 · 가로축 · 세로축 선은 긋지 않는다" }
        borderColor: $color-stroke-neutral-subtle
      series:
        color: { value: "chart-{색}", note: "palette 축 — 저장된 색이 있는 항목은 그 색, 없으면 아직 쓰지 않은 색부터 배정 순서대로. 회색은 \"기타\" 전용" }
      point:
        size: { value: 10px, note: "가리킨 자리에만 — 계열 색 원 + 카드 면 색 테두리 2. 늘 찍어 두지 않는다" }
      crosshair:
        borderWidth: 1px
        borderStyle: { value: dashed, note: "세로 점선 — 가리킨 날짜 · 기간 위" }
        borderColor: $color-stroke-neutral-weak
      tooltip:
        minWidth: 128px
        paddingY: $spacing-x2_5
        paddingX: $spacing-x3
        radius: $radius-r3
        background: { value: $color-bg-layer-floating, note: "떠 있는 표면 — 테두리 없음" }
        shadow: $shadow-s3
        gap: { value: $spacing-x1, note: "머리 ↔ 줄 · 줄 사이" }
        zIndex: { value: 200, note: "z-floating — specs/z-index.md L3. 차트 상자 안에 그리면 상자 안 겹침(1)" }
      tooltipHead:
        typography: $text-t2
        foreground: $color-fg-neutral-subtle
      tooltipRow:
        typography: $text-t3
        foreground: { value: $color-fg-neutral-muted, note: "라벨 — 값은 fg-neutral · 700 · 고정폭 숫자, 오른쪽 맞춤. 돈은 줄이지 않고 원까지" }
        gap: { value: $spacing-x1_5, note: "네모 ↔ 라벨 · 라벨 ↔ 값은 12 이상" }
      swatch:
        size: { value: 8px, note: "툴팁 — 도넛 범례는 10" }
        radius: { value: 2px, note: "모서리 2 — 네모(■)" }
      legendTile:
        radius: $radius-r3
        paddingY: $spacing-x2_5
        paddingX: $spacing-x3
        gap: { value: $spacing-x2, note: "타일 사이 8 — 차트 위 한 줄, 넘치면 줄바꿈. 타일 ↔ 차트 8" }
        typography: { value: $text-t3, note: "이름 13 — fg-neutral-muted, 앞 점 8(계열 색) · 점 ↔ 이름 6. 아래 2 에 합계 16 / 22 · 700 · fg-neutral · 고정폭 숫자, 돈은 원까지" }
        foreground: $color-fg-neutral-muted
        cursor: pointer
        touchTarget: { value: 타일 전체, note: "높이 62(10 + 이름 18 + 2 + 합계 22 + 10) · 폭 100 이상 — AA ✓ · AAA ✓" }
        transitionProperty: background-color, scale
        transitionDuration: $motion-duration-color-transition
        transitionEasing: $motion-ease-easing
      legendList:
        minHeight: { value: 44px, note: "카테고리 목록 줄 — 색 네모 10 · 이름 14 · % 14 fg-neutral-subtle · 금액 14 · 700 · \"원\". 누르면 하위 카테고리가 있는 줄만 누르는 줄(List)" }
        typography: $text-t4
        gap: $spacing-x2
      donutCenter:
        typography: { value: $text-t5, note: "합계 16 / 22 · 700 — 돈은 줄이지 않는다. 가운데에 들어가지 않으면 가운데 글을 빼고 범례 위 합계로. 위 라벨 12 · fg-neutral-subtle" }
        fontWeight: 700
        foreground: $color-fg-neutral
        numerals: tabular-nums
      heatmapCell:
        aspectRatio: { value: "1 / 1", note: "정사각형 — 폭은 격자가 정한다(시간대 라벨 열 56 + 요일 일곱 칸, 사이 6). 2026-10-08 칸 폭은 1440 → 140 · 1280 → 117 · 1024 → 81 · 768 → 44 · 폰 390 → 35" }
        radius: $radius-r1
        background: { value: "bg-brand-solid 18 · 35 · 55 · 75 · 100%", note: "세기 다섯 — 브랜드 채움을 카드 면에 섞은 지금 제품 단계(가장 큰 칸 값의 8 · 22 · 45 · 75% 에서 끊는다). 값이 없는 칸은 bg-neutral-weak" }
      heatmapValue:
        threshold: { value: 112px, note: "칸 폭 — 이보다 좁으면 칸에 글을 두지 않고 세기 색만 칠한다. 값은 툴팁 · 표로 보기에서 읽는다. 글자를 줄여 맞추지 않는다(지금은 1280 이상만 글이 보인다)" }
        typography: { value: $text-t1, note: "11 / 15 — 금액은 원까지(\"123,456,789원\" 84 · \"99,999,999,999원\" 107 — 999억까지 칸 112 에 들어간다). 값이 없는 칸은 \"—\"(fg-neutral-subtle — 5.09 · 다크 4.68)" }
        fontWeight: 700
        numerals: tabular-nums
        foreground: { value: 단계마다, note: "칸 바탕 위 4.5 를 넘는 쪽 — Desk 라이트 18 · 35 · 55% 는 fg-neutral(5.69 이상) · 75 · 100% 는 static-white(4.62 · 8.38), 다크는 모두 fg-neutral(7.74 이상). HR 은 라이트 18 ~ 75% 가 fg-neutral(5.23 이상) · 100% 만 static-white(5.06), 다크는 모두 fg-neutral(4.69 이상 — HR 100% 단계). 칸마다 재지 않고 단계마다 정해 둔다" }
    hovered:
      legendTile:
        background: { value: $color-bg-layer-default-pressed, note: "끈 타일만 — 켠 타일은 바탕 그대로" }
      legendList:
        background: $color-bg-layer-default-pressed
    pressed:
      legendTile:
        scale: { value: 2px 거리 축소, note: "모션 줄이기면 하지 않는다" }
        scaleDuration: $motion-duration-pressed-scale
        scaleEasing: $motion-ease-pressed-scale
      legendList:
        background: $color-bg-layer-default-pressed
    focused:
      focusRing:
        width: 2px
        offset: { value: 2px, note: "타일 바깥 · 범례 줄은 안쪽(−2) · 차트 상자는 바깥" }
        color: $color-stroke-focus-ring

  # ── 차트 종류 ─────────────────────────────────────────
  - when: { kind: line }
    enabled:
      line:
        strokeWidth: { value: 2px, note: "곡선 monotone · 영역은 같은 색 25% → 0% 세로 그라디언트(겹쳐도 아래 선이 보인다)" }
  - when: { kind: bar }
    enabled:
      bar:
        maxWidth: 28px
        radius: { value: $radius-r1, note: "위 두 모서리만 4 — 음수 막대는 아래 두 모서리" }
        gap: { value: $spacing-x1, note: "한 묶음 안 막대 사이" }
  - when: { kind: donut }
    enabled:
      series:
        thickness: { value: 22px, note: "지름 160 기준 — 폰 120 은 18. 조각 사이 0" }
  - when: { kind: heatmap }
    enabled:
      heatmapCell:
        gap: { value: $spacing-x1_5, note: "칸 사이 6 — 가로 · 세로 같다. 왼쪽 시간대 라벨 열 56(이름 13 · 700 + 시간 11 · fg-neutral-subtle), 위 요일 머리 12 · fg-neutral-subtle" }

  # ── 축 ────────────────────────────────────────────────
  - when: { axis: dual }
    enabled:
      tickLabel:
        foreground: { value: "chart-{계열 색}", note: "왼쪽 축은 왼쪽 계열(수입 blue), 오른쪽 축은 오른쪽 계열(지출 red)의 색 — 700 · 800-dark 라 글자 기준 4.5 를 넘는다. 가로축은 fg-neutral-subtle 그대로" }

  # ── 범례 타일 ─────────────────────────────────────────
  - when: { legend: shown }
    enabled:
      legendTile:
        background: { value: "chart-{색}-subtle", note: "그 계열 색의 넓은 면 옅은 바탕(v111) — 테두리 없음. aria-pressed=\"true\"" }
  - when: { legend: hidden }
    enabled:
      legendTile:
        background: { value: $color-bg-layer-default, note: "흰 면 + 안쪽 1px stroke-neutral-weak — 계열이 숨었다. aria-pressed=\"false\"" }
        borderWidth: 1px
        borderColor: $color-stroke-neutral-weak

  # ── 색(v110) ──────────────────────────────────────────
  - when: { palette: blue }
    enabled:
      series:
        color: $color-chart-blue
  - when: { palette: green }
    enabled:
      series:
        color: $color-chart-green
  - when: { palette: orange }
    enabled:
      series:
        color: $color-chart-orange
  - when: { palette: violet }
    enabled:
      series:
        color: $color-chart-violet
  - when: { palette: pink }
    enabled:
      series:
        color: $color-chart-pink
  - when: { palette: indigo }
    enabled:
      series:
        color: $color-chart-indigo
  - when: { palette: red }
    enabled:
      series:
        color: $color-chart-red
  - when: { palette: yellow }
    enabled:
      series:
        color: $color-chart-yellow
  - when: { palette: brown }
    enabled:
      series:
        color: $color-chart-brown
  - when: { palette: gray }
    enabled:
      series:
        color: { value: $color-chart-gray, note: "\"기타\" 전용 — 색이 없는 항목에 주지 않는다" }

motion:
  "타일 · 범례 줄":
    duration: $motion-duration-color-transition
    easing: $motion-ease-easing
    properties: [background-color]
  "타일 누름":
    duration: $motion-duration-pressed-scale
    easing: $motion-ease-pressed-scale
    properties: [scale]
    note: "모션 줄이기면 하지 않는다"
  "그려짐":
    duration: $motion-duration-d6
    easing: $motion-ease-enter
    properties: [막대 높이, 선 길이, 조각 각도]
    note: "처음 그릴 때 한 번 — 모션 줄이기면 바로 그린다(라이브러리 기본 \"auto\" — 강제로 켜지 않는다)"
