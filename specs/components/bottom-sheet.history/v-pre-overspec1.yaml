# Bottom Sheet 의 수치 원본 — 구조는 SEED Bottom Sheet(2026-10-02 사용자 결정, 비교 페이지 1 · 2 · 3 · 4 · 5).
# 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 화면 아래에서 올라오는 모달. 1280 미만에서 폼 · 상세 · 고르기를 띄운다 — 같은 내용을 1280 이상에서는 Dialog 로
# 띄운다(Responsive Dialog — dialog.md). 되돌릴 수 없는 확인은 Alert Dialog, 동작 목록은 Menu Sheet(그 차례에)다.
# 열고 닫는 동작(입력 폼은 바깥 · 끌기로 닫지 않는다 · 끌어 닫는 기준)은 bottom-sheet.md 의 Behavior 에 있다.
#
# SEED 와 다른 자리(bottom-sheet.md 의 "SEED 와 다른 점")
#   - 좌우 여백: SEED 16(global-gutter) → groo 화면 여백 spacing-global-gutter 24. 닫기 버튼도 오른쪽 24.
#   - 딤: SEED bg.overlay 0.455 → groo overlay-dim 0.50 · 다크 0.65(v102).
#   - 바닥 버튼: Button large 48(SEED 예제 medium 40 — groo 모바일 바닥 CTA 규칙).
#   - 손잡이 누름 색: SEED palette.gray-500 의 짝이 groo 역할 색에 없어(groo gray-500 은 fg-disabled) 두지 않는다.
#   - z-index: specs/z-index.md 의 L2(딤 z-modal 100 · 시트 z-modal-content 101).
#
# 본문 끝 흐림은 축 scrollFog 다 — 넘칠 수 있는 본문(목록 · 긴 폼)에 걸고, 걸면 늘 켜져 있다(Scroll Fog — scroll-fog.yaml 의
# overlayBody, 2026-10-03). SEED Bottom Sheet 의 권장(위 20 · 아래 80)과 같고, 1280 이상의 Dialog 와도 같다.

name: BottomSheet

slots:
  overlay: 딤 — 시트 뒤 화면 전체
  root: 시트 — 위 두 모서리만 둥글다. 넓은 화면에서는 가운데에 선다
  handle: 손잡이 — 스냅 높이를 둘 때만
  closeButton: 닫기 — 원, 오른쪽 위. 이름 "닫기"
  header: 머리 — 제목 · 설명
  title: 제목 — 시트를 쓰면 늘 있다
  description: 설명 — 덧붙일 말이 있을 때만
  body: 본문 — 넘치면 이 안에서 스크롤
  fog: 끝 흐림 — Scroll Fog(scroll-fog.yaml 의 overlayBody). 넘칠 수 있는 본문에만 걸고, 걸면 늘 켜져 있다
  footer: 바닥 — 버튼
  focusRing: 키보드 포커스 링(웹)

variants:
  handle:
    hidden: 기본 — 손잡이 없음
    shown: 스냅 높이(절반 · 가득)를 둘 때 — 반드시 보인다
  scrollFog:
    "off": 기본 — 늘 들어맞는 본문(칸 두셋 · 짧은 고르기)
    "on": 넘칠 수 있는 본문(목록 · 긴 폼 · 데이터에 따라 길어지는 내용) — 위 20 · 아래 80 이 늘 흐리다

defaults:
  handle: hidden
  scrollFog: "off"

states:
  enabled: 열림
  pressed: 닫기 버튼 누름 — 원 바탕 + 2px 거리 축소
  focused: 웹 — 키보드 포커스에만 링

rules:
  - when: {}
    enabled:
      overlay:
        background: { value: $overlay-dim-light, dark: $overlay-dim-dark, note: "groo 딤(v102 — SEED 0.455 는 들이지 않았다)" }
        zIndex: { value: 100, note: "z-modal — specs/z-index.md L2. 시트는 z-modal-content 101" }
      root:
        maxWidth: { value: 480px, note: "그보다 좁은 화면은 화면 폭 전체, 넓으면 가운데" }
        maxHeight: { value: 화면 높이의 90%, note: "넘을 내용은 시트가 아니라 페이지로 둔다(SEED) — 시트 안 스크롤로 버티지 않는다" }
        radius: { value: $radius-r6, note: "위 두 모서리만" }
        background: $color-bg-layer-floating
        shadow: { value: none, note: "그림자 없이 딤과 표면 색으로 뜬다(SEED · Elevation)" }
        paddingBottom: { value: 안전 영역, note: "바닥 버튼 아래 safe-area-inset-bottom 만큼" }
        zIndex: { value: 101, note: "z-modal-content — specs/z-index.md L2" }
      closeButton:
        size: { value: 28px, note: "원 — 누르는 영역은 사방 8 넓혀 44 × 44" }
        radius: $radius-full
        background: $color-bg-neutral-weak
        iconSize: { value: 14px, note: "lucide x" }
        color: $color-fg-neutral
        top: { value: $spacing-x6, note: "시트 위에서 24 — 제목 첫 줄 가운데와 맞는다" }
        right: { value: $spacing-global-gutter, note: "SEED 16 → 화면 여백 24" }
        touchTarget: 44 × 44
        transitionProperty: background-color, scale
        transitionDuration: $motion-duration-color-transition
        transitionEasing: $motion-ease-easing
      header:
        paddingTop: $spacing-x6
        paddingBottom: $spacing-x4
        paddingX: { value: $spacing-global-gutter, note: "닫기 버튼이 있으면 제목 오른쪽 64(24 + 원 28 + 12)" }
        gap: { value: $spacing-x2, note: "제목 ↔ 설명" }
      title:
        typography: $text-t8
        fontWeight: 700
        foreground: $color-fg-neutral
      description:
        typography: $text-t5
        fontWeight: 400
        foreground: $color-fg-neutral-muted
      body:
        paddingX: $spacing-global-gutter
        paddingBottom: { value: $spacing-x4, note: "바닥이 없을 때만 — 그 아래 안전 영역. 바닥이 있으면 0" }
      footer:
        paddingTop: $spacing-x3
        paddingX: $spacing-global-gutter
        paddingBottom: { value: $spacing-x4, note: "그 아래 안전 영역" }
        gap: { value: $spacing-x2, note: "버튼 둘이면 반씩 나눈다" }
        buttonSize: { value: large 48, note: "Button large — 하나면 폭 전체" }
    pressed:
      closeButton:
        background: $color-bg-neutral-weak-pressed
        scale: { value: 2px 거리 축소, note: "기준 28 → 0.929(SEED scaleScope: self · v104) — 모션 줄이기면 하지 않는다" }
    focused:
      focusRing:
        width: 2px
        offset: 2px
        color: $color-stroke-focus-ring

  - when: { handle: shown }
    enabled:
      handle:
        width: 36px
        height: 4px
        radius: $radius-full
        background: { value: $color-stroke-neutral-weak, note: "SEED palette.gray-400 의 짝(groo gray-400). 누름 색은 두지 않는다" }
        top: { value: $spacing-x1_5, note: "시트 위에서 6, 가로 가운데" }
        touchTarget: { value: 44 × 44, note: "누르면 다음(더 높은) 스냅 높이로 — 가장 높은 높이에서 누르면 닫힌다(SEED). 보조 기술에는 숨긴다" }

  # ── 본문 끝 흐림(Scroll Fog) ──────────────────────────
  - when: { scrollFog: "on" }
    enabled:
      fog:
        mask: { value: $gradient-fade-mask, note: "Scroll Fog overlayBody(scroll-fog.yaml) — 늘 켜져 있다. 넘쳤는지 재서 켜고 끄지 않는다" }
        size: { value: 위 20px · 아래 80px, note: "본문 상자의 위 · 아래 끝(SEED Bottom Sheet 의 권장)" }
      body:
        paddingTop: { value: 20px, note: "머리 아래 16 은 그대로 두고 본문 안에 더한다" }
        paddingBottom: { value: 80px, note: "바닥이 있어도 — 끝까지 내려도 마지막 줄이 흐림 아래 남지 않는다. 바닥이 없으면 그 아래 안전 영역" }
        scrollPadding: { value: 위 20px · 아래 80px, note: "키보드로 옮긴 칸이 흐림 아래 멈추지 않게" }

motion:
  "열림 — 시트":
    duration: $motion-duration-d6
    easing: $motion-ease-enter-expressive
    properties: [translateY 100% → 0]
    note: "모션 줄이기면 150ms 서서히 나타남(v104)"
  "열림 — 딤":
    duration: $motion-duration-d6
    easing: $motion-ease-enter
    properties: [opacity 0 → 1]
  "닫힘 — 시트":
    duration: $motion-duration-d4
    easing: $motion-ease-exit
    properties: [translateY → 100%]
    note: "끌다 놓아 되돌아갈 때도 같은 시간 · 곡선"
  "닫힘 — 딤":
    duration: $motion-duration-d4
    easing: $motion-ease-exit
    properties: [opacity → 0]
  "누름 — 닫기 버튼":
    duration: $motion-duration-pressed-scale
    easing: $motion-ease-pressed-scale
    properties: [scale]
