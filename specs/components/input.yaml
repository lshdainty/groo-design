# Input(Text Input) 의 수치 원본 — 구조는 SEED Text Input(2026-10-01 사용자 결정).
# 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 한 줄 입력칸이다. 라벨 · 설명 · 오류 · 글자 수는 Field(field.yaml)가 둘레에서 그린다.
# 부위: root 는 상자(테두리 · 바탕 · 모서리 — 앞 · 뒤 붙이개와 지우기 버튼을 담는다), value 는 입력(<input>)이다.
# 테두리는 상자 안쪽에 1px 로 그리고, 포커스 · 오류의 2px 는 안쪽에 덧그린다(SEED ::after) — 굵어져도 내용이 밀리지 않는다.
# 포커스는 마우스 · 터치로 눌러도 보인다 — 캐럿과 함께 지금 쓰는 칸을 알린다(버튼의 "키보드에만 링" 과 다르다).
#
# 크기는 SEED 와 같다 — large 52(폰 · 앱) · medium 40(1280 이상 데스크톱 웹, 마우스). 웹의 기본은 responsive
# (1280 미만 large · 이상 medium — SEED lg), 앱은 늘 large. 한 폼 안에서 크기를 섞지 않는다.
# underline 은 화면에 입력이 하나뿐일 때(금액을 먼저 받는 화면 · 목록 위 검색 · 초대 코드 · 잠금 해제).
#
# SEED 와 다른 자리(input.md 의 "SEED 와 다른 점")
#   - 지우기 버튼을 Text Input 에도 둔다(SEED 는 Input Button 에만) — 값은 SEED Input Button 의 지우기(22 · 18)를 따르고, 누르는 영역은
#     44 다(기초 Inclusive Design v106 — 2026-10-08 앱 적용이 남긴 것).
#   - 아이콘은 lucide 선 아이콘(기초 Iconography v106) — 지우기는 circle-x, SEED 는 채운 원.
#   - 상자를 누르면(붙이개 · 여백 포함) 입력으로 포커스가 간다.

name: Input

slots:
  root: 상자(Container) — 테두리 · 바탕 · 모서리. 어디를 눌러도 입력으로 포커스가 간다
  value: 입력(<input>) — 상자 높이를 채운다. 맨 앞 · 맨 뒤면 상자의 좌우 여백까지 차지한다
  placeholder: 빈 칸의 예시 글 — 칸 이름 대신 쓰지 않는다
  prefixIcon: 앞 아이콘 — 검색 돋보기처럼 칸의 뜻을 돕는다
  prefixText: 앞 글자 — https:// · 만 · − 같은 고정 글
  suffixText: 뒤 글자 — 단위(원 · % · 일 · 회 · cm)
  suffixIcon: 뒤 아이콘
  clearButton: 지우기 버튼 — 값이 있고 막히지 않았을 때만. 검색칸 · 선택 사항인 칸에 둔다. 누르는 영역 44

variants:
  variant:
    outline: 상자 — 기본
    underline: 밑줄 — 화면에 입력이 하나뿐일 때(금액을 먼저 받는 화면 · 목록 위 검색 · 초대 코드 · 잠금 해제)
  size:
    large: 52(밑줄 40) — 폰 · 앱
    medium: 40(밑줄 34) — 1280 이상 데스크톱 웹(마우스)에서만
    responsive: 폭에 따라 — 1280 미만 large · 이상 medium. 웹의 기본

defaults:
  variant: outline
  size: responsive

states:
  enabled: 기본
  focused: 칸에 포커스 — 마우스 · 터치로 눌러도
  invalid: 오류 — Field 의 invalid(aria-invalid). 포커스해도 그대로
  disabled: 비활성 — 값을 바꿀 수 없고 포커스도 받지 않는다
  readonly: 읽기 전용 — 포커스 · 복사는 되고 값은 못 바꾼다

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      root:
        background: transparent
        borderColor: $color-stroke-neutral-weak
        cursor: text
        transitionProperty: { value: border-color, note: "덧그린 2px 의 색만 — 두께는 바로 바뀐다(SEED)" }
        transitionDuration: { value: $motion-duration-d2, note: "SEED 는 0.1s 를 바로 적었다" }
        transitionEasing: $motion-ease-easing
      value:
        foreground: $color-fg-neutral
        fontWeight: 400
        caretColor: { value: $color-fg-neutral, note: "캐럿은 글자색 — 고른 글은 기기 기본 하이라이트(::selection 을 두지 않는다). SEED 도 정하지 않았다. 앱은 cursorColor 를 이 색으로(사용자 결정 2026-10-08)" }
      placeholder:
        foreground: $color-fg-placeholder
        fontWeight: 400
      prefixIcon:
        color: $color-fg-neutral-muted
      prefixText:
        foreground: $color-fg-neutral-subtle
        fontWeight: 400
      suffixText:
        foreground: $color-fg-neutral-subtle
        fontWeight: 400
      suffixIcon:
        color: $color-fg-neutral-muted
      clearButton:
        color: { value: $color-fg-neutral-subtle, note: "lucide circle-x. 이름 \"지우기\" — 누르면 값을 비우고 입력에 포커스를 둔다" }
        radius: $radius-full
        touchTarget: { value: 44 × 44, note: "보이는 원(22 · 18)과 따로 둘레로 넓힌다 — 상자 밖은 상자가 자른다(medium 40 은 44 × 40). 기초 Inclusive Design v106(사용자 결정 2026-10-08)" }
    focused:
      root:
        borderColor: { value: $color-stroke-neutral-contrast, note: "읽기 전용이면 바뀌지 않는다 — 읽기 전용은 포커스 표시가 없다(SEED 와 같다, 사용자 결정 2026-10-08 — 까닭 · 2.4.7 은 input.md)" }
    invalid:
      root:
        borderColor: { value: $color-stroke-critical-solid, note: "포커스해도 그대로" }
    disabled:
      root:
        cursor: not-allowed
      value:
        foreground: $color-fg-disabled
      placeholder:
        foreground: $color-fg-disabled
      prefixIcon:
        color: $color-fg-disabled
      prefixText:
        foreground: $color-fg-disabled
      suffixText:
        foreground: $color-fg-disabled
      suffixIcon:
        color: $color-fg-disabled

  # ── 모양 ──────────────────────────────────────────────
  - when: { variant: outline }
    enabled:
      root:
        borderWidth: { value: 1px, note: "상자 안쪽에 그린다(inset)" }
    focused:
      root:
        borderWidth: { value: 2px, note: "안쪽에 덧그린다 — 내용이 밀리지 않는다" }
    invalid:
      root:
        borderWidth: 2px
    disabled:
      root:
        background: { value: $color-bg-disabled, note: "흐리게 하지 않는다(v106)" }
    readonly:
      root:
        background: { value: $color-bg-disabled, note: "값은 진한 글자 그대로 — 바탕만으로 편집 칸과 가른다" }

  - when: { variant: underline }
    enabled:
      root:
        borderBottomWidth: { value: 1px, note: "아래만 — 모서리 · 좌우 여백 없음" }
        radius: 0
        paddingX: 0
    focused:
      root:
        borderBottomWidth: 2px
    invalid:
      root:
        borderBottomWidth: 2px
    readonly:
      value:
        foreground: { value: $color-fg-neutral-muted, note: "바탕이 없어 글자로 가른다" }
      placeholder:
        foreground: $color-fg-neutral-muted

  # ── 모양 × 크기 ───────────────────────────────────────
  - when: { variant: outline, size: large }
    enabled:
      root: { minHeight: 52px, radius: $radius-r3, paddingX: $spacing-x4, gap: $spacing-x2_5 }
      value: { typography: $text-t5 }
      placeholder: { typography: $text-t5 }
      prefixIcon: { size: 20px }
      prefixText: { typography: $text-t5 }
      suffixText: { typography: $text-t5 }
      suffixIcon: { size: 20px }
      clearButton: { size: 22px }
  - when: { variant: outline, size: medium }
    enabled:
      root: { minHeight: 40px, radius: $radius-r2, paddingX: $spacing-x3_5, gap: $spacing-x2 }
      value: { typography: $text-t4 }
      placeholder: { typography: $text-t4 }
      prefixIcon: { size: 16px }
      prefixText: { typography: $text-t4 }
      suffixText: { typography: $text-t4 }
      suffixIcon: { size: 16px }
      clearButton: { size: 18px }
  - when: { variant: underline, size: large }
    enabled:
      root: { minHeight: 40px, paddingY: $spacing-x2, gap: $spacing-x2_5 }
      value: { typography: $text-t6 }
      placeholder: { typography: $text-t6 }
      prefixIcon: { size: 24px }
      prefixText: { typography: $text-t6 }
      suffixText: { typography: $text-t6 }
      suffixIcon: { size: 24px }
      clearButton: { size: 22px }
  - when: { variant: underline, size: medium }
    enabled:
      root: { minHeight: 34px, paddingY: $spacing-x1_5, gap: $spacing-x2 }
      value: { typography: $text-t5 }
      placeholder: { typography: $text-t5 }
      prefixIcon: { size: 20px }
      prefixText: { typography: $text-t5 }
      suffixText: { typography: $text-t5 }
      suffixIcon: { size: 20px }
      clearButton: { size: 18px }

  # ── 반응형 ────────────────────────────────────────────
  - when: { size: responsive }
    enabled:
      root:
        breakpoint: { value: 1280px, note: "미만은 large, 이상은 medium 의 값을 쓴다(SEED lg) — 앱은 늘 large" }

motion:
  "포커스 · 오류 — 테두리":
    duration: $motion-duration-d2
    easing: $motion-ease-easing
    properties: [border-color]
    note: "안쪽에 덧그린 2px 의 색이 나타나고 사라진다. SEED 는 0.1s — groo d2 = 100ms"
