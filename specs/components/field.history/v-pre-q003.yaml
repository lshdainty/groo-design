# Field 의 수치 원본 — 구조는 SEED Field(머리 · 입력 · 꼬리, 2026-10-01 사용자 결정).
# 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# Field 는 입력 하나를 감싸는 둘레다 — 머리(라벨 · 필수 점 또는 "선택" · 보조 액션), 입력(Text Input · Textarea ·
# Input Button · Select · Checkbox · Radio · Select Box 묶음), 꼬리(설명 또는 오류 · 글자 수). 사이 8.
# 옛 Label · Form 스펙은 여기로 합쳤다(label.history · form.history 의 v-retired-to-field).
#
# 크기 축이 없다 — 라벨 · 설명 · 오류는 입력칸 크기(large · medium)와 관계없이 같다(SEED).
# 필수 점 · "선택" 의 크기 · 여백은 rem 이라 글자 크기 설정을 따라 커진다(SEED — 라벨과 어울리게).
# 오류(invalid)는 꼬리의 글 · 글자 수 색만 바꾼다 — 라벨은 그대로다. 칸의 테두리는 입력칸이 바꾼다(input.yaml).
#
# SEED 와 다른 자리(field.md 의 "SEED 와 다른 점")
#   - 머리의 보조 액션은 Button(ghost · neutralSubtle · xsmall · 오른쪽 flush) — 머리 높이(22)를 바꾸지 않게 위아래로 5 씩 넘친다(SEED bleedY 와 같은 일).
#   - 폼 안 Field 사이 24 · 두 칸을 나란히 둘 때 16 을 정했다(form) — SEED 는 2열 사이 16 만 글로 적었다.
#   - 오류 글을 화면 읽기 프로그램에 알리는 자리(polite)를 Field 가 둔다.

name: Field

slots:
  root: Field — 머리 · 입력 · 꼬리를 세로로 쌓는다
  header: 머리 — 라벨 + 필수 · 선택 표시(왼쪽), 보조 액션(오른쪽)
  label: 라벨 — 칸 이름. 명사형 · 마침표 없이, 한 줄(길어도 두 줄)
  requiredIndicator: 필수 점 — 한 화면 칸의 2/3 미만이 필수일 때 필수 칸에만
  optionalIndicator: "\"선택\" 글자 — 2/3 이상이 필수일 때 선택 칸에만(둘을 섞지 않는다)"
  headerAction: 보조 액션 — 라벨 오른쪽의 작은 텍스트 버튼(예시 보기 · 전체 선택)
  footer: 꼬리 — 설명 또는 오류(왼쪽) · 글자 수(오른쪽)
  description: 설명 — 칸을 채우는 데 필요한 안내
  descriptionIcon: 설명 앞 아이콘 — 없어도 된다
  errorMessage: 오류 — 설명 자리를 대신한다(둘을 함께 보이지 않는다)
  errorIcon: 오류 앞 아이콘 — 늘 붙는다(색만으로 알리지 않게)
  characterCount: 글자 수 — 지금 쓴 수
  maxCharacterCount: 글자 수 — 최대("/12")
  form: 폼 — Field 를 쌓는 자리(화면 · 시트 · 대화상자의 본문)

variants:
  labelWeight:
    medium: 500 — 기본
    bold: 700 — 칸 이름이 그 구역의 제목 노릇을 할 때(칸 하나를 크게 받는 단계 화면). 한 폼 안에서 섞지 않는다

defaults:
  labelWeight: medium

states:
  enabled: 기본
  invalid: 오류 — 오류 글이 설명을 대신하고, 글자 수도 빨개진다

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      root:
        direction: column
        gap: { value: $spacing-x2, note: "머리 ↔ 입력 ↔ 꼬리" }
      header:
        paddingX: $spacing-x0_5
        gap: { value: $spacing-x2_5, note: "라벨 ↔ 보조 액션" }
        alignItems: center
      label:
        typography: $text-t5
        foreground: $color-fg-neutral
      requiredIndicator:
        size: { value: 0.375rem, note: "6px — 동그란 점. 글자 크기를 따라 커진다. 점은 화면 읽기 프로그램에 숨기고 필수는 칸의 aria-required 가 알린다" }
        color: $color-fg-critical
        marginTop: { value: 0.25rem, note: "4px — 라벨 첫 줄 위쪽에 붙는다" }
        marginLeft: { value: 0.125rem, note: "2px — 라벨 끝 바로 뒤" }
      optionalIndicator:
        typography: { value: $text-t4, note: "글은 \"선택\" 으로 정해져 있다" }
        lineHeight: { value: 22px, note: "라벨(t5)과 같은 줄 높이 — 한 줄에 맞는다" }
        foreground: $color-fg-neutral-subtle
        paddingLeft: { value: 0.25rem, note: "4px" }
      headerAction:
        marginY: { value: -5px, note: "Button ghost · neutralSubtle · xsmall(32) · 오른쪽 flush — 머리 높이 22 를 바꾸지 않게 위아래로 넘친다. 누르는 영역은 버튼 그대로(44)" }
      footer:
        paddingX: $spacing-x0_5
        gap: { value: $spacing-x2, note: "설명 · 오류 ↔ 글자 수" }
        alignItems: flex-start
      description:
        typography: $text-t4
        foreground: $color-fg-neutral-subtle
      descriptionIcon:
        size: 16px
        color: $color-fg-neutral-subtle
        gap: { value: $spacing-x1_5, note: "아이콘 ↔ 글. 아이콘은 첫 줄 가운데(위 1.5)" }
      errorMessage:
        typography: $text-t4
        foreground: $color-fg-critical
      errorIcon:
        size: { value: 16px, note: "lucide circle-alert" }
        color: $color-fg-critical
        gap: { value: $spacing-x1_5, note: "아이콘 ↔ 글. 아이콘은 첫 줄 가운데(위 1.5)" }
      characterCount:
        typography: { value: $text-t4, note: "숫자 폭 고정(tabular-nums)" }
        foreground: { value: $color-fg-neutral, note: "값이 비면 fg-neutral-subtle — 최대와 같은 색" }
      maxCharacterCount:
        typography: $text-t4
        foreground: $color-fg-neutral-subtle
      form:
        gapY: { value: $spacing-x6, note: "Field ↔ Field" }
        gapX: { value: $spacing-x4, note: "두 칸을 나란히 둘 때 — 라벨과 값이 짧을 때만(SEED). 형식이 정해진 값(전화번호 · 주민등록번호)은 나누지 않는다" }
        columns: { value: 1 ~ 2, note: "768 미만은 1열" }
    invalid:
      characterCount:
        foreground: $color-fg-critical
      maxCharacterCount:
        foreground: $color-fg-critical

  # ── 라벨 굵기 ─────────────────────────────────────────
  - when: { labelWeight: medium }
    enabled:
      label:
        fontWeight: 500
  - when: { labelWeight: bold }
    enabled:
      label:
        fontWeight: 700
