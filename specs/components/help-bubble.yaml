# Help Bubble · Tooltip 의 수치 원본입니다. 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md 를 따릅니다.
#
# 트리거 옆에 뜨는 짙은 말풍선 하나를 두 가지로 엽니다.
#   press  Help Bubble — 눌러서 엽니다. 제목 + 설명, 닫기 버튼을 둘 수 있습니다. 터치에서 도움말이 필요하면 이쪽입니다.
#   hover  Tooltip — 마우스를 올리거나 키보드 초점이 오면 엽니다. 짧은 설명 한 줄, 닫기 버튼 · 누를 것이 없습니다.
#          터치에서는 열리지 않으므로 이름(aria-label) · 막힌 이유를 툴팁에만 두지 않습니다(tooltip.md).
# 쓰는 규칙은 help-bubble.md(눌러서) · tooltip.md(마우스 · 키보드)에 있습니다.
#
# 화면 끝의 트리거에서는 화살표가 트리거 가운데에 남고 말풍선이 가장자리 16 보다 붙습니다.
# z-index 는 specs/z-index.md 의 L4(z-tooltip 210) — 팝오버 · 메뉴(L3) 위입니다.

name: HelpBubble

slots:
  root: 말풍선 — 짙은 바탕, 트리거 쪽에 화살표
  arrow: 화살표 — 늘 트리거 가운데를 가리킨다(화면 끝에서도 — 말풍선이 민다)
  title: 제목 — 툴팁은 이것 하나
  description: 설명 — Help Bubble 에서 제목을 풀어 줄 때만
  closeButton: 닫기 — Help Bubble 에서만, 오른쪽 위 모서리. 이름 "닫기"
  focusRing: 키보드 포커스 링(웹)

variants:
  opens:
    press: Help Bubble — 트리거를 누르면 열고 닫는다(처음부터 열어 둘 수도 있다)
    hover: Tooltip — 마우스를 올리면 200ms 뒤, 키보드 초점이 오면 바로 연다. 터치로는 열지 않는다
  closeButton:
    hidden: 닫기 버튼 없음 — 트리거 · 바깥을 누르면 닫힌다
    shown: 닫기 버튼 — Help Bubble 에서만. 닫기 전까지 남겨 둘 안내

defaults:
  opens: press
  closeButton: hidden

states:
  enabled: 열림
  pressed: 닫기 버튼 누름 — 2px 거리 축소(바탕 없음)
  focused: 웹 — 키보드 포커스에만 링(닫기 버튼 안쪽)

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      root:
        maxWidth: { value: 280px, note: "여백을 포함한 폭 — 한 줄 20자 안팎, 2 ~ 3줄이면 넘지 않는다. 쓸 수 있는 폭(화면 − 양쪽 16)이 더 좁으면 그만큼" }
        maxHeight: { value: 남은 높이, note: "고른 쪽(위 · 아래)에서 가장자리 16 을 뺀 높이까지 — 큰 글자로 넘치면 글만 말풍선 안에서 스크롤한다. 가장자리는 안전 영역 경계부터 잰다" }
        paddingY: $spacing-x2_5
        paddingX: $spacing-x3
        radius: $radius-r3
        background: { value: $color-bg-neutral-inverted, note: "다크에서는 밝은 말풍선" }
        shadow: none
        offset: { value: $spacing-x1, note: "화살표 끝 ↔ 트리거 4(말풍선 몸통과는 12)" }
        margin: { value: $spacing-x4, note: "화면 가장자리와 16 — 모자라면 반대편으로 뒤집고 옆으로 민다. 화살표를 트리거 가운데 · 모서리 14 에 두느라 모자라면 이 값이 진다 — 하한 없이 화면 끝(0)까지" }
        marginMin: { value: 0px, note: "트리거가 화면 끝에 붙었을 때 — 상단 바 끝 6 의 아이콘 버튼 44 면 8, 화면 끝 0 의 ⓘ 40 이면 0. 누르는 자리가 40 이상이면 말풍선이 화면 밖으로 나가지 않는다" }
        announce: { value: "제목 · 설명", note: "열릴 때 한 번, 초점을 옮기지 않고 — 웹 aria-live polite · 앱 Semantics liveRegion. 처음부터 열린 안내도" }
        zIndex: { value: 210, note: "z-tooltip — specs/z-index.md L4" }
      arrow:
        width: 12px
        height: { value: 8px, note: "끝 모서리 2 — 말풍선과 같은 색. 트리거와 4 는 이 상자의 끝에서 잰다 — 둥근 끝 때문에 그림 끝은 1 더 떨어져 보인다" }
        margin: { value: 14px, note: "말풍선 모서리에서 최소 14 — 화살표는 트리거 가운데에서 움직이지 않고 말풍선을 민다(화살표 가운데 ↔ 말풍선 끝 20). 이 값이 화면 가장자리 16 보다 먼저다" }
        position: { value: 트리거 가운데, note: "비켜 그리지 않고 지우지 않는다 — 웹 Radix 의 숨김(cannotCenterArrow)을 쓰지 않는다" }
      title:
        typography: { value: $text-t3, note: "단어 단위 줄바꿈 · 줄바꿈 문자는 그대로" }
        fontWeight: 700
        foreground: $color-fg-neutral-inverted
      description:
        typography: $text-t3
        fontWeight: 400
        foreground: $color-fg-neutral-inverted
        gap: { value: $spacing-x0_5, note: "제목 ↔ 설명" }
    focused:
      focusRing:
        width: 2px
        offset: { value: -2px, note: "닫기 버튼 안쪽" }
        color: { value: $color-fg-neutral-inverted, note: "말풍선 글자색 — 브랜드 링(stroke-focus-ring)은 짙은 말풍선 위에서 Desk 1.96 · HR 2.01 로 3:1 에 못 미친다" }
        rootOffset: { value: 2px, note: "닫기 버튼이 없는 말풍선에 Tab 으로 들어오면 말풍선 둘레 바깥 2(모서리를 따라)" }
        rootColor: { value: $color-stroke-focus-ring, note: "페이지 위에 그려지므로 브랜드 링" }

  # ── 여는 방식 ──────────────────────────────────────────
  - when: { opens: hover }
    enabled:
      root:
        openDelay: { value: 200ms, note: "마우스 — 키보드 초점은 바로(0). 하나가 열린 뒤 옆 트리거로 옮기면 바로 · 모션 없이" }
        closeDelay: { value: 100ms, note: "트리거와 말풍선을 모두 벗어난 뒤 — 말풍선 위로 옮겨도 닫히지 않는다(WCAG 1.4.13)" }
        skipDelay: { value: 300ms, note: "하나가 닫힌 뒤 이 시간 안에 옆 트리거로 옮기면 기다리지 않고 모션 없이 바로 연다" }

  # ── 닫기 버튼 ──────────────────────────────────────────
  - when: { opens: press, closeButton: shown }
    enabled:
      closeButton:
        size: { value: 38px, note: "투명 상자 — 말풍선 오른쪽 위 모서리에 붙는다(위 0 · 오른쪽 0). 글과 이 상자 사이 4. 글자가 커져도 크기를 그대로 두고 제목 첫 줄 가운데에 선다" }
        touchTarget: { value: 44 × 44, note: "사방 3 넓힌다" }
        iconSize: { value: 14px, note: "lucide x — 위 12 · 오른쪽 12 자리" }
        radius: { value: $radius-r3, note: "바탕이 없어 초점 링에만 보인다" }
        color: $color-fg-neutral-inverted
    pressed:
      closeButton:
        scale: { value: 2px 거리 축소, note: "바탕 없이 아이콘만 — 모션 줄이기면 하지 않는다" }
        scaleDuration: $motion-duration-pressed-scale
        scaleEasing: $motion-ease-pressed-scale

motion:
  "열림":
    duration: $motion-duration-d4
    easing: $motion-ease-enter
    properties: [scale 0.9 → 1, opacity 0 → 1]
    note: "화살표 끝을 기준점으로 커진다 — 툴팁이 이어서 열리면 모션 없이 바로"
  "닫힘":
    duration: $motion-duration-d4
    easing: $motion-ease-easing
    properties: [opacity → 0]
    note: "크기는 그대로, 투명도만"
