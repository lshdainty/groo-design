# Dialog 의 수치 원본 — 구조는 SEED Dialog · Responsive Dialog(2026-10-02 사용자 결정, 비교 페이지 1 · 2 · 4 · 5 · 7).
# 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 1280 이상의 가운데 대화상자. 폼 · 상세는 한 부품(Responsive Dialog)이 1280 미만에서 Bottom Sheet(bottom-sheet.yaml)로,
# 이상에서 이 Dialog 로 같은 머리 · 본문 · 바닥을 띄운다. 되돌릴 수 없는 확인은 Alert Dialog(alert-dialog.yaml)다.
# 닫는 길(입력 폼은 바깥 누르기로 닫지 않는다 · 닫기 버튼과 취소는 하나만)은 dialog.md 의 Behavior 에 있다.
#
# 상태 scrolled 는 본문 스크롤의 상태다 — 위로 스크롤되면 머리 아래 선. 끝 흐림은 상태가 아니라 축 scrollFog 다 — 넘칠 수 있는
# 본문(목록 · 긴 폼)에 걸고, 걸면 넘쳤는지와 상관없이 늘 켜져 있다(Scroll Fog — scroll-fog.yaml 의 overlayBody, 2026-10-03).
#
# 머리 오른쪽 동작 자리는 축 headerAction 이다(2026-10-25 I-20) — 시트(bottom-sheet.yaml 의 같은 축)와 같은 규칙이고, 자리 값만 대화상자의
# 닫기(52 상자 · 아이콘 22)에 맞췄다. 값은 구현한 웹 ds DialogContent.headerAction 에서 옮겼다.
#
# SEED 와 다른 자리(dialog.md 의 "SEED 와 다른 점")
#   - 바뀌는 폭: SEED md(768) → groo 1280(Input Button 과 같은 경계 — 사용자 결정 2026-10-02).
#   - 바닥 버튼: SEED 예제 medium 40 → Button small 36(Button 결정 — "40 은 대화상자에 비해 굵다", 2026-10-02 다시 확인).
#   - 딤: SEED bg.overlay 0.455 → groo overlay-dim 0.50 · 다크 0.65(v102).
#   - 반투명 색을 불투명 짝으로(v102): 머리 아래 선 stroke-neutral-subtle, 닫기 버튼 누름 bg-layer-floating-pressed.
#   - z-index: specs/z-index.md 의 L2(딤 z-modal 100 · 대화상자 z-modal-content 101).
#   - 본문 끝 흐림: SEED Dialog 의 넘칠 때만 아래 48 → groo Scroll Fog(늘 켜진 위 20 · 아래 80, 넘칠 수 있는 본문에만 — 2026-10-03).

name: Dialog

slots:
  overlay: 딤 — 대화상자 뒤 화면 전체
  root: 대화상자 — 화면 정중앙
  closeButton: 닫기 — 조회 · 안내 대화상자만. 입력 폼에는 두지 않는다(바닥 취소). 이름 "닫기"
  headerAction: 머리 오른쪽 동작 — 닫기 왼쪽(닫기가 없으면 오른쪽 끝)의 ⋮ 하나(축 headerAction). 이름 "{항목 이름} 더보기"
  header: 머리 — 제목 · 설명(· 닫기)
  title: 제목
  description: 설명 — 덧붙일 말이 있을 때만
  divider: 머리 아래 선 — 본문이 위로 스크롤됐을 때만
  body: 본문 — 넘치면 이 안에서만 스크롤(머리 · 바닥은 고정)
  fog: 끝 흐림 — Scroll Fog(scroll-fog.yaml 의 overlayBody). 넘칠 수 있는 본문에만 걸고, 걸면 늘 켜져 있다
  footer: 바닥 — 버튼, 오른쪽 정렬
  focusRing: 키보드 포커스 링(웹)

variants:
  size:
    medium: 480 — 기본. 일반 입력 폼 · 상세
    large: 800 — 복잡한 설정 · 많은 조회
  headerAction:
    hidden: 기본
    shown: 들어간 상세에서 동작이 여럿일 때 — 머리 ⋮ 하나가 Menu 를 연다. 머리 동작은 하나만 둔다
  scrollFog:
    "off": 기본 — 늘 들어맞는 본문(칸 두셋 · 짧은 안내)
    "on": 넘칠 수 있는 본문(목록 · 긴 폼 · 데이터에 따라 길어지는 내용) — 위 20 · 아래 80 이 늘 흐리다

defaults:
  size: medium
  headerAction: hidden
  scrollFog: "off"

states:
  enabled: 열림
  scrolled: 본문이 위로 스크롤됨 — 머리 아래 선
  pressed: 닫기 버튼 누름
  focused: 웹 — 키보드 포커스에만 링

rules:
  - when: {}
    enabled:
      overlay:
        background: { value: $overlay-dim-light, dark: $overlay-dim-dark, note: "groo 딤(v102)" }
        zIndex: { value: 100, note: "z-modal — specs/z-index.md L2" }
      root:
        maxWidth: { value: 화면 폭 − 40, note: "좌우 20 은 남긴다" }
        maxHeight: { value: 화면 높이의 80%, note: "dvh 우선 — 넘치면 본문만 스크롤" }
        radius: $radius-r5
        background: $color-bg-layer-floating
        shadow: { value: none, note: "그림자 없이 딤과 표면 색으로 뜬다(SEED · Elevation)" }
        zIndex: { value: 101, note: "z-modal-content — specs/z-index.md L2" }
      header:
        paddingTop: $spacing-x6
        paddingX: $spacing-x6
        paddingBottom: $spacing-x4
        gap: { value: $spacing-x1_5, note: "제목 ↔ 설명. 닫기 버튼이 있으면 오른쪽 52(24 + 아이콘 22 + 6)" }
      title:
        typography: $text-t8
        fontWeight: 700
        foreground: $color-fg-neutral
      description:
        typography: $text-t5
        fontWeight: 400
        foreground: $color-fg-neutral-muted
      closeButton:
        size: { value: 52px, note: "투명 상자 — 보이는 건 아이콘 22" }
        radius: $radius-r3
        iconSize: { value: 22px, note: "lucide x" }
        color: $color-fg-neutral-subtle
        top: { value: 28px, note: "아이콘이 대화상자 위에서 28 · 오른쪽 24 — 제목 첫 줄 가운데와 맞는다" }
        right: $spacing-x6
        touchTarget: 52 × 52
        transitionProperty: background-color, scale
        transitionDuration: $motion-duration-color-transition
        transitionEasing: $motion-ease-easing
      body:
        paddingX: $spacing-x6
        paddingTop: { value: $spacing-x6, note: "머리가 없을 때만 — 머리가 있으면 0" }
        paddingBottom: { value: $spacing-x6, note: "바닥이 없을 때만 — 바닥이 있으면 0" }
        overflowY: auto
      divider:
        height: 1px
        background: { value: $color-stroke-neutral-subtle, note: "안쪽 그림자로 그린다 — 본문이 첫 자식이면(머리가 없으면) 그리지 않는다" }
        transitionDuration: $motion-duration-color-transition
        transitionEasing: $motion-ease-easing
      footer:
        paddingTop: $spacing-x4
        paddingX: $spacing-x6
        paddingBottom: $spacing-x6
        gap: $spacing-x2
        justifyContent: { value: flex-end, note: "오른쪽 정렬 — [취소] [저장]" }
        buttonSize: { value: small 36, note: "Button small(Button 결정)" }
    scrolled:
      divider:
        opacity: { value: 1, note: "본문을 위로 스크롤하면 나타난다" }
    pressed:
      closeButton:
        background: { value: $color-bg-layer-floating-pressed, note: "SEED bg.transparent-pressed 의 떠 있는 표면 짝(v102)" }
        scale: { value: 2px 거리 축소, note: "기준 52 → 0.962 — 모션 줄이기면 하지 않는다" }
    focused:
      focusRing:
        width: 2px
        offset: 2px
        color: $color-stroke-focus-ring

  - when: { size: medium }
    enabled:
      root:
        width: 480px
  - when: { size: large }
    enabled:
      root:
        width: 800px

  # ── 머리 오른쪽 동작(⋮ 하나) ─────────────────────────
  - when: { headerAction: shown }
    enabled:
      headerAction:
        button: { value: Button ghost iconOnly small, note: "보이는 36 · 아이콘 16 — 누르는 영역 44 × 44" }
        size: 36px
        gap: { value: $spacing-x1, note: "닫기 아이콘 왼쪽 끝 ↔ 동작 단추 4. 닫기가 없는 입력 폼은 오른쪽 끝 — 단추 상자가 대화상자 오른쪽에서 16" }
        centerY: { value: 제목 첫 줄 가운데, note: "대화상자 위 24 + 줄 높이 30 의 절반 = 39 — 닫기 아이콘 가운데와 같다" }
        touchTarget: 44 × 44
        name: { value: "{항목 이름} 더보기", note: "아이콘만 있는 단추 — 항목 이름을 앞에 둔다" }
        focusOrder: { value: 제목 → 동작 → 닫기, note: "DOM 차례 그대로 — ← 가 있으면 ← → 제목 → 동작 → 닫기" }
      header:
        paddingRight: { value: 100px, note: "닫기 자리 52 + 사이 4 + 단추 36 + 8 — 제목 · 설명은 남은 폭에서 줄을 바꾼다. 닫기가 없는 입력 폼은 60(오른쪽 16 + 단추 36 + 8)" }

  # ── 본문 끝 흐림(Scroll Fog) ──────────────────────────
  - when: { scrollFog: "on" }
    enabled:
      fog:
        mask: { value: $gradient-fade-mask, note: "Scroll Fog overlayBody(scroll-fog.yaml) — 늘 켜져 있다. 넘쳤는지 재서 켜고 끄지 않는다" }
        size: { value: 위 20px · 아래 80px, note: "본문 상자의 위 · 아래 끝" }
      body:
        paddingTop: { value: 20px, note: "머리가 있으면 20(머리 아래 16 은 그대로 두고 본문 안에 더한다), 머리가 없으면 24 그대로 — 흐림 깊이 이상" }
        paddingBottom: { value: 80px, note: "바닥이 있어도 — 끝까지 내려도 마지막 줄이 흐림 아래 남지 않는다" }
        scrollPadding: { value: 위 20px · 아래 80px, note: "키보드로 옮긴 칸이 흐림 아래 멈추지 않게" }

motion:
  "열림 — 대화상자":
    duration: $motion-duration-d4
    easing: $motion-ease-enter-expressive
    properties: [scale 1.3 → 1, opacity 0 → 1]
    note: "크게 나타나며 줄어든다(SEED) — 모션 줄이기면 150ms 서서히 나타남"
  "열림 — 딤":
    duration: $motion-duration-d2
    easing: $motion-ease-enter
    properties: [opacity 0 → 1]
  "닫힘 — 대화상자":
    duration: $motion-duration-d2
    easing: $motion-ease-exit
    properties: [opacity → 0]
    note: "축소 없이 사라진다"
  "닫힘 — 딤":
    duration: $motion-duration-d2
    easing: $motion-ease-exit
    properties: [opacity → 0]
  "머리 아래 선":
    duration: $motion-duration-color-transition
    easing: $motion-ease-easing
    properties: [box-shadow]
  "누름 — 닫기 버튼":
    duration: $motion-duration-pressed-scale
    easing: $motion-ease-pressed-scale
    properties: [scale]
