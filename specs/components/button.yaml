# Button 의 수치 원본 — 구조는 SEED Action Button(2026-09-30 사용자 결정).
#
# button.md 의 수치 표 자리에는 이 파일을 가리키는 줄(`[표: …](button.yaml#…)`)만 있고,
# 사이트는 빌드 때 이 파일로 표를 그린다(site/scripts/spec-tables.mjs). 수치를 고치려면 여기를 고친다.
# 다른 컴포넌트의 YAML 도 이 형식을 따른다.
#
# 값
#   `$이름`        DESIGN.md 토큰 — CSS 변수 이름에서 `--` 를 뗀 것(`$spacing-x4` = `--spacing-x4`).
#   `$이름 / 12%`  그 색을 12% 불투명도로.
#   그 밖          단위를 붙여 그대로(`9px`, `0.98`, `none`, `min(90%, 420px)`).
#   { value, dark, note }  다크 모드 값이 따로 있거나 비고를 붙일 때. dark 가 없으면 토큰의
#                  `-dark` 짝을 쓰고, 짝도 없으면 라이트 값 그대로다.
# 축 · 상태
#   목록([a, b]) 또는 설명을 단 맵({ a: 설명, b: 설명 }). 설명은 표의 '설명' 칸에 나온다.
#   enabled 가 바탕이다. 다른 상태에는 enabled 에서 바뀌는 값만 적는다.
# 규칙
#   when 에 적은 변형이 모두 맞는 조합에 적용된다. when 이 비면 모든 조합.
#   뒤에 나온 규칙이 앞의 같은 값을 덮는다.
# 표 구역(md 의 `#…`)
#   base · slots · <축> · grid.<축>[.<축>.<값>…] · states.<축> · matrix[.<축>.<값>…] · compound · motion
#   — 설명은 site/scripts/spec-tables.mjs 의 renderSection.
#
# SEED 와 다른 자리(button.md 의 "SEED 와 다른 점")
#   - large 는 48(SEED 52) — 사용자 결정. 여백 · 글자 · 아이콘은 SEED large 그대로.
#   - 테두리 · 투명 누름은 SEED 가 투명도 있는 색(stroke.neutral-muted · bg.transparent-pressed)이라
#     불투명한 가장 가까운 역할(stroke-neutral-weak · bg-layer-default-pressed)을 쓴다 — 8자리 hex 를 lint 가 거부한다.
#   - hovered(웹) · focused(웹 · 앱의 키보드 포커스) 상태를 더한다(v106 · 앱은 2026-10-08).
#   - 누름은 누른 동작이 끝날 때까지 한 번이다(root.press) — SEED 는 정하지 않았다.

name: Button

slots:
  root: 버튼 상자(Container) — 배경 · 테두리 · 모양, 글자 · 아이콘 색(currentColor)
  label: 글자(Label)
  prefixIcon: 앞 아이콘(Prefix Icon) — 동작의 뜻을 돕는다
  suffixIcon: 뒤 아이콘(Suffix Icon) — chevron 처럼 동작을 돕는다
  icon: 아이콘만 있는 버튼의 아이콘
  progressCircle: 로딩 원
  focusRing: 키보드 포커스 링(웹 · 앱 — 키보드로 옮길 때만)

variants:
  variant:
    brandSolid: 브랜드 색 채움 — 서비스 핵심 액션 하나(Desk 거래 추가 · HR 휴가 신청)
    neutralSolid: 짙은 회색 채움 — 대부분의 CTA(저장 · 확인 · 다음)
    neutralWeak: 옅은 회색 채움 — CTA 를 뺀 대부분의 액션, CTA 옆 보조(취소)
    criticalSolid: 빨강 채움 — 되돌릴 수 없는 작업의 확정(주로 Alert Dialog)
    brandOutline: 테두리 + 브랜드 글자 — Solid 보다 낮은 위계, Neutral Outline 과 짝
    neutralOutline: 테두리 + 본문 글자 — 가장 낮은 위계의 보조 액션
    ghost: 배경 없음 — 메뉴 · 툴바 · 목록의 가벼운 액션, 글자색을 바꿀 수 있다(ghostColor)
  size:
    xsmall: 32 — 좁은 자리, 알약 모양
    small: 36 — 화면 안 범용, 모달 footer
    medium: 40 — 화면 안 범용, 아이콘만 있는 버튼의 기본
    large: 48 — CTA(모바일 하단 · 모바일 모달 footer)
  layout:
    withText: 글자 — 앞 또는 뒤 아이콘 하나까지(둘 다는 쓰지 않는다)
    iconOnly: 아이콘만 — 정사각, 이름(aria-label) 필수
  ghostColor:
    neutral: 본문 글자(기본)
    neutralSubtle: 흐린 글자 — 가장자리 텍스트 버튼(flush)
    brand: 브랜드 글자 — 강조하는 가벼운 액션(옛 accent · link)
    critical: 위험 글자 — 확인 창을 여는 삭제(옛 dangerSoft)

# 크기는 이름이 아니라 높이로 고른다. 기본 조합은 medium · neutralSolid · withText.
defaults:
  variant: neutralSolid
  size: medium
  layout: withText
  ghostColor: neutral

states:
  enabled: 기본
  hovered: 웹 — 누름 색과 같다(v106), 축소는 없다
  focused: 키보드 포커스에만 링 — 웹 · 앱(앱은 2026-10-08 부터, 손가락으로 누를 때는 없다)
  pressed: 누름 색 + 세로 2px 거리 축소(v104)
  loading: 누름 색 위 로딩 원, 라벨 자리 그대로 · 누름을 자동으로 막는다
  disabled: 전용 색(v106) — 불투명도로 흐리게 하지 않는다

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      root:
        cursor: pointer
        touchTarget: { value: 44 × 44, note: "보이는 크기와 따로 — 누르는 영역을 가로 · 세로 44 까지 넓힌다(v106). AA ✓ · AAA ✓" }
        transitionProperty: background-color, color
        transitionDuration: $motion-duration-color-transition
        transitionEasing: $motion-ease-easing
        press: { value: 누른 동작이 끝날 때까지 한 번, note: "onClick 이 Promise 를 돌려주면 이행 · 거부될 때까지 다음 누름(포인터 · Enter · Space)을 버린다 — 시간 창은 없다. 비동기 동작은 Promise 를 돌려준다(mutateAsync). 돌려주지 않으면 잠그지 않는다. 앱은 Future 가 끝날 때까지. 사용자 결정 2026-10-08" }
      label:
        fontFamily: $font-sans
        fontWeight: 700
    pressed:
      root:
        scale: { value: 세로 2px 축소, note: "기준 길이 max(높이, 폭 ÷ 4, 24) 에서 2px — Feedback 의 눌림 피드백(v104)" }
        scaleDuration: $motion-duration-pressed-scale
        scaleEasing: $motion-ease-pressed-scale
    focused:
      focusRing:
        width: { value: 2px, note: "웹 · 앱 같다 — 앱은 키보드로 옮길 때만 그린다(Flutter FocusHighlightMode.traditional), 손가락으로 누를 때는 없다. 앱 버튼도 포커스를 받아 Tab 순서에 든다(사용자 결정 2026-10-08)" }
        offset: 2px
        color: $color-stroke-focus-ring
    loading:
      root:
        cursor: progress
        press: { value: 막음, note: "누르기(포인터 · Enter · Space)를 삼켜 두 번 제출을 막는다 — 축소도 없다. aria-busy=true. SEED 는 막지 않는다" }
      label: { color: { value: transparent, note: "글자 · 아이콘을 투명하게 해 폭을 그대로 둔다" } }
    disabled:
      root:
        cursor: { value: not-allowed, note: "포인터 이벤트는 켜 둔다 — 끄면 이 커서가 안 보인다(SEED 와 같다)" }
        background: $color-bg-disabled
        foreground: $color-fg-disabled

  # ── 변형별 색 ─────────────────────────────────────────
  - when: { variant: brandSolid }
    enabled:
      root: { background: $color-bg-brand-solid, foreground: $color-static-white }
      progressCircle: { track: $color-static-white / 30%, range: $color-static-white }
    hovered:
      root: { background: $color-bg-brand-solid-pressed }
    pressed:
      root: { background: $color-bg-brand-solid-pressed }
    loading:
      root: { background: $color-bg-brand-solid-pressed }

  - when: { variant: neutralSolid }
    enabled:
      root: { background: $color-bg-neutral-inverted, foreground: $color-fg-neutral-inverted }
      progressCircle: { track: $color-fg-neutral-inverted / 30%, range: $color-fg-neutral-inverted }
    hovered:
      root: { background: $color-bg-neutral-inverted-pressed }
    pressed:
      root: { background: $color-bg-neutral-inverted-pressed }
    loading:
      root: { background: $color-bg-neutral-inverted-pressed }

  - when: { variant: neutralWeak }
    enabled:
      root: { background: $color-bg-neutral-weak, foreground: $color-fg-neutral }
      progressCircle: { track: $color-gray-500, range: $color-fg-neutral }
    hovered:
      root: { background: $color-bg-neutral-weak-pressed }
    pressed:
      root: { background: $color-bg-neutral-weak-pressed }
    loading:
      root: { background: $color-bg-neutral-weak-pressed }

  - when: { variant: criticalSolid }
    enabled:
      root: { background: $color-bg-critical-solid, foreground: $color-static-white }
      progressCircle: { track: $color-static-white / 30%, range: $color-static-white }
    hovered:
      root: { background: $color-bg-critical-solid-pressed }
    pressed:
      root: { background: $color-bg-critical-solid-pressed }
    loading:
      root: { background: $color-bg-critical-solid-pressed }

  - when: { variant: brandOutline }
    enabled:
      root: { background: transparent, foreground: $color-fg-brand, borderColor: { value: $color-stroke-neutral-weak, note: "SEED stroke.neutral-muted(투명도 있는 검정)의 불투명 짝" }, borderWidth: 1px }
      progressCircle: { track: $color-bg-brand-weak-pressed, range: { value: $color-stroke-brand-solid, note: "Progress Circle brand 톤과 같다 — 다크는 밝은 짝(바탕 위 라이트 Desk 8.38 · HR 5.06, 다크 Desk 6.10 · HR 6.23 — 트랙과 Desk 6.59 · 4.73). 2026-10-08 까지 bg-brand-solid 라 다크 바탕 위 1.73 이었다(채움 색은 다크에서도 짙다)" } }
    hovered:
      root: { background: $color-bg-layer-default-pressed }
    pressed:
      root: { background: { value: $color-bg-layer-default-pressed, note: "SEED bg.transparent-pressed 의 불투명 짝" } }
    disabled:
      root: { background: transparent, borderColor: $color-stroke-neutral-weak }

  - when: { variant: neutralOutline }
    enabled:
      root: { background: transparent, foreground: $color-fg-neutral, borderColor: $color-stroke-neutral-weak, borderWidth: 1px }
      progressCircle: { track: $color-gray-500, range: $color-fg-neutral }
    hovered:
      root: { background: $color-bg-layer-default-pressed }
    pressed:
      root: { background: $color-bg-layer-default-pressed }
    disabled:
      root: { background: transparent, borderColor: $color-stroke-neutral-weak }

  - when: { variant: ghost }
    enabled:
      root: { background: transparent, foreground: $color-fg-neutral }
      progressCircle: { track: $color-gray-500, range: $color-fg-neutral }
    hovered:
      root: { background: $color-bg-layer-default-pressed }
    pressed:
      root: { background: $color-bg-layer-default-pressed }
    loading:
      root: { background: $color-bg-layer-default-pressed }
    disabled:
      root: { background: transparent }

  # ghost 의 글자색(SEED ghost 의 color) — 배경 · 누름은 ghost 그대로
  - when: { variant: ghost, ghostColor: neutralSubtle }
    enabled:
      root: { foreground: $color-fg-neutral-subtle }
  - when: { variant: ghost, ghostColor: brand }
    enabled:
      root: { foreground: $color-fg-brand }
  - when: { variant: ghost, ghostColor: critical }
    enabled:
      root: { foreground: $color-fg-critical }

  # ── 크기 ──────────────────────────────────────────────
  - when: { size: xsmall }
    enabled:
      root: { height: 32px, radius: $radius-full }
      progressCircle: { size: 14px, thickness: 2px }
  - when: { size: small }
    enabled:
      root: { height: 36px, radius: $radius-r2 }
      progressCircle: { size: 14px, thickness: 2px }
  - when: { size: medium }
    enabled:
      root: { height: 40px, radius: $radius-r2 }
      progressCircle: { size: 16px, thickness: 2px }
  - when: { size: large }
    enabled:
      root: { height: { value: 48px, note: "SEED 52 — groo 는 48(사용자 결정)" }, radius: $radius-r3 }
      progressCircle: { size: 18px, thickness: 2px }

  # 크기 × 배치 — 여백 · 간격 · 글자 · 아이콘
  - when: { size: xsmall, layout: withText }
    enabled:
      root: { paddingX: $spacing-x3_5, paddingY: $spacing-x1_5, gap: $spacing-x1 }
      label: { typography: $text-t3 }
      prefixIcon: { size: 14px }
      suffixIcon: { size: 14px }
  - when: { size: xsmall, layout: iconOnly }
    enabled:
      root: { width: 32px, padding: $spacing-x1_5 }
      icon: { size: 14px }
  - when: { size: small, layout: withText }
    enabled:
      root: { paddingX: $spacing-x3_5, paddingY: $spacing-x2, gap: $spacing-x1 }
      label: { typography: $text-t4 }
      prefixIcon: { size: 14px }
      suffixIcon: { size: 14px }
  - when: { size: small, layout: iconOnly }
    enabled:
      root: { width: 36px, padding: $spacing-x2 }
      icon: { size: 16px }
  - when: { size: medium, layout: withText }
    enabled:
      root: { paddingX: $spacing-x4, paddingY: $spacing-x2_5, gap: $spacing-x1_5 }
      label: { typography: $text-t4 }
      prefixIcon: { size: 16px }
      suffixIcon: { size: 16px }
  - when: { size: medium, layout: iconOnly }
    enabled:
      root: { width: 40px, padding: $spacing-x2_5 }
      icon: { size: 18px }
  - when: { size: large, layout: withText }
    enabled:
      root: { paddingX: $spacing-x5, paddingY: { value: $spacing-x3, note: "(48 − 줄 높이 24) ÷ 2 — SEED 52 는 14" }, gap: $spacing-x2 }
      label: { typography: $text-t6 }
      prefixIcon: { size: 22px }
      suffixIcon: { size: 22px }
  - when: { size: large, layout: iconOnly }
    enabled:
      root: { width: 48px, padding: $spacing-x3 }
      icon: { size: 22px }
