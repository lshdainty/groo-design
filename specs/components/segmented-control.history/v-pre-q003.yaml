# Segmented Control 의 수치 원본 — 구조는 SEED Segmented Control(2026-10-02 사용자 결정). 문서는 segmented-control.md.
# 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 같은 내용을 2 ~ 4가지로 바로 거르거나 · 정렬하거나 · 다르게 보는 컨트롤 — 그 내용 바로 위에, 한 화면에 하나.
# 다른 구역으로 옮기면 Tabs, 폼 값은 Chip · Select, 조건을 여럿 걸고 풀면 Chip 필터 바다.
#
# 고름(selected)은 누름 · 비활성과 곱해지므로 상태가 아니라 축이다(specs/CLAUDE.md).
# 고른 칸의 알약(indicator)은 트랙에 하나 있고 고른 칸으로 미끄러진다.
#
# SEED 와 다른 자리(segmented-control.md 의 "SEED 와 다른 점")
#   - 칸 폭: SEED 는 칸 최소 86 · 좌우 24 라 4개(352)가 폰에 들어가지 않는다 → 칸이 트랙 폭을 똑같이 나누고
#     최소 폭이 없다 · 좌우 12(비교 페이지 5 — B, 사용자 결정 2026-10-02). 높이 · 글 · 알약은 SEED 그대로.
#   - 반투명 색을 불투명 짝으로(v102): 트랙 bg-neutral-weak, 테두리 stroke-neutral-weak.
#     고른 알약 SEED palette.gray-00(라이트 흰 · 다크 검정) → bg-layer-default(다크도 트랙보다 어둡다).
#   - 고른 알약의 테두리는 짙은 stroke-neutral-contrast — SEED 의 옅은 1px 은 트랙과 1.14:1 이라 고른 칸이 3:1 에 못 미친다
#     (사용자 결정 2026-10-02). 고른 채 막히면 stroke-neutral-solid.
#     고른 칸 누름 SEED palette.gray-100 → bg-layer-default-pressed.
#   - 웹의 hovered 상태는 누름과 같은 바탕(축소 없음 — v106). SEED 도 마우스 호버에 같은 바탕을 칠한다.
#   - 안 고른 칸을 올리거나 누르는 동안 글을 fg-neutral-muted 로 — 누름 바탕 위 fg-neutral-subtle 이 다크에서 3.91:1 이다.
#   - 줄바꿈은 단어 단위(v114) — 긴 글은 여러 줄이 되고 모든 칸이 가장 높은 칸에 맞춘다(SEED).
#   - 알림 점은 브랜드 글자색(fg-brand — 다크에서 밝은 짝, Desk · HR 이 다르다) — Notification Badge small 과 같다(notification-badge.yaml).
#     SEED 는 bg.brand-solid 이고, porest 다크에서는 그 색이 바탕에 묻힌다.

name: SegmentedControl

slots:
  root: 트랙 — 알약. 놓인 자리 폭을 채우고 칸이 그 폭을 똑같이 나눈다
  item: 칸 — 누르는 자리. 모든 칸이 같은 폭 · 같은 높이
  label: 글 — 짧게. 길면 단어 단위로 줄을 바꾼다
  indicator: 고른 알약 — 고른 칸 뒤에 깔리고, 다른 칸을 고르면 미끄러져 옮긴다
  notification: 알림 점 — 새 내용이 있는 칸에만, 글 오른쪽 위
  focusRing: 키보드 포커스 링(웹) — 칸 바깥

variants:
  selected:
    unselected: 안 고름
    selected: 고름

defaults:
  selected: unselected

states:
  enabled: 기본
  hovered: 웹 — 누름과 같은 바탕(v106), 축소는 없다
  pressed: 누름 바탕 + 칸 안의 글만 2px 거리 축소(바탕은 그대로)
  focused: 웹 — 키보드 포커스에만 링
  disabled: 막힌 칸 · 막힌 트랙 — 전용 색(v106), 흐리게 하지 않는다

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      root:
        padding: $spacing-x1
        radius: $radius-full
        background: { value: $color-bg-neutral-weak, note: "SEED bg.neutral-weak-alpha 의 불투명 짝" }
        width: { value: 놓인 자리 폭, note: "트랙이 자리를 채우고 칸 수로 똑같이 나눈다(최소 폭 없음) — 넓은 화면에서는 놓는 자리를 좁힌다" }
        columns: { value: 칸 수(2 ~ 4), note: "모든 칸이 같은 폭 · 같은 높이(가장 높은 칸에 맞춘다)" }
      item:
        minHeight: { value: 34px, note: "트랙 안쪽 4 를 더해 42" }
        paddingX: { value: $spacing-x3, note: "SEED 24 → 12 — 칸이 트랙을 나누므로 폰에서 4개도 들어간다" }
        paddingY: $spacing-x1_5
        radius: $radius-full
        cursor: pointer
        touchTarget: { value: 칸 전체, note: "34 × 칸 폭 — AA ✓(24 이상) · AAA 는 44 에 모자란다(SEED 와 같다)" }
        transitionProperty: background-color, color, box-shadow
        transitionDuration: $motion-duration-color-transition
        transitionEasing: $motion-ease-easing
      label:
        typography: { value: $text-t5, note: "16 / 22 — 고르든 안 고르든 같다" }
        fontWeight: { value: 700, note: "고르든 안 고르든 700" }
        foreground: $color-fg-neutral-subtle
        textAlign: { value: center, note: "길면 단어 단위로 줄을 바꾼다(v114)" }
      indicator:
        background: { value: $color-bg-layer-default, note: "흰 알약 — 다크에서는 트랙보다 어둡다(SEED 도 다크 알약이 검정)" }
        borderColor: { value: $color-stroke-neutral-contrast, note: "안쪽 1px(inset) 짙은 테두리 — 고른 칸을 트랙과 15.20 · 10.32:1 로 가른다(SEED 옅은 1px 은 1.14 · 1.20 — 사용자 결정 2026-10-02)" }
        borderWidth: 1px
        radius: $radius-full
        inset: { value: 4px, note: "트랙 안쪽 4 — 폭 = (트랙 − 8) ÷ 칸 수, 고른 칸 번호만큼 옆으로 옮긴다" }
        transitionProperty: { value: transform, note: "고른 칸으로 미끄러진다" }
        transitionDuration: $motion-duration-d4
        transitionEasing: $motion-ease-easing
      notification:
        size: 6px
        radius: $radius-full
        background: { value: $color-fg-brand, note: "브랜드 글자색 — 트랙 위 Desk 7.76 · 4.69 · HR 4.69 · 4.79(bg-brand-solid 는 다크에서 1.33 · 2.20 이라 안 보인다). 고른 칸에는 없다 — 고르면 사라진다" }
        gap: { value: 2px, note: "글 끝에서 2, 글 위쪽에 맞춘다" }
    pressed:
      label:
        scale: { value: 글 2px 거리 축소, note: "칸 바탕은 그대로, 안의 글만 준다(SEED scaleScope: content · v104) — 모션 줄이기면 하지 않는다" }
        scaleDuration: $motion-duration-pressed-scale
        scaleEasing: $motion-ease-pressed-scale
    focused:
      focusRing:
        width: 2px
        offset: { value: 2px, note: "칸 바깥 — 알약을 따라 둥글다" }
        color: $color-stroke-focus-ring
    disabled:
      item:
        cursor: { value: not-allowed, note: "누름 바탕 · 축소 없음" }
      label:
        foreground: $color-fg-disabled

  # ── 고름 ──────────────────────────────────────────────
  - when: { selected: unselected }
    hovered:
      item:
        background: $color-bg-neutral-weak-pressed
        borderColor: { value: $color-stroke-neutral-weak, note: "안쪽 1px — 고른 알약과 같은 테두리" }
        borderWidth: 1px
      label:
        foreground: { value: $color-fg-neutral-muted, note: "누름 바탕 위에서 한 단계 짙게 — fg-neutral-subtle 이면 다크 3.91:1, muted 4.95 · 라이트 6.17(List 의 강조 줄과 같은 방법)" }
    pressed:
      item:
        background: $color-bg-neutral-weak-pressed
        borderColor: $color-stroke-neutral-weak
        borderWidth: 1px
      label:
        foreground: $color-fg-neutral-muted
  - when: { selected: selected }
    enabled:
      label:
        foreground: { value: $color-fg-neutral, note: "글자색만 바뀐다 — 굵기 · 크기 그대로" }
    hovered:
      item:
        background: { value: $color-bg-layer-default-pressed, note: "칸에 칠해 알약을 덮는다 — 짙은 테두리는 그대로" }
        borderColor: $color-stroke-neutral-contrast
        borderWidth: 1px
    pressed:
      item:
        background: { value: $color-bg-layer-default-pressed, note: "SEED palette.gray-100 의 역할 짝 — 짙은 테두리는 그대로" }
        borderColor: $color-stroke-neutral-contrast
        borderWidth: 1px
    disabled:
      item:
        background: { value: $color-bg-disabled, note: "고른 채 막힘 — 칸에 칠해 알약을 덮는다" }
        borderColor: { value: $color-stroke-neutral-solid, note: "짙은 1px 를 회색으로 남겨 무엇을 골랐는지 보인다(Chip 의 고른 채 막힘과 같다)" }
        borderWidth: 1px

motion:
  "고른 알약 — 미끄러짐":
    duration: $motion-duration-d4
    easing: $motion-ease-easing
    properties: [transform]
  "누름 · 호버 · 고름 — 색":
    duration: $motion-duration-color-transition
    easing: $motion-ease-easing
    properties: [background-color, color, box-shadow]
  "누름 — 글":
    duration: $motion-duration-pressed-scale
    easing: $motion-ease-pressed-scale
    properties: [scale]
    note: "칸 안의 글만 2px 거리 축소 — 모션 줄이기면 하지 않는다"
