# Progress Circle 의 수치 원본 — 구조는 SEED Progress Circle(2026-10-03 사용자 결정, 비교 페이지 8 · 14). 옛 Spinner 를 대신한다.
# 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 작업이 진행 중임을 알리는 원. 값을 모르면(indeterminate) 호가 늘었다 줄며 돌고, 값을 알면(determinate) 12시부터 값만큼 채운다.
# 크기는 24(요소 안) · 40(콘텐츠 영역 가운데) 둘 — 버튼 안의 원(14 · 14 · 16 · 18, 두께 2)은 Button 이 정한다(button.yaml 의
# progressCircle — 원은 size · tone inherit 로 그 값을 따른다). 언제 보이고 언제 실패로 바꾸는지는 skeleton.md 의
# "기다리는 동안"(skeleton.yaml 의 region) 한 곳에 있다. 당겨서 새로 고침의 수치는 pull-to-refresh.yaml 이다.
#
# SEED 와 다른 자리(progress-circle.md 의 "SEED 와 다른 점")
#   - neutral 원은 stroke-neutral-solid(흰 면 위 4.18 · 다크 4.13), 트랙은 stroke-neutral-subtle — SEED gray-500 원은 흰 화면 위
#     1.50:1 로 WCAG 1.4.11(3:1)에 못 미친다(사용자 결정 "SEED 모양 + 보이는 색").
#   - brand 는 groo 역할 짝(stroke-brand-solid · bg-brand-weak-pressed) — 다크에서는 밝은 짝이다(SEED 는 #ff6600 그대로).
#   - staticWhite 트랙은 흰 30%(Button v112 의 채운 버튼과 같다 — SEED 18%).
#   - 값 있는 원은 min · max 를 지키고 채움이 300ms 로 따라 찬다 — SEED 웹은 min · max 를 무시하고 채움이 건너뛴다.
#   - 모션 줄이기면 돌지 않는다 — 값 없는 원은 고정된 3/4 호(v104). SEED 는 계속 돈다.
#   - 이름 · 값 글은 한국어("불러오는 중" · "40%") — SEED 웹은 이름이 없고 값 글이 영어("loading..." · "40 percent").

name: ProgressCircle

slots:
  root: 원 상자 — 지름 · 두께, 정사각
  track: 트랙 — 원 전체, 옅은 색
  range: 호 — 진행을 그린다. 12시에서 시작하고 끝이 둥글다

variants:
  size:
    "24": 요소 안 — 섹션 제목 옆 · 목록 끝 · 올리는 항목 위 · 당겨서 새로 고침
    "40": 콘텐츠 영역 가운데 — 구조를 미리 그릴 수 없는 화면 · 시트 · 카드 전체를 기다릴 때
    inherit: 놓인 부품이 정한다 — Button 의 로딩 원(14 · 14 · 16 · 18, 두께 2 — button.yaml)
  tone:
    neutral: 기본 — 흰 면 · 떠 있는 면 위 어디서나
    brand: 브랜드를 보일 자리 하나 — 앱 첫 화면(스플래시)처럼 큰 전환점
    staticWhite: 어두운 면 위 — 사진 위 딤(올리는 중인 사진) · 짙은 채움
    inherit: 놓인 부품이 정한다 — 기본은 글자색(currentColor). Button 은 변형마다(button.yaml)
  mode:
    indeterminate: 값을 모를 때 — 호가 늘었다 줄며 돈다
    determinate: 값을 알 때 — 12시부터 값만큼 채운다(올리기 · 받기 · 당기는 동안)

defaults:
  size: "40"
  tone: neutral
  mode: indeterminate

states:
  enabled: 보임
  reducedMotion: 모션 줄이기 — 돌지 않는다

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      range:
        linecap: { value: round, note: "끝을 둥글게 — 값이 0 이면 호를 지운다(둥근 점이 남지 않게)" }
        start: { value: 12시, note: "−90° 에서 시계 방향으로" }
    reducedMotion:
      root:
        rotate: { value: 멈춤, note: "돌지 않는다(v104) — 값 없는 원은 고정된 호, 값 있는 원은 채움이 바로 바뀐다" }

  # ── 크기 ──────────────────────────────────────────────
  - when: { size: "24" }
    enabled:
      root:
        size: 24px
        thickness: { value: 3px, note: "선 가운데 반지름 10.5" }
  - when: { size: "40" }
    enabled:
      root:
        size: 40px
        thickness: { value: 5px, note: "선 가운데 반지름 17.5" }
  - when: { size: inherit }
    enabled:
      root:
        size: { value: 부품이 정함, note: "--progress-size — Button 14 · 14 · 16 · 18(button.yaml progressCircle)" }
        thickness: { value: 부품이 정함, note: "--progress-thickness — Button 2" }

  # ── 톤 ────────────────────────────────────────────────
  - when: { tone: neutral }
    enabled:
      root:
        track: { value: $color-stroke-neutral-subtle, note: "흰 면 위 1.15 · 다크 1.30 — 장식" }
        range: { value: $color-stroke-neutral-solid, note: "흰 면 위 4.18 · 다크 4.13(떠 있는 면 3.58), 트랙과 3.63 · 3.18 — 3:1 이상(사용자 결정)" }
  - when: { tone: brand }
    enabled:
      root:
        track: { value: $color-bg-brand-weak-pressed, note: "Button brandOutline 의 로딩 원 트랙과 같다" }
        range: { value: $color-stroke-brand-solid, note: "다크는 밝은 짝 — 흰 면 위 Desk 8.38 · HR 8.17, 다크 Desk 6.10 · HR 6.07. 트랙과 Desk 6.59 · 4.73 · HR 6.40 · 4.71" }
  - when: { tone: staticWhite }
    enabled:
      root:
        track: { value: $color-static-white / 30%, note: "Button v112 의 채운 버튼과 같다(SEED 18%)" }
        range: { value: $color-static-white, note: "딤(overlay-dim-light 50%) 위 3.95 · 다크 딤(65%) 위 19.27" }
  - when: { tone: inherit }
    enabled:
      root:
        track: { value: currentColor 30%, note: "부품이 --progress-track 을 정하면 그 값 — Button 은 변형마다" }
        range: { value: currentColor, note: "부품이 --progress-range 를 정하면 그 값" }

  # ── 값 ────────────────────────────────────────────────
  - when: { mode: indeterminate }
    enabled:
      range:
        length: { value: 늘었다 줄며, note: "머리가 원둘레만큼 늘고(1.2초의 0 ~ 75%) 꼬리가 따라와 줄인다(33.33 ~ 100%) — 아래 모션" }
    reducedMotion:
      range:
        length: { value: 원둘레의 75%, note: "12시부터 시계 방향 3/4 — 돌지 않는 고정 호" }
  - when: { mode: determinate }
    enabled:
      range:
        length: { value: 값만큼, note: "(값 − min) ÷ (max − min) — min · max 를 지킨다(기본 0 · 100). max 면 꽉 찬 원" }
        transitionDuration: $motion-duration-d6
        transitionEasing: $motion-ease-enter
    reducedMotion:
      range:
        transitionDuration: { value: 0ms, note: "채움이 바로 바뀐다" }

motion:
  "회전":
    duration: 1200ms
    easing: "cubic-bezier(0.35, 0.25, 0.65, 0.75)"
    properties: ["rotate 0 → 360°"]
    note: "값 없는 원 — 쉬지 않고 되풀이. 모션 줄이기면 멈춘다"
  "호 머리":
    duration: 1200ms
    easing: "cubic-bezier(0.35, 0, 0.65, 1)"
    properties: ["stroke-dasharray 0 → 원둘레(0 ~ 75%) · 그대로(75 ~ 100%)"]
    note: "값 없는 원 — 회전과 같은 박자로 되풀이"
  "호 꼬리":
    duration: 1200ms
    easing: "cubic-bezier(0.35, 0, 0.65, 0.6)"
    properties: ["stroke-dashoffset 0(0 ~ 33.33%) → −원둘레(100%)"]
    note: "머리와 겹쳐 호가 늘었다 줄며 돈다"
  "채움":
    duration: $motion-duration-d6
    easing: $motion-ease-enter
    properties: [stroke-dashoffset]
    note: "값 있는 원 — 값이 바뀔 때. 처음 그릴 때는 움직이지 않는다. 모션 줄이기면 바로"
