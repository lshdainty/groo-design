# Avatar 의 수치 원본 — 구조는 SEED Avatar(2026-10-03 사용자 결정, 표시 비교 페이지 5C · 6B · 14). 묶음은 avatar-stack.yaml.
# 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 사람 한 명을 보이는 원 — 사진이 있으면 사진, 없으면 이름의 첫 글자(이니셜) + 이름 색. 누르지 않는다(누르는 자리는 감싼 버튼 ·
# 링크가 상태를 가진다). 물건(은행 · 증권 · 카드 · 코인 · 금 · 회사)은 Logo Tile(logo-tile.yaml — 같은 첫 글자 · 이름 색 규칙),
# 카테고리는 List 의 타일이다 — 아바타가 아니다.
#
# 이니셜 · 이름 색 — 웹 · 앱이 같은 규칙(avatar.md 의 "이니셜과 이름 색")
#   이니셜  = 표시 이름(앞뒤 공백을 뺀)의 첫 글자 하나(grapheme) — 로마자는 대문자. "김민수" → "김", "Kim Minsu" → "K"
#   이름 색 = 표시 이름의 유니코드 코드 포인트 합 % 10 → 차트 10색(v110 순서)
#            blue · green · orange · violet · pink · indigo · red · yellow · brown · gray
#            "김민수" 142420 → 0 blue · "이서연" 151168 → 8 brown · "Kim Minsu" 845 → 5 indigo
#   글자색  = fg-neutral-inverted — 라이트 흰 · 다크 짙은 글자(차트 색 위 4.55 ~ 7.70:1, v110)
#
# SEED 와 다른 자리(avatar.md 의 "SEED 와 다른 점")
#   - 사진이 없으면 이니셜 + 이름 색(사용자 결정 5C) — SEED 는 사람 그림(Identity Placeholder)이고 이니셜이 없다.
#   - 오른쪽 아래 배지(원 · 방패 · 꽃 마스크)는 두지 않는다 — porest 에 쓰는 자리가 없다.
#   - 80 · 96 의 자리는 porest 화면에서 정했다(SEED 설명 없음).

name: Avatar

slots:
  root: 원 — 폭 = 높이. 사진 또는 이니셜을 원으로 자른다
  image: 사진 — 원을 채운다. 불러오는 동안 · 실패하면 이니셜이 보인다
  initial: 이니셜 — 사진이 없을 때. 이름의 첫 글자 + 이름 색 바탕
  border: 1px 안쪽 테두리 — 모든 크기, 사진 · 이니셜 위에 겹친다(흰 사진이 바탕에 묻히지 않게)
  uploadOverlay: 올리는 중 덮개 — 원 위 딤 + 값 있는 원 24. 사진 바꾸기 자리(edit photo)에만
  editActions: 사진 바꾸기 버튼 줄 — 아바타 아래 늘 보이는 "사진 바꾸기" · "사진 지우기". 사진 바꾸기 자리(edit photo)에만

variants:
  size:
    "20": 20 — 댓글 단 사람(SEED). porest 글 한 줄 안(공유한 사람 · 작성자)
    "24": 24 — 답글(SEED). porest 줄 안 묶음(더치페이 목록의 참여자 — 지금 28) · HR 일정 필터 사용자 · 휴가 신청의 결재자
    "36": 36 — 댓글(SEED). porest 한 줄 목록 줄(더치페이 참가자 · 캘린더 공유 멤버) · 사이드바 사용자 · HR 표의 직원(지금 28 ~ 40 · 32)
    "42": 42 — 게시글 상세(SEED). porest 두 줄 목록 줄(이름 + 설명 — 설정의 계정 줄 · HR 구성원 목록, 지금 46)
    "48": 48 — 작은 목록(SEED). porest 지금 쓰는 곳 없음
    "56": 56 — 큰 목록(SEED). porest 지금 쓰는 곳 없음
    "64": 64 — 프로필 상세 · 캐러셀(SEED). porest 지금 쓰는 곳 없음
    "80": 80 — SEED 설명 없음. porest Desk 계정 화면 머리(웹 · 앱, 지금 72)
    "96": 96 — SEED 설명 없음. porest HR 내 정보 · 직원 정보의 큰 사진(지금 128)
    "108": 108 — 프로필 수정(SEED). porest HR 직원 정보 수정의 사진(지금 160)

  edit:
    none: 보이기만 — 누르지 않는다(기본)
    photo: 사진 바꾸기 자리 — 아바타 아래 늘 보이는 버튼 둘(HR 직원 정보 수정의 108 — 2026-10-15 마무리 6A)

defaults:
  size: "48"
  edit: none

states:
  enabled: 기본 — 아바타는 누르지 않는다(누르는 자리는 감싼 버튼 · 링크 · 사진 바꾸기 버튼)
  uploading: 사진 바꾸기 자리에서 새 사진을 올리는 중

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      root:
        radius: $radius-full
      image:
        objectFit: cover
      initial:
        background: { value: "chart-{이름 색}", note: "이름의 코드 포인트 합 % 10 → 차트 10색(v110 순서 blue · green · orange · violet · pink · indigo · red · yellow · brown · gray) — 라이트 700 · 다크 800-dark. 색은 뜻이 없다(장식)" }
        foreground: { value: $color-fg-neutral-inverted, note: "라이트 흰 · 다크 짙은 글자 — 차트 색 위 4.55(yellow) ~ 7.70:1(gray 다크). 다크에서 흰 글자는 1.88 ~ 2.39 라 쓰지 않는다" }
        fontWeight: 700
        lineHeight: { value: 1, note: "원 가운데 — 글자 크기 설정을 따르지 않는 px(원 안에서 넘치지 않게)" }
        textTransform: { value: uppercase, note: "로마자 첫 글자만 대문자 — \"Kim Minsu\" → \"K\". 한글 · 숫자 · 그림 글자는 그대로" }
      border:
        borderWidth: { value: 1px, note: "모든 크기 1 — 원 안쪽(inset box-shadow), 크기가 변하지 않는다(SEED)" }
        borderColor: { value: $color-stroke-neutral-overlay, note: "v118 — 검정 4.7% · 다크 흰 5%(SEED stroke.neutral-subtle 의 값). 흰 사진이 흰 바탕에 묻히지 않고, 어두운 사진 · 이니셜 원 둘레에는 테가 생기지 않는다. Image Frame · Logo Tile 의 윤곽과 같은 색" }

  # ── 크기 ──────────────────────────────────────────────
  # 이니셜 글자 = 지름의 40%(가장 작아도 10) — 비교 페이지 그림의 값
  - when: { size: "20" }
    enabled:
      root: { size: 20px }
      initial: { fontSize: { value: 10px, note: "지름의 50% — 10 아래로 내리지 않는다" } }
  - when: { size: "24" }
    enabled:
      root: { size: 24px }
      initial: { fontSize: { value: 10px, note: "지름의 42% — 10 아래로 내리지 않는다" } }
  - when: { size: "36" }
    enabled:
      root: { size: 36px }
      initial: { fontSize: 14px }
  - when: { size: "42" }
    enabled:
      root: { size: 42px }
      initial: { fontSize: 17px }
  - when: { size: "48" }
    enabled:
      root: { size: 48px }
      initial: { fontSize: 19px }
  - when: { size: "56" }
    enabled:
      root: { size: 56px }
      initial: { fontSize: 22px }
  - when: { size: "64" }
    enabled:
      root: { size: 64px }
      initial: { fontSize: 26px }
  - when: { size: "80" }
    enabled:
      root: { size: 80px }
      initial: { fontSize: 32px }
  - when: { size: "96" }
    enabled:
      root: { size: 96px }
      initial: { fontSize: 38px }
  - when: { size: "108" }
    enabled:
      root: { size: 108px }
      initial: { fontSize: 43px }

  # ── 사진 바꾸기 자리 ──────────────────────────────────
  # 아바타 아래 늘 보이는 버튼 둘 — 마우스를 올려야 보이는 덮개(6C)와 Attachment Input 한 장(6B)은 고르지 않았다.
  - when: { edit: photo }
    enabled:
      editActions:
        marginTop: { value: $spacing-x4, note: "아바타 ↔ 버튼 줄 16" }
        gap: { value: $spacing-x2, note: "버튼 사이 8 · 가운데 정렬 · 좁으면 줄을 바꾼다" }
        change: { value: "Button neutralWeak · small — \"사진 바꾸기\"", note: "누르면 고르기 창(앱은 Menu Sheet — 사진 찍기 · 앨범에서 고르기). 사진이 없어도 같은 이름" }
        remove: { value: "Button ghost · small — \"사진 지우기\"", note: "사진이 있을 때만 — 지우면 이니셜로 돌아간다" }
      uploadOverlay:
        display: { value: none, note: "올리는 중에만" }
    uploading:
      uploadOverlay:
        display: 보임
        background: { value: $overlay-dim-light, dark: $overlay-dim-dark, note: "원 위 딤 — Progress Circle 의 \"사진 위 딤\"(라이트 50% · 다크 65%)" }
        radius: $radius-full
        progress: { value: "Progress Circle 24 · staticWhite · determinate", note: "값 있는 원 — 흰 호 + 흰 30% 트랙(딤 위 3.95 · 19.27). 이름 \"프로필 사진 올리는 중\"" }
      editActions:
        disabled: { value: "true", note: "올리는 동안 두 버튼 막힘(Button 막힘 색) — 끝나면 풀린다. 실패는 Field 오류 글(\"5MB 넘는 사진은 올릴 수 없어요.\")" }
