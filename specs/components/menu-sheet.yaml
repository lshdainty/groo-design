# Menu Sheet 의 수치 원본 — 구조는 SEED Swipeable Menu Sheet(2026-10-02 사용자 결정, 비교 페이지 1 · 3).
# 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 화면 아래에서 올라오는 동작 목록 — 1280 미만에서 Menu(menu.yaml) 대신 뜬다(같은 동작 · 같은 순서). 줄 끝 ⋮,
# 머리의 더보기 버튼, 줄 스와이프의 대신 길(swipe-actions.md)이 연다. 딤 · 끌어내리기 · 안전 영역 · 모션은
# Bottom Sheet(bottom-sheet.yaml)와 같다 — 다른 것은 손잡이가 늘 있고 위 닫기 버튼이 없다는 것.
#
# SEED 와 다른 자리(menu-sheet.md 의 "SEED 와 다른 점")
#   - 좌우 여백: SEED 16 → groo 화면 여백 spacing-global-gutter 24(Bottom Sheet 와 같다).
#   - 딤: groo overlay-dim 0.50 · 다크 0.65(v102 — SEED 0.455).
#   - 줄 사이 선: 묶음 바탕(bg-neutral-weak) 위에서 보이는 불투명한 stroke-neutral-weak(SEED stroke.neutral-muted 는
#     투명도가 있다 — 다크에서 stroke-neutral-subtle 은 묶음 바탕과 같은 색이라 선이 사라진다).
#   - 줄 누름 · 호버는 불투명한 bg-neutral-weak-pressed(SEED 와 같은 역할).
#   - 막힌 줄: SEED 는 Figma 에만 있고 코드에 없다 — Menu 와 같은 규칙(전용 색 · 누르지 못함)으로 채운다.
#     1280 에서 Menu ↔ Menu Sheet 가 바뀌어도 같은 줄이 막혀 있어야 해서다.
#   - 보조 기술용 닫기: SEED 는 안 보이는 채로 Tab 이 선다 — groo 는 키보드 초점이 오면 보인다(기초의 "초점은 늘 보인다").
#   - z-index: specs/z-index.md 의 L2(딤 z-modal 100 · 시트 z-modal-content 101).

name: MenuSheet

slots:
  overlay: 딤 — 시트 뒤 화면 전체. 누르면 닫힌다
  root: 시트 — 위 두 모서리만 둥글다. 넓은 화면에서는 가운데에 선다
  handle: 손잡이 — 늘 있다. 끌어내리면 닫힌다
  header: 머리 — 제목 · 설명(없어도 된다)
  title: 제목 — 무엇의 동작인지("주간 회의 메모")
  description: 설명 — 제목만으로 모자랄 때만
  group: 묶음 — 옅은 회색 상자. 묶음 사이는 간격만
  item: 줄 — 누르면 시트를 닫고 실행한다
  itemIcon: 앞 아이콘 — 쓰면 모든 줄에
  itemLabel: 이름 — 동사로 짧게
  itemDescription: 설명 — 이름이 추상적일 때만
  divider: 줄 사이 선 — 묶음의 마지막 줄 아래에는 없다
  closeButton: 보조 기술용 닫기 — 목록 뒤, 키보드 초점이 오면 보인다
  focusRing: 키보드 포커스 링(웹)

variants:
  layout:
    textWithIcon: 아이콘 + 글 — 글은 왼쪽 정렬
    textOnly: 글만 — 글은 가운데 정렬, 줄 설명은 두지 않는다
  tone:
    neutral: 대부분의 동작
    critical: 되돌릴 수 없는 동작(삭제 · 나가기) — 맨 아래 묶음

defaults:
  layout: textWithIcon
  tone: neutral

states:
  enabled: 열림
  hovered: 웹 — 마우스를 올린 줄의 바탕(누름과 같은 색, 축소 없음)
  pressed: 누름 — 줄 바탕 + 내용만 2px 거리 축소
  focused: 웹 — 키보드 포커스에만 링. 보조 기술용 닫기는 이때 보인다
  disabled: 막힌 줄 — 전용 색, 눌러도 실행하지 않는다

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      overlay:
        background: { value: $overlay-dim-light, dark: $overlay-dim-dark, note: "Bottom Sheet 와 같은 groo 딤(v102)" }
        zIndex: { value: 100, note: "z-modal — specs/z-index.md L2. 시트는 z-modal-content 101" }
      root:
        maxWidth: { value: 480px, note: "그보다 좁은 화면은 화면 폭 전체, 넓으면 가운데" }
        radius: { value: $radius-r5, note: "위 두 모서리만(Bottom Sheet 는 24)" }
        background: $color-bg-layer-floating
        shadow: { value: none, note: "그림자 없이 딤과 표면 색으로 뜬다" }
        paddingTop: { value: $spacing-x6, note: "손잡이 자리" }
        paddingX: { value: $spacing-global-gutter, note: "SEED 16 → 화면 여백 24" }
        paddingBottom: { value: $spacing-x4, note: "그 아래 안전 영역(safe-area-inset-bottom)" }
        maxHeight: { value: 화면 높이의 90%, note: "스크롤이 생기지 않게 묶음 · 줄 수를 줄인다(SEED) — 넘치면 목록만 스크롤" }
        zIndex: { value: 101, note: "z-modal-content — specs/z-index.md L2" }
      handle:
        width: 36px
        height: 4px
        radius: $radius-full
        background: $color-stroke-neutral-weak
        top: { value: $spacing-x1_5, note: "시트 위에서 6, 가로 가운데 — 보조 기술에는 숨긴다" }
      header:
        paddingBottom: $spacing-x4
        gap: { value: $spacing-x1, note: "제목 ↔ 설명" }
        textAlign: center
      title:
        typography: { value: $text-t6, note: "한 줄로 — 길면 줄을 바꾼다" }
        fontWeight: 700
        foreground: $color-fg-neutral
      description:
        typography: $text-t4
        fontWeight: 400
        foreground: $color-fg-neutral-muted
      group:
        background: $color-bg-neutral-weak
        radius: $radius-r4
        gap: { value: $spacing-x2_5, note: "묶음 사이 — 선 없이 간격만" }
      item:
        minHeight: $spacing-x13
        paddingY: $spacing-x3_5
        paddingX: $spacing-x4
        gap: $spacing-x3_5
        cursor: pointer
        transitionProperty: background-color
        transitionDuration: $motion-duration-color-transition
        transitionEasing: $motion-ease-easing
      itemIcon:
        size: { value: 22px, note: "lucide" }
        color: $color-fg-neutral
      itemLabel:
        typography: { value: $text-t5, note: "단어 단위 줄바꿈(v114)" }
        fontWeight: 400
        foreground: $color-fg-neutral
      itemDescription:
        typography: $text-t3
        fontWeight: 500
        foreground: $color-fg-neutral-subtle
        gap: { value: $spacing-x0_5, note: "이름 ↔ 설명" }
      divider:
        color: { value: $color-stroke-neutral-weak, note: "묶음 바탕 위에서 보이는 짝" }
        height: { value: 1px, note: "줄 안쪽 아래(inset) — 묶음의 마지막 줄에는 없다" }
      closeButton:
        minHeight: { value: $spacing-x13, note: "평소에는 보이지 않는다(보조 기술은 읽는다) — 키보드 초점이 오면 이 모양으로 보인다" }
        paddingX: $spacing-x5
        radius: $radius-r3
        background: $color-bg-neutral-weak
        typography: $text-t5
        fontWeight: 500
        foreground: $color-fg-neutral
        marginTop: { value: $spacing-x2_5, note: "마지막 묶음과" }
    hovered:
      item:
        background: $color-bg-neutral-weak-pressed
      closeButton:
        background: { value: $color-bg-neutral-weak-pressed, note: "초점이 와서 보이는 동안" }
      itemDescription:
        foreground: { value: $color-fg-neutral-muted, note: "누름 바탕 위에서도 4.5:1 — fg-neutral-subtle 은 다크 3.91 로 모자란다(List 의 강조 줄과 같은 규칙)" }
    pressed:
      closeButton:
        background: $color-bg-neutral-weak-pressed
      item:
        background: $color-bg-neutral-weak-pressed
        scale: { value: 콘텐츠 2px 거리 축소, note: "아이콘 · 글만 준다(SEED scaleScope: content) — 바탕은 그대로. 모션 줄이기면 하지 않는다" }
        scaleDuration: $motion-duration-pressed-scale
        scaleEasing: $motion-ease-pressed-scale
      itemDescription:
        foreground: $color-fg-neutral-muted
    focused:
      focusRing:
        width: 2px
        offset: { value: -2px, note: "줄 안쪽 — 묶음 상자가 넘친 링을 자른다" }
        closeButtonOffset: { value: 2px, note: "보조 기술용 닫기 — 묶음 밖이라 바깥 2" }
        color: $color-stroke-focus-ring
    disabled:
      item:
        cursor: not-allowed
      itemIcon:
        color: $color-fg-disabled
      itemLabel:
        foreground: $color-fg-disabled
      itemDescription:
        foreground: $color-fg-disabled

  # ── 정렬 ──────────────────────────────────────────────
  - when: { layout: textOnly }
    enabled:
      item:
        justifyContent: { value: center, note: "아이콘이 없으면 가운데 — 줄 설명은 두지 않는다" }
      itemLabel:
        textAlign: center

  # ── 위험한 동작 ────────────────────────────────────────
  - when: { tone: critical }
    enabled:
      itemIcon:
        color: $color-fg-critical
      itemLabel:
        foreground: { value: $color-fg-critical, note: "설명은 fg-neutral-subtle 그대로" }
    hovered:
      itemIcon:
        color: $color-fg-critical-contrast
      itemLabel:
        foreground: { value: $color-fg-critical-contrast, note: "누름 바탕 위에서도 4.5:1 — fg-critical 은 라이트 4.39 · 다크 3.91 로 모자란다" }
    pressed:
      itemIcon:
        color: $color-fg-critical-contrast
      itemLabel:
        foreground: $color-fg-critical-contrast

motion:
  "열림 — 시트":
    duration: $motion-duration-d6
    easing: $motion-ease-enter-expressive
    properties: [translateY 100% → 0]
    note: "Bottom Sheet 와 같다 — 모션 줄이기면 150ms 서서히 나타남(v104)"
  "열림 — 딤":
    duration: $motion-duration-d6
    easing: $motion-ease-enter
    properties: [opacity 0 → 1]
  "닫힘 — 시트":
    duration: $motion-duration-d4
    easing: $motion-ease-exit
    properties: [translateY → 100%]
  "닫힘 — 딤":
    duration: $motion-duration-d4
    easing: $motion-ease-exit
    properties: [opacity → 0]
  "누름 — 줄":
    duration: $motion-duration-pressed-scale
    easing: $motion-ease-pressed-scale
    properties: [scale]
