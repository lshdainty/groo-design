# Notification Badge 의 수치 원본 — 구조는 SEED Notification Badge(2026-10-03 사용자 결정, 표시 비교 페이지 4A · 14).
# 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 안 읽은 알림 · 확인하지 않은 새 것이 있다는 신호 — 점(small, 있음)과 숫자(large, 몇 개). 아이콘 버튼 · 탭 글에 붙고,
# 보면 사라진다. 혼자 누르지 않는다 — 붙은 버튼이 누른다. 점 · 숫자는 보조 기술에 숨기고 붙은 버튼 · 탭의 이름에 넣는다.
# Tabs · Chip Tabs · Segmented Control 의 알림 점은 이 small 이다(값은 그 스펙에도 있다 — tabs.yaml · chip-tabs.yaml ·
# segmented-control.yaml 의 notification).
#
# 자리는 붙는 대상의 상자에서 잰다(SEED 재현 실측 — 24 아이콘 기준).
#   icon · small : 점의 오른쪽 위 꼭짓점이 (아이콘 폭 − 1, 1) — 24 아이콘이면 x 17 ~ 23 · y 1 ~ 7(아이콘 안쪽)
#   icon · large : 알약의 왼쪽 아래 꼭짓점이 (아이콘 폭 − 8, 14) — 24 아이콘이면 x 16 ~ 34 · y −4 ~ 14(위 · 오른쪽으로 튀어나온다)
#   text         : 글 끝에서 2 뒤, 줄 상자 위 끝에 맞춘다(점 · 알약 모두)
#
# SEED 와 다른 자리(notification-badge.md 의 "SEED 와 다른 점")
#   - 점은 브랜드 글자색 fg-brand(다크에서 밝은 짝) — SEED 는 점 · 숫자 모두 bg.brand-solid. groo 다크에서 bg-brand-solid 점은
#     표면과 Desk · HR 1.73:1 로 묻힌다. 숫자 알약은 SEED 대로 bg-brand-solid + 흰 글자(숫자가 정보를 들고 있다).
#   - 숫자 상한은 "99+"(SEED 두 문서 중 Bottom Navigation 쪽 — Notification Badge 문서의 "최대 4자 · 999+" 가 아니다).
#   - 붙은 버튼 · 탭의 이름에 "새 알림 3개" 를 넣는다 — SEED 는 이름이 없어 소리로 알 수 없다.

name: NotificationBadge

slots:
  root: 점(small) · 숫자 알약(large) — 붙는 대상의 상자 위에 겹쳐 놓인다(자리를 차지하지 않는다)
  label: 숫자 — large 만. 0 이면 배지가 없고, 100 이상이면 "99+"

variants:
  size:
    small: 점 6 — 새 것이 있는지만(탭 · Segmented · 상단 바)
    large: 숫자 18 — 몇 개인지가 중요할 때(상단 바 알림)
  attach:
    icon: 아이콘에 붙는다 — 상단 바 · 탭 바의 아이콘 버튼
    text: 글에 붙는다 — 탭 · Segmented 의 글 오른쪽 위

defaults:
  size: small
  attach: icon

states:
  enabled: 하나뿐 — 누르지 않는다(붙은 버튼이 누른다). 보면 사라진다

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      root:
        radius: $radius-full
      label:
        fontWeight: { value: 700, note: "숫자(large)에만 있다" }

  # ── 크기 ──────────────────────────────────────────────
  - when: { size: small }
    enabled:
      root:
        size: 6px
        background: { value: $color-fg-brand, note: "브랜드 글자색 — 다크에서 밝은 짝(표면 위 Desk 8.38 · 6.10 · HR 8.17 · 6.07). bg-brand-solid 는 다크 표면과 Desk · HR 1.73 이라 쓰지 않는다" }
  - when: { size: large }
    enabled:
      root:
        minWidth: 18px
        minHeight: { value: 18px, note: "글자가 커지지 않아 늘 18 — 폭만 숫자를 따른다(1 · 8 은 18 × 18, 12 는 약 22, 99+ 는 약 32)" }
        paddingX: $spacing-x1
        background: { value: $color-bg-brand-solid, note: "알약 면은 다크 표면과 Desk · HR 1.73 — 흰 숫자가 정보를 들고 있다(다크 Desk · HR 8.36)" }
      label:
        typography: { value: $text-t1-static, note: "11 / 15 — 글자 크기 설정을 따르지 않는 px(웹 text-t1-static, 앱 TextScaler.noScaling — SEED t1-static). 커지면 아이콘을 덮는다" }
        foreground: { value: $color-static-white, note: "Desk 8.38 · 다크 8.36 · HR 8.17 · 8.36" }
        numerals: { value: tabular-nums, note: "숫자 폭을 같게 — 수가 바뀌어도 흔들리지 않는다" }

  # ── 붙는 자리 ─────────────────────────────────────────
  - when: { attach: icon }
    enabled:
      root:
        position: { value: "absolute — 아이콘 상자 기준", note: "버튼 상자가 아니라 아이콘(24 · 20)의 상자에서 잰다 — 아이콘 크기 · 버튼 높이를 바꾸지 않는다. 점 · 숫자의 자리는 크기마다 아래 조합 규칙" }
  - when: { size: small, attach: icon }
    enabled:
      root:
        top: { value: 1px, note: "아이콘 상자 위에서 1 — 24 아이콘이면 y 1 ~ 7" }
        right: { value: 1px, note: "아이콘 상자 오른쪽에서 1 — 24 아이콘이면 x 17 ~ 23. 아이콘 안쪽에 놓인다(SEED: top 7 · right 7 + translate(100%, −100%))" }
  - when: { size: large, attach: icon }
    enabled:
      root:
        position: { value: "absolute — 왼쪽 아래 꼭짓점 = (아이콘 폭 − 8, 14)", note: "24 아이콘이면 (16, 14) — left 16 · top −4. 위 · 오른쪽으로 튀어나와 숫자가 길수록 오른쪽으로 자란다(SEED: top 14 · right 8 + translate(100%, −100%)). 한 자리면 아이콘 버튼 44 안, 두 자리 · 99+ 는 버튼 밖으로 나간다" }
  - when: { attach: text }
    enabled:
      root:
        position: { value: "absolute — 글 끝 + 2 · 줄 상자 위 끝", note: "글 상자 기준 — 마지막 글자 뒤 2, 위는 글 줄 상자의 위 끝(글자 상자보다 1 위). 탭 · 칸 폭과 줄 높이를 바꾸지 않는다(SEED: right −2 + translate(100%, 0)). Chip Tabs 만 칩 안 글 뒤 6 · 세로 가운데 흐름(chip-tabs.yaml)" }
        gap: { value: 2px, note: "글 끝 ↔ 점 · 알약" }

