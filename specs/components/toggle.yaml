# Toggle 의 수치 원본입니다. 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md 를 따릅니다.
#
# 단추 하나가 한 상태를 그 자리에서 켜고 끄는 아이콘 단추입니다(<button aria-pressed>) — 관심 등록(별) · App Key 보기(눈).
# 이름은 고정이고 켬은 aria-pressed 로 알립니다. 바탕은 켬 · 끔에 따라 바뀌지 않고 아이콘만 바뀝니다 —
# 켬 = 진한 색(fg-neutral) + 선 2.5, 끔 = 흐린 색(fg-neutral-muted) + 선 2. 아이콘은 지금 상태를 그립니다 — 기능 단추(눈 · 종)는
# lucide -off 짝을 쓰고, 모으기 단추(관심 · 고정)는 사선 없이 같은 아이콘입니다. 순자산 카드의 금액 가리기 눈은 Toggle 이 아니라
# 이 상자 · 표면 색(inverted)만 빌린, 설정으로 가는 버튼입니다(aria-pressed 없음).
#
# 축 — toggled(끔 · 켬) · tone(표면 위 · 브랜드 채움 위). 크기는 하나입니다 — 보이는 40 · 누르는 44 · 아이콘 20.
# 상단 바 안에 둘 때는 Top Navigation 의 아이콘 버튼(상자 44 · 아이콘 24, top-navigation.yaml iconButton)을 쓰고,
# 끔도 fg-neutral 입니다 — 굵기 · 아이콘으로만 구분합니다.

name: Toggle

slots:
  root: 단추 — 보이는 40 · 누르는 44. 바탕은 켬 · 끔에 따라 바뀌지 않음(누름 · 호버에만 칠함)
  icon: 아이콘 20 — 지금 상태(키 보기는 가렸으면 eye-off, 모으기 단추는 같은 아이콘)
  focusRing: 키보드 포커스 링

variants:
  toggled:
    "off": 끔 — aria-pressed="false". 흐린 색 + 선 2(기본)
    "on": 켬 — aria-pressed="true". 진한 색 + 선 2.5
  tone:
    default: 흰 표면 · 카드 · 시트 위(기본)
    inverted: 브랜드 채움 위 — 아이콘은 켬 · 끔 모두 흰색, 모양 · 굵기로 구분. 순자산 카드의 금액 가리기 눈(설정으로 가는 버튼 — Toggle 이 아님)이 이 상자 · 색을 빌림

defaults:
  toggled: "off"
  tone: default

states:
  enabled: 기본
  hovered: 웹 — 누름과 같은 바탕, 축소 없음
  focused: 키보드 포커스에만 링
  pressed: 누름 바탕 + 단추 전체 2px 거리 축소 — 켬 · 끔은 손을 뗄 때 바뀜
  disabled: 전용 색 — 아이콘만 fg-disabled, Tab 순서에서 빠짐

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      root:
        size: { value: 40px, note: "Button medium · iconOnly 의 보이는 상자와 같습니다(기초 Iconography — 아이콘 버튼은 보이는 40)" }
        radius: { value: $radius-r2, note: "누름 · 호버 바탕에만 보입니다(Button medium 과 같습니다)" }
        background: { value: transparent, note: "켬 · 끔에 따라 바뀌지 않습니다 — 켜도 옅은 바탕 · 반전 상자를 깔지 않습니다" }
        touchTarget: { value: 44 × 44, note: "보이는 40 둘레로 2 씩 넓힙니다. AA ✓ · AAA ✓" }
        cursor: pointer
        name: { value: 고정, note: "aria-label 은 상태마다 바꾸지 않습니다(\"관심 등록\" · \"App Key 보기\") — 켬은 aria-pressed 로 알립니다(APG). 이름과 아이콘의 뜻이 반대로 읽히지 않게 아이콘은 지금 상태를 그립니다. 설정으로 가는 금액 가리기 눈은 aria-pressed 없이 \"금액 가리기 설정\" 입니다" }
        transitionProperty: background-color
        transitionDuration: $motion-duration-color-transition
        transitionEasing: $motion-ease-easing
      icon:
        size: { value: 20px, note: "lucide 선 아이콘 — UI 아이콘 16 · 20 · 24 의 가운데 단계" }
    hovered:
      root:
        background: $color-bg-layer-default-pressed
    pressed:
      root:
        background: { value: $color-bg-layer-default-pressed, note: "불투명한 누름 바탕 — 켬 · 끔 같은 색" }
        scale: { value: 단추 전체 2px 거리 축소, note: "기준 40 — Feedback 의 눌림 피드백. 모션 줄이기에서는 하지 않습니다" }
        scaleDuration: $motion-duration-pressed-scale
        scaleEasing: $motion-ease-pressed-scale
    focused:
      focusRing:
        width: 2px
        offset: { value: 2px, note: "보이는 40 바깥 — 키보드 포커스에만 그립니다" }
        color: $color-stroke-focus-ring
    disabled:
      root:
        cursor: { value: not-allowed, note: "누름 바탕 · 축소가 없습니다" }
      icon:
        color: { value: $color-fg-disabled, note: "켬 · 끔 모두 — 켬은 선 2.5 를 그대로 둬 무엇이 켜져 있었는지 보입니다" }

  # ── 끔 · 켬 ───────────────────────────────────────────
  - when: { toggled: "off" }
    enabled:
      icon:
        strokeWidth: { value: 2px, note: "lucide 기본 굵기" }
        color: { value: $color-fg-neutral-muted, note: "흰 표면 위 7.11 · 다크 7.70 — 끔도 불투명도로 흐리게 하지 않습니다. 모으기 단추(관심 · 고정)는 사선 없는 같은 아이콘, 기능 단추(눈 · 종)는 지금 상태의 아이콘(-off 짝)입니다. 상단 바 안에서는 끔도 fg-neutral 입니다" }
  - when: { toggled: "on" }
    enabled:
      icon:
        strokeWidth: { value: 2.5px, note: "켜짐 · 선택은 선 2.5 입니다. 앱은 코드로 선 굵기를 정할 수 없어 lucide 굵기 글꼴 Lucide500 짝으로 냅니다" }
        color: { value: $color-fg-neutral, note: "흰 표면 위 16.41 · 다크 13.42 — 끔(7.11 · 7.70)보다 짙습니다. 브랜드 색으로 칠하지 않습니다" }

  # ── 브랜드 채움 위 ────────────────────────────────────
  - when: { tone: inverted }
    enabled:
      icon:
        color: { value: $color-static-white, note: "켬 · 끔 모두 흰색 — 순자산 카드 그라디언트 위 Desk 8.38 ~ 14.78 · 다크 8.36 ~ 11.25(장식 빛 위 가장 낮은 자리 4.88). 켬 · 끔은 아이콘 모양과 굵기(2.5 · 2)로 구분합니다. 금액 가리기 눈(설정으로 가는 버튼)은 aria-pressed 가 없어 선 2 그대로이고, eye · eye-off 모양만 바뀝니다" }
    hovered:
      root:
        background: { value: transparent, note: "브랜드 채움에는 누름 색 짝이 없어 축소만 합니다(Card 의 순자산 카드와 같습니다)" }
    pressed:
      root:
        background: { value: transparent, note: "축소만 합니다 — 바탕은 칠하지 않습니다" }
    focused:
      focusRing:
        color: { value: $color-static-white, note: "브랜드 채움 위 — stroke-focus-ring(#0147AD)은 채움(#0147AD → brand-900)에 묻힙니다(라이트 1.00). 흰 링은 아이콘과 같은 8.38 ~ 14.78 입니다" }

motion:
  "누름 · 호버 — 바탕":
    duration: $motion-duration-color-transition
    easing: $motion-ease-easing
    properties: [background-color]
  "누름 — 단추":
    duration: $motion-duration-pressed-scale
    easing: $motion-ease-pressed-scale
    properties: [scale]
    note: "단추 전체 2px 거리 축소 — 모션 줄이기에서는 하지 않습니다"
  "켬 ↔ 끔 — 아이콘":
    duration: 0ms
    properties: [icon, stroke-width, color]
    note: "아이콘 · 굵기 · 색은 손을 뗄 때 바로 바뀝니다(요청을 기다리지 않습니다)"
