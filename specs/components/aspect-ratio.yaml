# Aspect Ratio 의 수치 원본 — 구조는 SEED Aspect Ratio(React 레이아웃 상자 — 2026-10-04 사용자 결정, 이미지 비교 페이지 "따라오는 것").
# 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md. 옛 Aspect Ratio(Radix · 권장 비율 16:9 · 4:3 · 1:1 · 3:4 · 21:9 · 2:1 · 자식 모서리 md 8)는
# aspect-ratio.history/v-pre-seed-image.* 다.
#
# 폭이 정해지면 비율로 높이가 정해지는 상자 하나 — 모서리 · 윤곽 · 바탕 · 불러오는 동안 · 대체 그림이 없다. 자식 하나가 상자를 채운다.
# 그림(사진 · 카드 그림 · 규정 그림)은 이것이 아니라 Image Frame 이다(그 안의 비율 상자가 이것). 이것은 그림이 아닌 것 — 동영상 · 지도 ·
# 바깥 페이지(iframe) · 차트처럼 비율만 지키면 되는 자리 — 에 쓴다.
# 비율은 Image Frame 과 같은 여덟 가지(SEED 일곱 + 카드 1.586), 기본 4:3. 옛 3:4 · 21:9 는 걷었다.
# 비율 값은 모두 "W / H" 글로 적는다 — 브라우저가 계산값으로 쓰는 꼴(getComputedStyle 의 aspect-ratio)이라 검사기가 글 그대로 맞추고,
# 앱은 "/" 로 나눠 W ÷ H 를 쓴다. 숫자(1 · 1.586)와 "16 / 9" 가 섞이면 한 가지 재는 법으로 다 잴 수 없다(2026-10-08).
#
# SEED 와 다른 자리(aspect-ratio.md 의 "SEED 와 다른 점")
#   - 비율을 여덟 가지로 묶는다 — SEED React 는 아무 숫자나 받는다.
#   - 카드 1.586 을 더한다(groo).

name: AspectRatio

slots:
  root: 비율 상자 — 폭은 부모, 높이는 폭 ÷ 비율. 모서리 · 테두리 · 바탕이 없다
  child: 자식 하나 — 상자를 채운다(absolute · inset 0). 동영상은 cover

variants:
  ratio:
    "1:1": 정사각 — 지도 미리보기 · 정사각 동영상
    "2:1": 넓은 띠
    "16:9": 동영상 · 바깥 페이지(iframe)
    "4:3": 기본(SEED)
    "6:7": 조금 세로
    "4:5": 세로
    "2:3": 긴 세로
    card: 카드 1.586 — 카드 모양 자리(카드 그림이 아닌 것 — 카드 그림은 Image Frame)

defaults:
  ratio: "4:3"

states:
  enabled: 하나뿐 — 상자일 뿐이다(누르지 않는다 · 초점이 서지 않는다)

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      root:
        width: { value: 부모 폭, note: "부모가 폭을 정한다 — 부모 폭이 0 이면 상자도 0" }
        height: { value: 폭 ÷ 비율, note: "웹 CSS aspect-ratio · 앱 AspectRatio — 내용이 오기 전에 자리를 잡는다" }
        radius: { value: 0px, note: "모서리가 없다 — 둥근 그림 틀은 Image Frame" }
        background: { value: transparent, note: "바탕 · 테두리 · 그림자가 없다" }
        overflow: { value: hidden, note: "넘친 자식을 자른다" }
      child:
        inset: { value: 0px, note: "absolute — 상자를 채운다. 자식은 하나" }
        objectFit: { value: cover, note: "img · video — 가운데를 남겨 자른다(SEED). 지도 · iframe 은 상자 크기 그대로" }

  # ── 비율 ──────────────────────────────────────────────
  - when: { ratio: "1:1" }
    enabled: { root: { aspectRatio: "1 / 1" } }
  - when: { ratio: "2:1" }
    enabled: { root: { aspectRatio: "2 / 1" } }
  - when: { ratio: "16:9" }
    enabled: { root: { aspectRatio: { value: "16 / 9", note: "≈ 1.78" } } }
  - when: { ratio: "4:3" }
    enabled: { root: { aspectRatio: { value: "4 / 3", note: "≈ 1.33 — 기본(SEED)" } } }
  - when: { ratio: "6:7" }
    enabled: { root: { aspectRatio: { value: "6 / 7", note: "≈ 0.86" } } }
  - when: { ratio: "4:5" }
    enabled: { root: { aspectRatio: { value: "4 / 5", note: "0.8" } } }
  - when: { ratio: "2:3" }
    enabled: { root: { aspectRatio: { value: "2 / 3", note: "≈ 0.67" } } }
  - when: { ratio: card }
    enabled: { root: { aspectRatio: { value: "1.586 / 1", note: "ISO 카드 85.6 × 53.98" } } }
