# Tree View 의 수치 원본입니다. 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md 를 따릅니다.
#
# 여러 단계로 된 항목 가운데 하나를 고르는 나무입니다 — HR 관리 > 회사 · 부서 사용자의 부서 나무. 고른 항목의 내용은 옆(조직도 · 사용자)에 보입니다.
# 키보드 · 역할은 WAI-ARIA APG Treeview 를 따릅니다. 나무 전체가 Tab 정지점 하나이고(roving tabindex) ↑ ↓ 로 보이는 항목 사이,
# → ← 로 펼치고 접으며(고르지 않습니다) 하위 · 부모로, Home · End 로 옮깁니다. 누르는 자리는 줄 전체입니다 — 잎은 누르면 고르고,
# 부모 줄은 누르면 고르면서 펴고 접습니다(펼친 부모를 고르면 하위가 접힙니다). Enter · Space 는 누르기와 같고, 꺾쇠는 표시만 합니다.
# 노드의 동작(추가 · 수정 · 삭제)은 나무 밖 ⋮ 하나가 고른 항목에 겁니다. 긴 이름은 줄을 바꿉니다.
#
# 줄의 값은 Side Navigation 항목(side-navigation.yaml — 44 · 패널 가장자리 8 · 모서리 10 · 14 / 19 · 지금 항목 bg-neutral-weak-pressed)과
# List 의 누름(바탕 bg-layer-default-pressed + 콘텐츠만 2px)을 씁니다. 나무는 250 남짓한 패널(1280 본문 992 의 25% = 248 — resizable.yaml)
# 안의 탐색 목록이라 같은 자리의 사이드바 줄과 같은 크기입니다.
#
# 축 — selected(고름) · expand(하위 없음 · 접힘 · 펼침) · mode(접고 펴는 나무 · 늘 펼친 나무). 누름 · 호버 · 포커스와 곱해지므로
# 상태가 아니라 축으로 둡니다.

name: TreeView

slots:
  root: 나무(role=tree) — 이름 필수. Tab 정지점 하나
  item: 항목(role=treeitem) — 줄 + 하위 묶음. 단계 · 위치 · 펼침 · 고름을 알린다
  row: 항목 줄 — 바탕 · 단계 들임. 줄 전체가 누르는 자리 — 고른다(부모는 고르면서 펴고 접는다)
  content: 줄의 콘텐츠 층 — 꺾쇠 · 아이콘 · 이름. 누르면 이 층만 준다
  chevron: 펼침 꺾쇠 — 하위가 있는 항목만. 표시만(따로 누르는 자리가 없다 — 누르면 줄을 누른 것과 같다)
  icon: 앞 아이콘 — 있을 때만(부서는 building-2). 장식
  label: 이름 — 늘 줄을 바꾼다
  group: 하위 묶음(role=group) — 펼치고 접힌다
  header: 패널 머리 — 나무의 이름(제목) + 고른 항목의 ⋮. 나무 위 한 줄
  title: 패널 머리 제목 — 나무의 이름("부서")
  moreButton: 고른 항목의 동작 ⋮ — 나무 밖(패널 머리) 하나
  focusRing: 키보드 포커스 링(웹) — 줄 안쪽

variants:
  selected:
    none: 고르지 않은 항목(기본)
    selected: 고른 항목 — 한 번에 하나
  expand:
    collapsed: 하위가 있고 접힘 — 꺾쇠 오른쪽(기본)
    expanded: 하위가 있고 펼침 — 꺾쇠 아래, 하위 묶음이 보인다
    leaf: 하위가 없는 항목 — 꺾쇠 자리를 같은 폭으로 비운다
  mode:
    foldable: 접고 펴는 나무 — 꺾쇠로 하위를 접는다(기본 — HR 관리 > 회사)
    fixed: 늘 펼친 나무 — 꺾쇠 · 꺾쇠 칸 · 펼침 상태가 없다(부서 사용자 — 레시피 collapsible={false})

defaults:
  selected: none
  expand: collapsed
  mode: foldable

states:
  enabled: 기본
  hovered: 웹 — 누름과 같은 바탕, 축소 없음
  focused: 웹 — 키보드 포커스에만 줄 안쪽 링
  pressed: 바탕 + 콘텐츠만 2px 거리 축소

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      root:
        paddingX: { value: $spacing-x2, note: "패널 가장자리 ↔ 줄 바탕 8 — Side Navigation 내용과 같습니다" }
        paddingBottom: { value: $spacing-x4, note: "마지막 줄 아래 16 — 패널 끝까지 스크롤할 때의 여백입니다" }
        name: { value: 필수, note: "aria-label(\"부서\") 또는 aria-labelledby(패널 제목) — 한 번에 하나만 고릅니다(aria-multiselectable 없음)" }
        keyboard: { value: "↑ ↓ · → ← · Home · End · Enter · Space", note: "나무 전체가 Tab 정지점 하나입니다(roving tabindex) — APG Treeview. → ← 는 펴고 접기만 하고(고르지 않습니다), Enter · Space 는 누르기와 같습니다(부모는 고르면서 펴고 접습니다 — APG 의 \"부모 노드의 기본 동작은 열고 닫기일 수 있다\"). 글자로 찾기 · * 는 두지 않습니다" }
      row:
        minHeight: { value: 44px, note: "한 줄 — Side Navigation 항목과 같습니다. 이름이 줄을 바꾸면 늘어납니다. AA ✓ · AAA ✓" }
        paddingY: { value: $spacing-x3, note: "이름 첫 줄 19 위아래 12 — 한 줄이면 43 이라 최소 높이 44 가 적용됩니다(Side Navigation 항목과 같습니다)" }
        paddingLeft: { value: $spacing-x2, note: "1단계 — 단계마다 indent 를 더합니다" }
        paddingRight: $spacing-x2
        indent: { value: $spacing-x5, note: "단계마다 20 — 줄 왼쪽 여백 = 8 + (단계 − 1) × 20. 하위 꺾쇠가 부모 꺾쇠 · 아이콘 사이에 섭니다" }
        radius: { value: $radius-r2_5, note: "Side Navigation 항목 · List 누름 바탕과 같은 10 입니다" }
        background: transparent
        cursor: pointer
        touchTarget: { value: 줄 전체, note: "줄 폭 × 44 이상 — 부모 줄도 줄 전체가 하나의 누르는 자리입니다. 꺾쇠에 따로 누르는 자리를 두지 않습니다. AA ✓ · AAA ✓" }
        transitionProperty: background-color
        transitionDuration: $motion-duration-color-transition
        transitionEasing: $motion-ease-easing
      content:
        gap: { value: $spacing-x1_5, note: "꺾쇠 ↔ 아이콘 ↔ 이름 사이 6" }
        alignItems: { value: flex-start, note: "이름이 여러 줄이면 꺾쇠 · 아이콘은 첫 줄에 맞춥니다" }
        transitionProperty: scale
        transitionDuration: $motion-duration-pressed-scale
        transitionEasing: $motion-ease-pressed-scale
      chevron:
        width: { value: 20px, note: "꺾쇠 칸 — 하위가 없는 항목은 같은 폭을 비워 둡니다" }
        height: { value: 19px, note: "이름 첫 줄 높이(t4 19)에 맞춥니다" }
        iconSize: { value: 16px, note: "lucide chevron-right — 접혀 있으면 오른쪽, 펼치면 아래를 가리킵니다" }
        color: { value: $color-fg-neutral-subtle, note: "면 위 5.50 · 다크 6.09" }
        rotate: 0deg
        touchTarget: { value: 없음, note: "표시만 합니다 — 누르면 줄을 누른 것과 같습니다. 꺾쇠만 누르는 자리 · 꺾쇠 칸을 넓힌 누르는 자리를 따로 두지 않습니다" }
        transitionProperty: rotate
        transitionDuration: $motion-duration-d6
        transitionEasing: $motion-ease-easing
      icon:
        size: { value: 16px, note: "lucide building-2(부서) — 장식이라 보조 기술에 숨깁니다" }
        height: { value: 19px, note: "이름 첫 줄에 맞춥니다" }
        color: $color-fg-neutral-subtle
      label:
        typography: { value: $text-t4, note: "14 / 19 — Side Navigation 항목과 같은 글자입니다" }
        fontWeight: 400
        foreground: { value: $color-fg-neutral, note: "면 위 16.41 · 다크 13.42 · 고른 바탕 위 14.26 · 8.62" }
        lineClamp: { value: none, note: "긴 이름은 줄을 바꿉니다 — 말줄임 · title 을 쓰지 않습니다" }
      group:
        display: { value: 숨김, note: "접힌 하위는 그리지 않습니다 — 보조 기술도 읽지 않습니다" }
      header:
        alignItems: center
        justifyContent: space-between
        gap: $spacing-x2
        paddingTop: $spacing-x3
        paddingRight: { value: $spacing-x2, note: "⋮ 가 패널 끝에 붙습니다" }
        paddingBottom: $spacing-x2
        paddingLeft: { value: $spacing-x4, note: "16 — 나무 줄의 글 시작(8 + 8)과 같은 자리입니다" }
      title:
        typography: { value: $text-t5, note: "16 / 22 — 구역 · 카드 머리 제목과 한 벌입니다" }
        fontWeight: 700
        foreground: $color-fg-neutral
      moreButton:
        size: { value: 40px, note: "Button ghost · iconOnly · medium — 패널 머리 오른쪽에 둡니다" }
        iconSize: { value: 18px, note: "lucide ellipsis-vertical" }
        touchTarget: { value: 44 × 44, note: "보이는 40 바깥으로 2 씩 넓힙니다. AA ✓ · AAA ✓" }
        name: { value: "{고른 항목} 더보기", note: "고른 부서가 바뀌면 이름도 바뀝니다 — 노드마다 단추를 두지 않습니다(단추 안 단추 금지)" }
        position: { value: 나무 밖 하나, note: "1280 이상 Menu · 미만 Menu Sheet(menu.md)로 엽니다 — 추가 · 수정 · 삭제" }
    hovered:
      row:
        background: { value: $color-bg-layer-default-pressed, note: "Side Navigation 항목 · List 와 같습니다" }
    pressed:
      row:
        background: $color-bg-layer-default-pressed
      content:
        scale: { value: 2px 거리 축소, note: "콘텐츠 층(꺾쇠 · 아이콘 · 이름)만 줄입니다. 모션 줄이기에서는 하지 않습니다" }
    focused:
      focusRing:
        width: 2px
        offset: { value: -2px, note: "줄 안쪽에 그려 붙은 줄 · 패널 끝에 걸리지 않습니다" }
        radius: { value: $radius-r2_5, note: "줄 모서리와 같은 10" }
        color: $color-stroke-focus-ring

  # ── 고름 ──────────────────────────────────────────────
  - when: { selected: selected }
    enabled:
      row:
        background: { value: $color-bg-neutral-weak-pressed, note: "Side Navigation 지금 항목과 같은 색 — 면 위 1.15 · 다크 1.56. 고른 부서는 옆 패널의 제목으로도 보입니다" }
    hovered:
      row:
        background: { value: $color-bg-neutral-weak-pressed, note: "바탕 그대로 — 고른 바탕보다 짙은 불투명 역할이 없습니다" }
    pressed:
      row:
        background: { value: $color-bg-neutral-weak-pressed, note: "바탕 그대로 — 콘텐츠만 2px 축소합니다" }

  # ── 펼침 · 누르기 ─────────────────────────────────────
  - when: { expand: collapsed }
    enabled:
      row:
        press: { value: 고르며 편다, note: "접힌 부모 줄 — 누르면(마우스 · 터치 · Enter · Space) 그 항목을 고르면서 하위를 폅니다. 꺾쇠를 눌러도 같습니다" }
  - when: { expand: expanded }
    enabled:
      row:
        press: { value: 고르며 접는다, note: "펼친 부모를 누르면 고르면서 하위가 접힙니다. 편 채 두려면 한 번 더 누르거나 → 로 폅니다" }
      chevron:
        rotate: { value: 90deg, note: "아래를 가리킵니다 — 하위 묶음이 펼쳐진 상태입니다" }
      group:
        display: 보임
  - when: { expand: leaf }
    enabled:
      row:
        press: { value: 고른다, note: "하위가 없는 항목 — 고르기만 합니다" }
      chevron:
        display: { value: 빈 자리, note: "같은 폭 20 — 같은 단계의 이름이 같은 자리에 섭니다. aria-expanded 를 두지 않습니다" }

  # ── 늘 펼친 나무 ──────────────────────────────────────
  - when: { mode: fixed }
    enabled:
      row:
        press: { value: 고른다, note: "늘 펼친 나무 — 부모 줄도 누르면 고르기만 합니다(접히지 않습니다)" }
      chevron:
        display: { value: none, note: "꺾쇠를 그리지 않고 칸도 뺍니다 — 들임만으로 단계를 보입니다. 접히지 않는데 꺾쇠 · \"펼쳐짐\" 이 남으면 누를 수 있는 것처럼 보입니다" }
        width: { value: 0px, note: "아이콘이 줄 왼쪽 여백 바로 뒤에 섭니다" }
      group:
        display: { value: 보임, note: "늘 펼칩니다 — aria-expanded 를 두지 않고, → 는 첫 하위로 · ← 는 부모로 옮기기만 합니다" }

motion:
  "꺾쇠 — 회전":
    duration: $motion-duration-d6
    easing: $motion-ease-easing
    properties: [rotate]
    note: "0 → 90° — 모션 줄이기에서는 바로 바뀝니다"
  "하위 묶음 — 펼침 · 접힘":
    duration: $motion-duration-d6
    easing: $motion-ease-easing
    properties: [height]
    note: "Accordion 과 같은 300ms 입니다 — 펼쳐도 초점은 그 항목에 그대로 둡니다"
  "모션 줄이기 — 펼침 · 접힘":
    duration: $motion-duration-d3
    easing: $motion-ease-easing
    properties: [opacity]
    note: "높이를 움직이지 않고 150ms 동안 서서히 나타나고 사라집니다"
  "누름 · 호버 — 바탕":
    duration: $motion-duration-color-transition
    easing: $motion-ease-easing
    properties: [background-color]
  "누름 — 콘텐츠":
    duration: $motion-duration-pressed-scale
    easing: $motion-ease-pressed-scale
    properties: [scale]
    note: "모션 줄이기에서는 하지 않습니다"
