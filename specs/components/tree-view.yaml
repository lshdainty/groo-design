# Tree View 의 수치 원본 — WAI-ARIA APG Treeview(2026-10-10 사용자 결정, 펼치고 접기 · 나누기 비교 페이지 8A · 10A · 3A · 16D).
# 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 여러 단계로 된 항목 가운데 하나를 고르는 나무 — HR 관리 > 회사 · 부서 사용자의 부서 나무. 고른 항목의 내용은 옆(조직도 · 사용자)에 보인다.
# 나무 전체가 Tab 정지점 하나이고(roving tabindex) ↑ ↓ 로 보이는 항목 사이, → ← 로 펼치고 접으며(고르지 않는다) 하위 · 부모로,
# Home · End. 누르는 자리는 줄 전체다(16D — SEED Accordion "터치 영역은 Chevron 아이콘뿐만 아니라 Trigger 전체") — 잎은 누르면
# 고르고, 부모 줄은 누르면 고르면서 펴고 접는다(펼친 부모를 고르면 하위가 접힌다). Enter · Space 는 누르기와 같다. 꺾쇠는 표시만이다.
# 노드의 동작(추가 · 수정 · 삭제)은 나무 밖 ⋮ 하나가 고른 항목에 건다. 긴 이름은 줄을 바꾼다.
#
# 줄의 값은 Side Navigation 항목(side-navigation.yaml — 44 · 패널 가장자리 8 · 모서리 10 · 14 / 19 · 지금 항목 bg-neutral-weak-pressed)과
# List 의 누름(바탕 bg-layer-default-pressed + 콘텐츠만 2px)을 쓴다 — 나무는 250 남짓한 패널(1280 본문 992 의 25% = 248 — resizable.yaml) 안의 탐색 목록이라 같은 자리의
# 사이드바 줄과 같은 크기다. 단계 들임 20 · 꺾쇠 16 은 비교 페이지 8A 그림의 값이다.
#
# 축 — selected(고름) · expand(하위 없음 · 접힘 · 펼침) · mode(접고 펴는 나무 · 늘 펼친 나무). 누름 · 호버 · 포커스와 곱해지므로
# 상태가 아니라 축이다.
#
# SEED 와 다른 자리(tree-view.md 의 "SEED 와 다른 점")
#   - SEED 에는 나무가 없다 — Accordion 은 중첩 · 고르기를 다루지 않는다. 키보드 · 역할은 APG Treeview, 줄의 값은 porest 의
#     Side Navigation · List 값이다.
#   - 줄 전체가 누르는 자리인 것은 SEED Accordion 의 트리거 규칙을 옮겼다(16D) — 다만 나무 줄은 고르기도 한다.

name: TreeView

slots:
  root: 나무(role=tree) — 이름 필수. Tab 정지점 하나
  item: 항목(role=treeitem) — 줄 + 하위 묶음. 단계 · 위치 · 펼침 · 고름을 알린다
  row: 항목 줄 — 바탕 · 단계 들임. 줄 전체가 누르는 자리 — 고른다(부모는 고르면서 펴고 접는다)
  content: 줄의 콘텐츠 층 — 꺾쇠 · 아이콘 · 이름. 누르면 이 층만 준다
  chevron: 펼침 꺾쇠 — 하위가 있는 항목만. 표시만(따로 누르는 자리가 없다 — 누르면 줄을 누른 것과 같다)
  icon: 앞 아이콘 — 있을 때만(부서는 building-2). 장식
  label: 이름 — 늘 줄을 바꾼다
  group: 하위 묶음(role=group) — 펼치고 접힌다
  header: 패널 머리 — 나무의 이름(제목) + 고른 항목의 ⋮. 나무 위 한 줄
  title: 패널 머리 제목 — 나무의 이름("부서")
  moreButton: 고른 항목의 동작 ⋮ — 나무 밖(패널 머리) 하나
  focusRing: 키보드 포커스 링(웹) — 줄 안쪽

variants:
  selected:
    none: 고르지 않은 항목(기본)
    selected: 고른 항목 — 한 번에 하나
  expand:
    collapsed: 하위가 있고 접힘 — 꺾쇠 오른쪽(기본)
    expanded: 하위가 있고 펼침 — 꺾쇠 아래, 하위 묶음이 보인다
    leaf: 하위가 없는 항목 — 꺾쇠 자리를 같은 폭으로 비운다
  mode:
    foldable: 접고 펴는 나무 — 꺾쇠로 하위를 접는다(기본 — HR 관리 > 회사)
    fixed: 늘 펼친 나무 — 꺾쇠 · 꺾쇠 칸 · 펼침 상태가 없다(부서 사용자 — 레시피 collapsible={false})

defaults:
  selected: none
  expand: collapsed
  mode: foldable

states:
  enabled: 기본
  hovered: 웹 — 누름과 같은 바탕(v106), 축소 없음
  focused: 웹 — 키보드 포커스에만 줄 안쪽 링
  pressed: 바탕 + 콘텐츠만 2px 거리 축소(v104)

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      root:
        paddingX: { value: $spacing-x2, note: "패널 가장자리 ↔ 줄 바탕 8 — Side Navigation 내용과 같다" }
        paddingBottom: { value: $spacing-x4, note: "마지막 줄 아래 16 — 패널 끝까지 스크롤할 때" }
        name: { value: 필수, note: "aria-label(\"부서\") 또는 aria-labelledby(패널 제목) — 고른 항목 하나(aria-multiselectable 없음)" }
        keyboard: { value: "↑ ↓ · → ← · Home · End · Enter · Space", note: "나무 전체가 Tab 정지점 하나(roving tabindex) — APG Treeview. → ← 는 펴고 접기만(고르지 않는다), Enter · Space 는 누르기와 같다(부모는 고르면서 펴고 접는다 — APG 의 \"부모 노드의 기본 동작은 열고 닫기일 수 있다\"). 글자로 찾기 · * 는 두지 않는다" }
      row:
        minHeight: { value: 44px, note: "한 줄 — Side Navigation 항목과 같다. 이름이 줄을 바꾸면 늘어난다. AA ✓ · AAA ✓" }
        paddingY: { value: $spacing-x3, note: "이름 첫 줄 19 위아래 12 — 한 줄이면 43 이라 최소 높이 44 가 이긴다(Side Navigation 항목과 같다)" }
        paddingLeft: { value: $spacing-x2, note: "1단계 — 단계마다 indent 를 더한다" }
        paddingRight: $spacing-x2
        indent: { value: $spacing-x5, note: "단계마다 20 — 줄 왼쪽 여백 = 8 + (단계 − 1) × 20. 하위 꺾쇠가 부모 꺾쇠 · 아이콘 사이에 선다(비교 페이지 8A)" }
        radius: { value: $radius-r2_5, note: "Side Navigation 항목 · List 누름 바탕과 같은 10" }
        background: transparent
        cursor: pointer
        touchTarget: { value: 줄 전체, note: "줄 폭 × 44 이상 — 부모 줄도 줄 전체가 하나의 누르는 자리다(사용자 결정 16D). 꺾쇠에 따로 누르는 자리를 두지 않는다. AA ✓ · AAA ✓" }
        transitionProperty: background-color
        transitionDuration: $motion-duration-color-transition
        transitionEasing: $motion-ease-easing
      content:
        gap: { value: $spacing-x1_5, note: "꺾쇠 ↔ 아이콘 ↔ 이름 6" }
        alignItems: { value: flex-start, note: "이름이 여러 줄이면 꺾쇠 · 아이콘은 첫 줄에 맞춘다" }
        transitionProperty: scale
        transitionDuration: $motion-duration-pressed-scale
        transitionEasing: $motion-ease-pressed-scale
      chevron:
        width: { value: 20px, note: "꺾쇠 칸 — 하위가 없는 항목은 같은 폭의 빈 자리" }
        height: { value: 19px, note: "이름 첫 줄 높이(t4 19)에 맞춘다" }
        iconSize: { value: 16px, note: "lucide chevron-right — 접혀 있으면 오른쪽, 펼치면 아래" }
        color: { value: $color-fg-neutral-subtle, note: "면 위 5.50 · 다크 6.09 — 지금 HR #B9B9B9 는 1.88" }
        rotate: 0deg
        touchTarget: { value: 없음, note: "표시만 — 누르면 줄을 누른 것과 같다(사용자 결정 16D). 꺾쇠만 누르는 31 × 44(16A) · 꺾쇠 칸 44(16B) · 들임 빈 자리로 44(16C)는 고르지 않았다" }
        transitionProperty: rotate
        transitionDuration: $motion-duration-d6
        transitionEasing: $motion-ease-easing
      icon:
        size: { value: 16px, note: "lucide building-2(부서) — 장식이라 보조 기술에 숨긴다" }
        height: { value: 19px, note: "이름 첫 줄에 맞춘다" }
        color: $color-fg-neutral-subtle
      label:
        typography: { value: $text-t4, note: "14 / 19 — Side Navigation 항목 글자" }
        fontWeight: 400
        foreground: { value: $color-fg-neutral, note: "면 위 16.41 · 다크 13.42 · 고른 바탕 위 14.26 · 8.62" }
        lineClamp: { value: none, note: "긴 이름은 줄을 바꾼다 — 말줄임 · title 없음(사용자 결정 8A · 10A)" }
      group:
        display: { value: 숨김, note: "접힌 하위는 그리지 않는다 — 보조 기술도 읽지 않는다" }
      header:
        alignItems: center
        justifyContent: space-between
        gap: $spacing-x2
        paddingTop: $spacing-x3
        paddingRight: { value: $spacing-x2, note: "⋮ 가 패널 끝에 붙는다" }
        paddingBottom: $spacing-x2
        paddingLeft: { value: $spacing-x4, note: "16 — 나무 줄의 글 시작(8 + 8)과 같은 자리" }
      title:
        typography: { value: $text-t5, note: "16 / 22 — 구역 · 카드 머리 제목과 한 벌(2026-10-16 사용자 결정 글자 역할 D3, 전 t6 18 / 24)" }
        fontWeight: 700
        foreground: $color-fg-neutral
      moreButton:
        size: { value: 40px, note: "Button ghost · iconOnly · medium — 패널 머리 오른쪽" }
        iconSize: { value: 18px, note: "lucide ellipsis-vertical" }
        touchTarget: { value: 44 × 44, note: "보이는 40 바깥으로 2 씩. AA ✓ · AAA ✓" }
        name: { value: "{고른 항목} 더보기", note: "고른 부서가 바뀌면 이름도 바뀐다 — 노드마다 단추를 두지 않는다(단추 안 단추 금지)" }
        position: { value: 나무 밖 하나, note: "1280 이상 Menu · 미만 Menu Sheet(menu.md) — 추가 · 수정 · 삭제" }
    hovered:
      row:
        background: { value: $color-bg-layer-default-pressed, note: "Side Navigation 항목 · List 와 같다" }
    pressed:
      row:
        background: $color-bg-layer-default-pressed
      content:
        scale: { value: 2px 거리 축소, note: "콘텐츠 층만 — 꺾쇠 · 아이콘 · 이름(v104). 모션 줄이기면 하지 않는다" }
    focused:
      focusRing:
        width: 2px
        offset: { value: -2px, note: "줄 안쪽 — 붙은 줄 · 패널 끝에 걸리지 않는다" }
        radius: { value: $radius-r2_5, note: "줄 모서리 10" }
        color: $color-stroke-focus-ring

  # ── 고름 ──────────────────────────────────────────────
  - when: { selected: selected }
    enabled:
      row:
        background: { value: $color-bg-neutral-weak-pressed, note: "Side Navigation 지금 항목과 같은 색(사용자 결정 2026-10-08) — 면 위 1.15 · 다크 1.56. 고른 부서는 옆 패널의 제목으로도 보인다" }
    hovered:
      row:
        background: { value: $color-bg-neutral-weak-pressed, note: "바탕 그대로 — 고른 바탕보다 짙은 불투명 역할이 없다" }
    pressed:
      row:
        background: { value: $color-bg-neutral-weak-pressed, note: "바탕 그대로 — 콘텐츠의 2px 축소만" }

  # ── 펼침 · 누르기 ─────────────────────────────────────
  - when: { expand: collapsed }
    enabled:
      row:
        press: { value: 고르며 편다, note: "접힌 부모 줄 — 누르면(마우스 · 터치 · Enter · Space) 그 항목을 고르면서 하위를 편다(사용자 결정 16D). 꺾쇠를 눌러도 같다" }
  - when: { expand: expanded }
    enabled:
      row:
        press: { value: 고르며 접는다, note: "펼친 부모를 누르면 고르면서 하위가 접힌다 — 사용자가 알고 골랐다(16D). 편 채 두려면 한 번 더 누르거나 → 로 편다" }
      chevron:
        rotate: { value: 90deg, note: "아래로 — 하위 묶음이 펼쳐졌다" }
      group:
        display: 보임
  - when: { expand: leaf }
    enabled:
      row:
        press: { value: 고른다, note: "하위가 없는 항목 — 고르기만" }
      chevron:
        display: { value: 빈 자리, note: "같은 폭 20 — 같은 단계의 이름이 같은 자리에 선다. aria-expanded 를 두지 않는다" }

  # ── 늘 펼친 나무 ──────────────────────────────────────
  - when: { mode: fixed }
    enabled:
      row:
        press: { value: 고른다, note: "늘 펼친 나무 — 부모 줄도 누르면 고르기만 한다(접히지 않는다)" }
      chevron:
        display: { value: none, note: "꺾쇠를 그리지 않고 칸도 뺀다 — 들임만으로 단계를 보인다. 접히지 않는데 꺾쇠 · \"펼쳐짐\" 이 남으면 누를 수 있는 것처럼 보인다" }
        width: { value: 0px, note: "아이콘이 줄 왼쪽 여백 바로 뒤에 선다" }
      group:
        display: { value: 보임, note: "늘 펼친다 — aria-expanded 를 두지 않고, → 는 첫 하위로 · ← 는 부모로 옮기기만 한다" }

motion:
  "꺾쇠 — 회전":
    duration: $motion-duration-d6
    easing: $motion-ease-easing
    properties: [rotate]
    note: "0 → 90° — 모션 줄이기면 바로"
  "하위 묶음 — 펼침 · 접힘":
    duration: $motion-duration-d6
    easing: $motion-ease-easing
    properties: [height]
    note: "Accordion 과 같은 300ms(사용자 결정 3A) — 펼쳐도 초점은 그 항목에 그대로"
  "모션 줄이기 — 펼침 · 접힘":
    duration: $motion-duration-d3
    easing: $motion-ease-easing
    properties: [opacity]
    note: "높이를 움직이지 않고 150ms 서서히(v104)"
  "누름 · 호버 — 바탕":
    duration: $motion-duration-color-transition
    easing: $motion-ease-easing
    properties: [background-color]
  "누름 — 콘텐츠":
    duration: $motion-duration-pressed-scale
    easing: $motion-ease-pressed-scale
    properties: [scale]
    note: "모션 줄이기면 하지 않는다"
