# Logo Tile 의 수치 원본 — 물건(은행 · 증권 · 카드 · 코인 · 금 자산 · 회사)을 보이는 각진 타일
# (2026-10-04 사용자 결정, 이미지 비교 페이지 5A · 6B · "따라오는 것"). 사람은 Avatar(원)다.
# 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md. 기관 색은 institution-colors.yaml.
#
# 모양 · 크기는 List 의 타일 — 40 기본 · 48 · 32, 모서리 크기 × 0.3(12 · 14 · 10).
# 면은 기관 색(표에 있으면) 또는 이름 색(Avatar 의 이름 해시 — 차트 10색), 가운데 첫 글자(Avatar 규칙 — 글자 단위 첫 글자, 로마자 대문자).
# 그림(카드 그림 · 로고 그림)이 있으면 첫 글자를 먼저 그리고 그림이 오면 덮는다 — 실패하면 첫 글자 그대로(Avatar 와 같다, 스켈레톤을 두지 않는다).
# 안쪽 1px 투명 윤곽(stroke-neutral-overlay, v118)을 늘 그린다 — 짙은 타일이 다크 표면에, 노랑 타일이 흰 표면에 묻히지 않는다.
#
# 이름 — 기관이 있으면 기관 이름("신한"), 없으면 자산 이름("비상금"). 첫 글자 · 기관 색 찾기 · 이름 색 · 보조 기술의 이름이 모두 이 이름이다.
# 기관 색 표는 기관 이름으로만 찾는다(face institution) — 사용자가 지은 자산 이름 · HR 회사 이름은 표를 보지 않는다(face name).
# 표의 짧은 별칭("우리" · "하나" · "국민" · "기업")이 "우리 아이 적금" · "하나투어" 같은 이름에 걸리지 않게.
# 글자색 — 기관 색 면은 표의 text(white = static-white, dark = 라이트 fg-neutral · 다크 fg-neutral-inverted — 78곳 모두 4.52 이상),
#   이름 색 면은 fg-neutral-inverted(Avatar 와 같다 — 라이트 흰 · 다크 짙은 글자, 4.55 ~ 7.70).
#
# SEED 에는 물건 타일이 없다 — 가게 · 업체는 원 Avatar(Identity Placeholder business), 물건 사진은 Image Frame, 로고 규칙은 출처에 없다.
# groo 는 사람만 Avatar 로 두고(2026-10-03) 물건은 이 타일이다.

name: LogoTile

slots:
  root: 타일 — 정사각 · 모서리 크기 × 0.3. 기관 색 면 또는 이름 색 면
  initial: 첫 글자 — 이름의 첫 글자 하나(Avatar 규칙). 그림이 덮기 전 · 그림이 없을 때 · 실패했을 때
  plate: 그림 판 — 그림이 오면 첫 글자를 덮는다. 카드 그림은 옅은 판, 로고 그림은 흰 판
  image: 그림 — 카드 그림(카드 전체 — 세로는 돌린다) · 로고 그림(잘리지 않게)
  stroke: 안쪽 1px 윤곽 — 면 · 판 · 그림 위에 늘

variants:
  size:
    "32": 32 — 좁은 줄 · 고르는 목록 · 카드 옆의 회사 표시(HR 회사 로고)
    "40": 40 — 목록 줄(자산 · 계좌 관리 · 카드 추가) — 기본, List 타일과 같다
    "48": 48 — 상세 머리(자산 상세)
  face:
    institution: 기관(은행 · 증권 · 카드사 · 코인 · 금)의 이름 — 기관 색 표에서 찾아 그 색 면 + 표의 글자색. 표에 없으면 name 과 같다
    name: 기관이 없는 자산(비상금) · 기관이 아닌 회사(HR) — 표를 보지 않고 이름 색(Avatar 해시) + fg-neutral-inverted
  image:
    none: 그림 없음 — 첫 글자 타일(기본, 지금 은행 · 증권 · 코인 · 금은 모두 이것)
    card: 카드 그림 — 옅은 판 위에 카드 전체(세로 그림은 시계 방향 90°)
    logo: 로고 그림 — 흰 판 위에 잘리지 않게(contain)

defaults:
  size: "40"
  face: institution
  image: none

states:
  enabled: 하나뿐 — 누르지 않는다(누르는 자리는 감싼 줄 · 버튼). 막힌 줄에서도 그대로다(아바타 · 사진처럼)

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      root:
        overflow: { value: hidden, note: "모서리로 판 · 그림을 자른다" }
      initial:
        fontWeight: 700
        lineHeight: { value: 1, note: "타일 가운데 — 글자 크기 설정을 따르지 않는 px(타일 안에서 넘치지 않게, Avatar 와 같다)" }
        textTransform: { value: uppercase, note: "이름의 첫 글자 하나(사용자가 보는 글자 단위 — 웹 Intl.Segmenter · 앱 characters.first), 로마자는 대문자. \"신한\" → \"신\" · \"KB국민\" → \"K\" · \"Upbit\" → \"U\". 이름이 비면 글자 없이 chart-gray" }
      plate:
        padding: { value: $spacing-x1, note: "그림은 판 안쪽 4 — 모든 크기 · 두 종류. 타일 모서리에 그림의 모서리가 잘리지 않는다" }
      stroke:
        borderWidth: { value: 1px, note: "안쪽(inset box-shadow) — 크기가 변하지 않는다. 면 · 판 · 그림 위" }
        borderColor: { value: $color-stroke-neutral-overlay, note: "v118 — 검정 4.7% · 다크 흰 5%. 다크 표면과 1.02 인 짙은 남색 타일 둘레도 1.14(윤곽 : 타일)로 잡힌다(장식 — 이름 글이 물건을 알린다)" }

  # ── 크기 — 모서리 × 0.3 · 첫 글자 = 크기의 40% ──────────
  - when: { size: "32" }
    enabled:
      root: { size: 32px, radius: { value: $radius-r2_5, note: "32 × 0.3 = 9.6 → 10" } }
      initial: { fontSize: { value: 13px, note: "크기의 40%(12.8)" } }
  - when: { size: "40" }
    enabled:
      root: { size: 40px, radius: { value: $radius-r3, note: "40 × 0.3 — List 타일과 같다" } }
      initial: { fontSize: { value: 16px, note: "크기의 40%" } }
  - when: { size: "48" }
    enabled:
      root: { size: 48px, radius: { value: $radius-r3_5, note: "48 × 0.3 = 14.4 → 14" } }
      initial: { fontSize: { value: 19px, note: "크기의 40%(19.2)" } }

  # ── 면 ────────────────────────────────────────────────
  - when: { face: institution }
    enabled:
      root: { background: { value: 기관 색, note: "institution-colors.yaml 의 color — 모드를 따르지 않는다(라이트 · 다크 같다). 저장된 자산 색(asset.color)이 아니라 이 표에서 찾는다" } }
      initial: { foreground: { value: 기관 글자색, note: "표의 text — white 면 static-white, dark 면 라이트 fg-neutral · 다크 fg-neutral-inverted(흰 글자가 4.5:1 에 못 미칠 때). 78곳 모두 4.52 이상" } }
  - when: { face: name }
    enabled:
      root: { background: { value: "chart-{이름 색}", note: "이름의 코드 포인트 합 % 10 → 차트 10색(v110 순서) — Avatar 와 같은 함수. 라이트 700 · 다크 800-dark. 웹 · 앱이 같다" } }
      initial: { foreground: { value: $color-fg-neutral-inverted, note: "라이트 흰 · 다크 짙은 글자 — 차트 색 위 4.55 ~ 7.70(Avatar 와 같다)" } }

  # ── 그림 ──────────────────────────────────────────────
  - when: { image: card }
    enabled:
      plate: { background: { value: $color-bg-neutral-weak, note: "옅은 판 — 흰 면 위 1.08 · 다크 1.30" } }
      image:
        objectFit: { value: 카드 전체, note: "판 안(크기 − 8)에 카드 비율(1.586)의 Image Frame — 세로 그림은 시계 방향 90° 돌려 그 안을 cover 로 채운다. 32 → 24 × 15 · 40 → 32 × 20 · 48 → 40 × 25" }
        radius: { value: Image Frame 모서리, note: "그림의 폭으로 — 24 는 4, 32 · 40 은 6. 윤곽도 Image Frame 대로" }
  - when: { image: logo }
    enabled:
      plate: { background: { value: $color-static-white, note: "흰 판 — 두 모드 같다. 로고의 검은 부분이 다크에서 사라지지 않는다" } }
      image:
        objectFit: { value: contain, note: "잘리지 않게 — 판 안(크기 − 8)에 가운데" }
