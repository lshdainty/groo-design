# Command 의 수치 원본 — 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# Input 과 Item 은 상태 종류가 다르다(Input: empty · filled · focus-visible · disabled,
# Item: selected · disabled). states 는 둘을 합친 목록이고, 상태 표는 부품마다
# `#matrix@input` · `#matrix@item` 으로 따로 그린다 — 그 부품이 바뀌는 상태만 줄로 나온다.

name: Command

slots:
  input: CommandInput — wrapper(border-b) + input
  searchIcon: Input 좌측 Search 아이콘
  list: CommandList — 스크롤 영역
  group: CommandGroup — list 내부 여백 컨테이너
  groupHeading: CommandGroup heading
  item: CommandItem
  separator: CommandSeparator
  empty: CommandEmpty — 결과 없음 안내
  shortcut: CommandShortcut

variants: {}

states:
  enabled: (Input 은 empty)
  filled: (Input — enabled filled)
  focus-visible: (input)
  selected: (Item — cmdk `data-[selected=true]`)
  disabled: ""

rules:
  - when: {}
    enabled:
      input:
        height: { value: 40px, note: "Input md spec 정합" }
        background: transparent
        borderColor: (wrapper border-b)
        foreground: { value: $color-text-tertiary, note: placeholder }
        paddingX: { value: $spacing-md, note: "wrapper" }
        paddingY: $spacing-sm
        typography: $text-body-md
      searchIcon:
        size: 16px
      list:
        maxHeight: 300px
        padding: $spacing-xs
      group:
        paddingX: { value: $spacing-xs, note: "group 내부 컨테이너" }
      groupHeading:
        paddingY: $spacing-sm
        paddingX: $spacing-md
        typography: $text-label-sm
        fontWeight: { value: 500, note: "`font-medium`" }
      item:
        background: transparent
        foreground: $color-text-primary
        paddingY: $spacing-sm
        paddingX: $spacing-md
        radius: $radius-sm
        typography: $text-body-md
        gap: { value: $spacing-sm, note: "icon-text" }
      separator:
        marginY: $spacing-xs
      empty:
        paddingY: $spacing-xl
      shortcut:
        fontSize: $text-label-sm
    filled:
      input:
        foreground: $color-text-primary
    focus-visible:
      input:
        borderColor: { value: (wrapper border-b), note: no ring change }
        foreground: $color-text-primary
    selected:
      item:
        background: $color-surface-input
    disabled:
      input:
        background: { value: transparent, note: opacity 0.5 }
        borderColor: —
      item:
        background: { value: transparent, note: opacity 0.5 }
