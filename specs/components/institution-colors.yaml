# 기관 색 표 — 은행 · 증권 · 카드사 · 코인 · 금 기관마다 색 하나(2026-10-04 사용자 결정, 이미지 비교 페이지 4B · 5A · "따라오는 것").
# 쓰는 곳: Logo Tile 의 첫 글자 타일(logo-tile.md) · 그림 없는 카드의 면(Image Frame 의 카드 그림 — image-frame.md, card-art.yaml).
#
# 이 표가 기관 색의 원본이다. 지금 제품의 두 표 — 자산 로고 70곳(웹 shared/lib/groo/bank-colors.ts · 앱 shared/brand/bank_colors.dart)과
# 카드 그림 10곳(웹 entities/card/lib/cardBrand.ts · 앱 features/card/presentation/widgets/card_brand.dart) — 을 합쳤다(78곳 — 자산 70 + 카드사 8,
# 카카오뱅크 · 토스뱅크는 두 표에 다 있어 하나로). 제품은 앱 적용 때 이 표에서 만든다. 기관 코드 · 고르는 화면의 묶음 순서는 제품의 것이다.
# 기관의 브랜드 색이라 DESIGN.md 의 토큰이 아니다 — 모드를 따르지 않고(라이트 · 다크 같다), 화면은 이 표로만 부른다.
# raw hex 는 이 표에만 둔다(DESIGN.md 의 "기관 색" 규칙 — 다른 곳에 기관 색을 적지 않는다).
#
# 찾기 — 웹 · 앱이 같은 순서로. 기관 이름(자산의 기관 · 카드의 카드사)으로만 찾는다 — 사용자가 지은 자산 이름 · HR 회사 이름으로 찾지 않는다
# (짧은 별칭 "우리" · "하나" · "국민" · "기업" 이 "우리 아이 적금" · "하나투어" 에 걸린다).
#   1. 찾는 이름과 표의 name · aliases 의 공백을 모두 뺀다.
#   2. name 또는 aliases 와 같으면 그 기관이다.
#   3. 아니면 찾는 이름에 들어 있는 name · aliases 가운데 가장 긴 것("NH농협카드 올원" → NH농협카드). 대소문자는 그대로 견준다.
#      표의 이름이 찾는 이름을 품는 거꾸로 맞추기(지금 카드 그림 표의 "NH농협" ↔ "NH농협카드")는 하지 않는다.
#   4. 없으면 표에 없는 기관 — Logo Tile 은 이름 색(Avatar 의 이름 해시 — 차트 10색), 카드 면은 Content Placeholder(credit-card).
#
# 글자색(text) — 면 위의 첫 글자 · 회사 이름 · 카드 이름
#   white  static-white(#FFFFFF) — 그 색 위 흰 글자가 4.5:1 이상이면.
#   dark   라이트 fg-neutral(#1A1F2E) · 다크 fg-neutral-inverted(#242938) — 흰 글자가 4.5:1 에 못 미치면. 두 모드 모두 짙은 글자다
#          (면이 모드를 따르지 않으므로 글자도 짙은 채로 둔다 — 다크의 #242938 이 더 밝아 그쪽으로 잰다).
#   흰 글자도 짙은 글자도 4.5:1 에 못 미치는 중간 밝기의 색은 명도만 옮겨 고친다(OKLCH 의 색상 · 채도는 그대로) — 어둡게 해 흰 글자로
#   가는 쪽과 밝게 해 짙은 글자로 가는 쪽 가운데 원래 색과의 차(ΔE2000)가 작은 쪽. 고친 곳은 ci 에 원래 색을 남긴다(5곳, ΔE 0.9 ~ 3.8).
#   줄 끝 주석은 그 글자의 대비다 — 짙은 글자는 "라이트 / 다크".
#
# 같은 회사는 한 색이다. 두 표가 달랐던 곳은 자산 표 값을 쓴다
#   하나   #008485(카드 그림 표 #008C74) — #008C74 는 흰 글자 4.20 · 짙은 글자 3.91 로 어느 쪽도 4.5 에 못 미친다. #008485 는 흰 글자 4.53.
#   NH농협 #00A651(카드 그림 표 #00A149) — #00A149 는 다크의 짙은 글자 4.27. #00A651 은 4.54.
# 그림 없는 카드의 면은 광택 띠 · 그라디언트 없이 이 한 색이다(지금 웹 광택 띠 위 흰 글자는 2.73 까지 떨어진다).
#
# 타일 · 면의 둘레는 Image Frame 과 같은 투명 윤곽(stroke-neutral-overlay, v118)이 잡는다 — 다크 표면(bg-layer-default)과 1.5:1 아래인
# 짙은 남색 17곳(삼성카드 1.27 · 현대카드 1.02 포함), 흰 표면과 1.3:1 아래인 둘(카카오뱅크 · 카카오페이증권 1.28)도 둘레가 보인다.

