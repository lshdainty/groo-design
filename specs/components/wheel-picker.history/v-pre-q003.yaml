# Wheel Picker 의 수치 원본 — 구조는 SEED Wheel Picker(2026-10-03 사용자 결정, 비교 페이지 4 · 8 · 10).
# 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 순서가 있는 값을 세로로 굴려 고르는 휠 — 한 칼럼 이상. porest 에서 쓰는 곳은 셋: Time Picker(오전·오후 · 시 · 분),
# Date Picker 머리의 연 · 월 휠, 월만 고르기(예산 · 홈 · 카드 실적의 달). 휠은 멈춘 뒤에 값을 정하고, 시트 · 팝오버에서는
# "완료" 로 넣는다(input-button.md). 적은 독립 선택지는 Radio · Segmented Control, 많은 목록은 Select, 정해진 목록이 아닌 값은 Text Field.
#
# SEED 와 다른 자리(wheel-picker.md 의 "SEED 와 다른 점")
#   - 안개 높이는 늘 min(높이 × 40%, 항목 3칸) — SEED 는 연 · 월 휠에서 코드 상수 102 를 쓴다(식으로는 123).
#   - 기본 크기는 medium(SEED rootage 는 small, 코드 · React 는 medium — 코드를 따른다).
#   - 키보드 초점은 가운데(고른) 항목 둘레에 안쪽 링 — 링 색은 porest stroke-focus-ring.

name: WheelPicker

slots:
  root: 휠 — 칼럼 묶음을 가운데에 모은다
  column: 칼럼 — 항목 글 폭만큼(좌우 여백 포함). 칼럼마다 Tab 자리 하나
  item: 항목 — 짧은 한 줄 글(숫자 · 짧은 낱말). 버튼 · 링크 · 여러 줄은 넣지 않는다
  indicator: 선택 띠 — 가운데 줄, 칼럼을 모두 가로지른다
  fog: 안개 — 위아래 끝이 바탕으로 흐려진다
  focusRing: 키보드 포커스 링(웹)

variants:
  size:
    small: 36 — 좁은 자리(작은 팝오버)
    medium: 44 — 기본(시각 · 월 고르기 · 연 · 월 휠)
  visibleItems:
    "5": 기본 — 시각 · 월 고르기
    "7": 달력 머리의 연 · 월 휠(요일 줄 + 6주 자리)

defaults:
  size: medium
  visibleItems: "5"

states:
  enabled: 기본
  focused: 웹 — 키보드로 칼럼에 들어오면 고른 항목 둘레에 링
  disabled: 막힌 휠 — 값은 그대로, 굴릴 수도 초점이 갈 수도 없다

rules:
  # ── 공통 ──────────────────────────────────────────────
  - when: {}
    enabled:
      root:
        height: { value: 항목 높이 × 보이는 수, note: "medium 5개 220 · 7개 308, small 5개 180" }
        background: $color-bg-layer-floating
      column:
        width: { value: 항목 글 폭 + 좌우 16, note: "칼럼 묶음은 휠 가운데. 반복(loop)은 칼럼마다 — 끄면 첫 값 · 끝 값에서 멈춘다. 연 · 월 휠(달력 머리 · 달만 고르기)은 연 120 · 월 96 고정(date-picker.yaml)" }
      item:
        paddingX: $spacing-x4
        fontWeight: 500
        foreground: { value: $color-fg-disabled, note: "가운데가 아닌 항목 — 띠에 걸친 부분만 아래 고른 색으로 칠한다(굴리는 동안에도)" }
        selectedForeground: $color-fg-neutral
        numerals: { value: tabular-nums, note: "숫자 폭을 같게" }
      indicator:
        insetX: { value: $spacing-x4, note: "휠 좌우 끝에서 16 들인다" }
        radius: $radius-r2
        background: $color-bg-neutral-weak
      fog:
        height: { value: "min(휠 높이 × 40%, 항목 3칸)", note: "medium 5개 88 · 7개 123 · small 5개 72 — 위아래 끝에서 바탕색으로(gradient-fade-mask)" }
    focused:
      focusRing:
        width: 2px
        offset: { value: -2px, note: "가운데(고른) 항목 둘레 안쪽, 모서리 8 — 키보드로 들어올 때만. 터치 · 마우스로 굴리는 동안은 숨긴다" }
        color: $color-stroke-focus-ring
    disabled:
      item:
        selectedForeground: { value: $color-fg-disabled, note: "고른 항목도 흐리게 — 띠는 남는다" }

  # ── 크기 ──────────────────────────────────────────────
  - when: { size: medium }
    enabled:
      item:
        height: 44px
        typography: { value: $text-t10-static, note: "26 / 35 — 글자 크기 설정을 따르지 않는 px(웹 text-t10-static, 앱 TextScaler.noScaling — SEED t10-static), 휠 칸이 넘치지 않게" }
      indicator:
        height: 44px
  - when: { size: small }
    enabled:
      item:
        height: 36px
        typography: { value: $text-t7-static, note: "20 / 27 — 글자 크기 설정을 따르지 않는 px(웹 text-t7-static, 앱 TextScaler.noScaling — SEED t7-static)" }
      indicator:
        height: 36px

motion:
  "정착 — 끌기를 놓을 때":
    duration: { value: 220ms ~ 360ms, note: "220 + 넘어가는 칸마다 40 — 놓을 때 속도로 최대 3칸 더 간다(마우스). 터치는 브라우저 스크롤 · 스냅의 관성" }
    easing: ease-out cubic
    properties: [scroll]
  "정착 — 휠 · 트랙패드":
    duration: 160ms
    easing: ease-out cubic
    properties: [scroll]
    note: "마지막 휠 입력 120ms 뒤 가까운 칸으로"
  "항목 누르기":
    duration: { value: 부드러운 스크롤, note: "누른 항목을 가운데로 — 멈춘 뒤 값이 정해진다" }
    properties: [scroll]
    note: "모션 줄이기면 모든 이동을 바로(v104)"
