# Snackbar 의 수치 원본 — 구조는 SEED Snackbar(2026-10-02 사용자 결정, 비교 페이지 1 · 3 · 4 · 5 · 9).
# 형식은 button.yaml 머리 주석, 규칙은 specs/CLAUDE.md.
#
# 방금 한 일의 결과 · 뒤에서 끝난 일 · 가볍게 실패한 일을 화면 아래에 잠깐 알린다(토스트). 조치가 필요한 오류 ·
# 계속 보여야 할 경고 · 결정은 여기 두지 않는다 — Callout · Page Banner · Result Section · Alert Dialog(snackbar.md).
#
# SEED 와 다른 자리(snackbar.md 의 "SEED 와 다른 점")
#   - 아이콘 · 액션 색은 반전 짝 역할(v115 — fg-positive-inverted · fg-critical-inverted · fg-brand-inverted).
#     SEED 는 밝은 바탕용 fg.positive · brand 를 그대로 써서 짙은 띠 위에서 대비가 모자란다.
#   - 액션이 있으면 6초(사용자 결정 2026-10-02 — SEED 는 늘 4초).
#   - 글은 Writing v106 대로 문장이면 마침표(SEED 는 한 문장이면 뺀다).
#   - 모션 줄이기면 크기 없이 투명도만(v104 — SEED 는 그대로 돈다).
#   - 보조 기술용 닫기는 키보드 초점이 오면 보인다(SEED 는 안 보이는 채로 Tab 이 선다).
#   - z-index: specs/z-index.md 의 L6(z-snackbar 400) — SEED 는 2147483647.

name: Snackbar

slots:
  region: 자리 — 화면 아래 가운데. 탭 바 · 플로팅 버튼 · 바닥 버튼을 피해 그 위에 선다
  root: 띠 — 짙은 바탕(다크는 밝은 띠), 한 번에 하나
  icon: 아이콘 — 성공 · 실패에만
  content: 글과 액션 — 양 끝에 놓는다
  message: 글 — 무엇이 됐는지 먼저, 줄이지 않는다
  action: 액션 — 하나, 동작 이름(되돌리기 · 잔액 고치기)
  closeButton: 보조 기술용 닫기 — 보이지 않고, 키보드 초점이 오면 띠 오른쪽 끝에 보인다
  focusRing: 키보드 포커스 링(웹)

variants:
  tone:
    neutral: 결과 · 안내 — 아이콘 없음
    positive: 성공을 눈에 띄게 알릴 때 — 체크 아이콘
    critical: 가볍게 실패했을 때(다시 하면 되는 일) — 느낌표 아이콘

defaults:
  tone: neutral

states:
  enabled: 보임
  pressed: 액션 누름 — 2px 거리 축소
  focused: 웹 — 키보드 포커스에만 링(띠 · 액션 · 닫기)

rules:
  - when: {}
    enabled:
      region:
        paddingX: { value: $spacing-x2, note: "화면 끝과 8 — 안전 영역이 있으면 그만큼 더" }
        paddingBottom: { value: $spacing-x2, note: "아래 8 + 안전 영역 — 탭 바 · 플로팅 버튼 · 바닥 버튼이 있으면 그 위 8(안전 영역과 둘 중 큰 쪽 — 탭 바는 안전 영역을 품고 있다)" }
        zIndex: { value: 400, note: "z-snackbar — specs/z-index.md L6. 시트 · 대화상자 · 확인창 위" }
      root:
        width: { value: 100%, note: "자리 폭 — 최대 464, 넓으면 가운데" }
        maxWidth: 464px
        minHeight: 44px
        padding: $spacing-x2_5
        radius: $radius-r2
        background: { value: $color-bg-neutral-inverted, note: "다크에서는 밝은 띠" }
        shadow: { value: none, note: "그림자 없이 면 색으로 뜬다(SEED · Elevation)" }
        duration: { value: 4000ms, note: "액션이 있으면 6000ms. 마우스 · 손가락 · 키보드 초점이 머무는 동안 멈추고, 떠나면 처음부터 다시 센다" }
      icon:
        size: { value: 24px, note: "lucide 선 아이콘 — 체크(circle-check) · 느낌표(circle-alert). 오른쪽 여백 2 를 이 칸 안에 둬 그림은 22 다(SEED 와 같다 — 글은 띠 가장자리에서 40)" }
        paddingRight: { value: $spacing-x0_5, note: "칸 안쪽 — 칸을 넓히지 않는다" }
      content:
        paddingX: { value: $spacing-x1_5, note: "글은 띠 가장자리에서 16(아이콘이 있으면 40)" }
        gap: { value: $spacing-x2_5, note: "글과 액션은 양 끝 — 사이는 적어도 10" }
      message:
        typography: { value: $text-t4, note: "단어 단위 줄바꿈(v114) — 줄 수를 자르지 않는다(2026-09-22). 두 줄 안에서 끝나게 쓴다" }
        fontWeight: 400
        foreground: $color-fg-neutral-inverted
      action:
        typography: $text-t4
        fontWeight: 700
        foreground: { value: $color-fg-brand-inverted, note: "반전 짝(v115) — 짙은 띠 위 Desk 6.90 · HR 7.05, 다크의 밝은 띠 위 7.76 · 4.69" }
        touchTarget: { value: 글 + 좌우 8 × 44, note: "띠 높이 안에서 위아래로 넓힌다" }
        radius: { value: $radius-r1, note: "바탕이 없어 초점 링에만 보인다" }
      closeButton:
        size: { value: 44px, note: "평소에는 보이지 않는다(보조 기술은 읽는다) — 키보드 초점이 오면 띠 오른쪽 끝에 X 16 으로 보인다" }
        iconSize: 16px
        color: $color-fg-neutral-inverted
        radius: { value: $radius-r2, note: "바탕이 없어 초점 링에만 보인다" }
        margin: { value: "위 · 아래 · 오른쪽 −10", note: "띠 여백(10) 안으로 들어와 띠 높이를 44 로 둔다" }
    pressed:
      action:
        scale: { value: 2px 거리 축소, note: "글만 준다 — 모션 줄이기면 하지 않는다" }
        scaleDuration: $motion-duration-pressed-scale
        scaleEasing: $motion-ease-pressed-scale
    focused:
      focusRing:
        width: 2px
        offset: { value: -4px, note: "띠 · 닫기 — 안쪽 4. 링이 띠 글자색이라 바깥(페이지 위)에 그리면 보이지 않는다" }
        actionOffset: { value: 2px, note: "액션 — 바깥 2. 띠 여백 안이라 띠 위에 그려진다" }
        color: { value: $color-fg-neutral-inverted, note: "띠 글자색 — 브랜드 링은 짙은 띠 위에서 Desk 1.96 이라 3:1 에 못 미친다" }

  # ── 아이콘 색 ──────────────────────────────────────────
  - when: { tone: positive }
    enabled:
      icon:
        color: { value: $color-fg-positive-inverted, note: "반전 짝(v115) — 짙은 띠 위 6.87, 다크의 밝은 띠 위 4.70" }
  - when: { tone: critical }
    enabled:
      icon:
        color: { value: $color-fg-critical-inverted, note: "반전 짝(v115) — 짙은 띠 위 6.89, 다크의 밝은 띠 위 4.68" }

motion:
  "나타남":
    duration: $motion-duration-d3
    easing: $motion-ease-enter
    properties: [scale 0.8 → 1, opacity 0 → 1]
    note: "가운데를 기준점으로 — 모션 줄이기면 투명도만(v104)"
  "사라짐":
    duration: $motion-duration-d2
    easing: $motion-ease-exit
    properties: [scale → 0.8, opacity → 0]
  "새 것으로 바꿈":
    duration: $motion-duration-d2
    easing: $motion-ease-exit
    properties: [지금 것 사라짐 → 새 것 나타남]
    note: "한 번에 하나 — 새 것이 오면 지금 것을 바로 바꾼다"
