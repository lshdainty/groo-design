server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ── 보안 헤더(보안 점검 INF-9) ─────────────────────────────────────────────
    # nginx 함정: location 안에 add_header 가 **하나라도** 있으면 server 의 add_header 를
    # 물려받지 않는다. 그래서 add_header 를 쓰는 location 마다 같은 줄을 다시 적는다 —
    # 한 곳이라도 빠뜨리면 그 응답에는 보안 헤더가 하나도 안 붙는다.
    #  · Referrer-Policy 는 strict-origin-when-cross-origin 이어야 한다. no-referrer · same-origin 으로
    #    조이면 sso 로그아웃 화면이 직전 페이지(우리 사이트)를 못 알아봐 매번 확인 화면을 띄운다.
    #  · 스크립트 CSP(script-src)는 아직 넣지 않는다(후속) — 여기 CSP 는 frame-ancestors 하나뿐이다.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # next export 는 /docs/foo 를 docs/foo.html 로 낸다. SPA 가 아니라 없는 경로는 404 다.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # 파일명에 해시가 든 빌드 산출물
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    error_page 404 /404.html;
}
